<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NaverMaps Memo</title>

    <!-- PWA / iOS Icons -->
    <link rel="apple-touch-icon" href="icon-solid.png">
    <link rel="icon" type="image/png" href="icon-solid.png">

    <!-- Google Material Icons (Material Symbols) -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        :root {
            --bg-color: #0a1128;
            /* 與 icon-solid.png 底色相同 */
            --header-bg: #0a1128;
            --text-main: #ffffff;
            --text-secondary: #a0aec0;
            --accent-green: #8ed93f;
            --accent-teal: #46d1e0;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 滿版封面 Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease-in-out, visibility 1s;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .splash-logo {
            width: 200px;
            height: 200px;
            margin-bottom: 2rem;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .splash-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-teal));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .version-info {
            position: absolute;
            bottom: 2rem;
            width: 100%;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* 主畫面 Header */
        header {
            position: sticky;
            top: 0;
            width: 100%;
            background-color: var(--header-bg);
            padding: 1rem;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-logo {
            width: 40px;
            height: 40px;
            margin-right: 1rem;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        /* 內容區塊 */
        main {
            padding: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* 小卡片樣式 */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.3s ease, background 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
        }

        .card-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--accent-teal);
        }

        .card-orig-name {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .card-desc {
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .card.expanded .card-desc {
            -webkit-line-clamp: unset;
            line-clamp: unset;
            display: block;
        }

        .toggle-desc {
            background: none;
            border: none;
            color: var(--accent-teal);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.5rem 0;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin-bottom: 1rem;
            width: fit-content;
        }

        .toggle-desc:hover {
            text-decoration: underline;
        }

        .toggle-desc .material-symbols-outlined {
            font-size: 1.1rem;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .tag {
            background: rgba(142, 217, 63, 0.2);
            color: var(--accent-green);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .btn-naver {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-green), #6ab72a);
            color: #000;
            text-decoration: none;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-weight: 700;
            text-align: center;
            transition: opacity 0.2s;
            margin-bottom: 1.5rem;
        }

        .btn-naver:active {
            opacity: 0.8;
        }

        .references {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--card-border);
        }

        .ref-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-teal);
            font-size: 0.85rem;
            text-decoration: none;
            margin-bottom: 0.5rem;
        }

        .ref-link:hover {
            text-decoration: underline;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        /* 載入中狀態 */
        .loading-text {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        @media (max-width: 600px) {
            .content-grid {
                grid-template-columns: 1fr;
            }

            .splash-title {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <!-- 滿版封面 -->
    <div id="splash-screen">
        <img src="icon.png" alt="Logo" class="splash-logo">
        <h1 class="splash-title">NaverMaps Memo</h1>
        <div class="version-info" id="version-display">版本：正在讀取...</div>
    </div>

    <!-- 主畫面 Header -->
    <header>
        <img src="icon.png" alt="Logo" class="header-logo">
        <span class="header-title">NaverMaps Memo</span>
    </header>

    <!-- 內容區塊 -->
    <main>
        <div id="content" class="content-grid">
            <div class="loading-text">資料載入中...</div>
        </div>
    </main>

    <script>
        // 自動生成版本時間（台北時間）
        function updateVersion() {
            const lastMod = new Date(document.lastModified);

            // 格式化為 yyyy-mm-dd hh:mi:ss
            const y = lastMod.getFullYear();
            const m = String(lastMod.getMonth() + 1).padStart(2, '0');
            const d = String(lastMod.getDate()).padStart(2, '0');
            const hh = String(lastMod.getHours()).padStart(2, '0');
            const mm = String(lastMod.getMinutes()).padStart(2, '0');
            const ss = String(lastMod.getSeconds()).padStart(2, '0');

            document.getElementById('version-display').textContent = `版本：${y}-${m}-${d} ${hh}:${mm}:${ss}`;
        }

        // 淡出封面
        function hideSplash() {
            const splash = document.getElementById('splash-screen');
            splash.classList.add('fade-out');
            // 動畫結束後移除元素以釋放資源
            setTimeout(() => splash.remove(), 1000);
        }

        // 資料處理與渲染
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwbS7dJKnllCnZCcYWRogpeV5N8do80Dl4v7rigUA6q-7s0bkQsBkn24h_OZ4oF0dqt/exec';

        async function loadData() {
            try {
                // 如果沒有提供正式 URL，則顯示範例資料（供開發測試）
                let data;
                if (GAS_URL.includes('YOUR_APPS_SCRIPT_URL')) {
                    console.warn("未設定 GAS URL，使用模擬測試資料。");
                    data = getMockData();
                } else {
                    const response = await fetch(GAS_URL);
                    data = await response.json();
                }

                renderCards(data);
            } catch (err) {
                console.error("資料載入失敗:", err);
                document.getElementById('content').innerHTML = '<div class="loading-text">無法載入資料，請檢查網路或 GAS 設定。</div>';
            } finally {
                // 無論成功失敗，一段時間後淡出封面
                setTimeout(hideSplash, 1500);
            }
        }

        function renderCards(data) {
            const container = document.getElementById('content');
            container.innerHTML = '';

            const { attractions, tags, relationships, references } = data;

            attractions.forEach(attr => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.id = attr.id;

                // 處理標籤
                const attrTags = relationships
                    .filter(r => r.attraction_id === attr.id)
                    .map(r => tags.find(t => t.id === r.tag_id)?.tag_name)
                    .filter(name => name);

                // 處理連結
                const attrRefs = references.filter(r => r.attraction_id === attr.id);

                card.innerHTML = `
                    <div class="card-name">${attr.name_cn}</div>
                    <div class="card-orig-name">${attr.name_orig || ''}</div>
                    
                    <a href="${attr.naver_map_url}" target="_blank" class="btn-naver">
                        <span class="material-symbols-outlined">map</span>
                        在 Naver Map 開啟
                    </a>

                    <div class="tag-container">
                        ${attrTags.map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>

                    <div class="card-desc" id="desc-${attr.id}">${attr.description || ''}</div>
                    <button class="toggle-desc" id="btn-${attr.id}" style="display: none;">
                        <span class="text">展開內容</span>
                        <span class="material-symbols-outlined">expand_more</span>
                    </button>
                    
                    ${attrRefs.length > 0 ? `
                        <div class="references">
                            ${attrRefs.map(r => {
                    const displayText = r.url_description || r.url;
                    return `<a href="${r.url}" target="_blank" class="ref-link">
                                    <span class="material-symbols-outlined" style="font-size: 1.2rem;">link</span>
                                    <span>${displayText}</span>
                                </a>`;
                }).join('')}
                        </div>
                    ` : ''}
                `;
                container.appendChild(card);

                const descEl = document.getElementById(`desc-${attr.id}`);
                const btnEl = document.getElementById(`btn-${attr.id}`);

                // 檢查是否需要顯示展開按鈕（高度超過 3 行）
                setTimeout(() => {
                    if (descEl.scrollHeight > descEl.clientHeight) {
                        btnEl.style.display = 'flex';
                    }
                }, 100);

                btnEl.onclick = (e) => {
                    e.stopPropagation();
                    const isExpanded = card.classList.contains('expanded');
                    if (isExpanded) {
                        collapseCard(card);
                    } else {
                        // 先收合其他的
                        document.querySelectorAll('.card.expanded').forEach(c => collapseCard(c));
                        expandCard(card);
                    }
                };

                // 點擊卡片任何地方（除了連結和按鈕）也可以觸發收合其他卡片的邏輯
                card.onclick = (e) => {
                    if (e.target.tagName === 'A' || e.target.closest('a') || e.target.closest('.btn-naver') || e.target.closest('.toggle-desc')) return;

                    // 點擊卡片其他地方，收合其他卡片
                    document.querySelectorAll('.card.expanded').forEach(c => {
                        if (c !== card) collapseCard(c);
                    });
                };

                // 加入觀察者：若捲動出螢幕則自動收合
                scrollObserver.observe(card);
            });
        }

        function expandCard(card) {
            card.classList.add('expanded');
            const btn = card.querySelector('.toggle-desc');
            if (btn) {
                btn.querySelector('.text').textContent = '收合內容';
                btn.querySelector('.material-symbols-outlined').textContent = 'expand_less';
            }
        }

        function collapseCard(card) {
            card.classList.remove('expanded');
            const btn = card.querySelector('.toggle-desc');
            if (btn) {
                btn.querySelector('.text').textContent = '展開內容';
                btn.querySelector('.material-symbols-outlined').textContent = 'expand_more';
            }
        }

        // 偵測捲動：當卡片完全消失在螢幕時收合
        const scrollObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (!entry.isIntersecting && entry.target.classList.contains('expanded')) {
                    collapseCard(entry.target);
                }
            });
        }, { threshold: 0 });

        // 全域點擊點到卡片之外時也收合
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.card')) {
                document.querySelectorAll('.card.expanded').forEach(c => collapseCard(c));
            }
        });

        // 開發測試用的模擬資料 (對應 setupDatabase.gs)
        function getMockData() {
            return {
                attractions: [
                    { id: 'attr01', name_cn: '景福宮', name_orig: '경복궁', naver_map_url: 'https://naver.me/Fw7iyAYH', description: '朝鮮王朝的主要皇宮。' },
                    { id: 'attr02', name_cn: '明洞商圈', name_orig: '명동', naver_map_url: 'https://naver.me/xWIcPz8f', description: '熱鬧的購物與美食街。' }
                ],
                tags: [
                    { id: 'tag01', tag_name: '歷史景點' },
                    { id: 'tag02', tag_name: '購物' },
                    { id: 'tag03', tag_name: '美食' }
                ],
                relationships: [
                    { attraction_id: 'attr01', tag_id: 'tag01' },
                    { attraction_id: 'attr02', tag_id: 'tag02' },
                    { attraction_id: 'attr02', tag_id: 'tag03' }
                ],
                references: [
                    { attraction_id: 'attr01', url: 'https://www.royalpalace.go.kr', url_description: '景福宮官網' },
                    { attraction_id: 'attr02', url: 'https://catchtable.co.kr/example', url_description: 'CatchTable 訂位網址' },
                    { attraction_id: 'attr02', url: 'https://www.myeongdong.co.kr', url_description: '明洞指南' }
                ]
            };
        }

        // 初始化
        updateVersion();
        window.addEventListener('load', loadData);
    </script>
</body>

</html>
