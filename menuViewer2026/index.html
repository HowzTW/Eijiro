<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Google Fonts: Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
        rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --primary-color: #d32f2f;
            /* Imperial Red */
            --secondary-color: #00897b;
            /* Jade Green */
            --accent-color: #ffb300;
            /* Gold */
            --bg-color: #fff9f0;
            /* Warm paper color */
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-light: #7f8c8d;
            --spacing-base: 16px;
            --radius: 16px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            overflow-x: hidden;
            /* Elderly friendly basics */
            font-size: 20px;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 30px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            margin: 5px 0 0;
            font-size: 18px;
            opacity: 0.9;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 100px;
        }

        .category-section {
            margin-bottom: 40px;
            translate: 0 20px;
            opacity: 0;
            animation: slideUp 0.6s forwards;
        }

        @keyframes slideUp {
            to {
                translate: 0 0;
                opacity: 1;
            }
        }

        .category-title {
            font-size: 28px;
            color: var(--secondary-color);
            border-left: 8px solid var(--primary-color);
            padding-left: 15px;
            margin-bottom: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            background: linear-gradient(to right, #fde8e8, transparent);
            padding-top: 5px;
            padding-bottom: 5px;
            border-radius: 4px;
        }

        .dish-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border-left: 1px solid #eee;
            transition: var(--transition);
        }

        .dish-card:active {
            scale: 0.98;
        }

        .dish-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .size-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed #eee;
        }

        .size-option:last-child {
            border-bottom: none;
        }

        .size-info {
            flex: 1;
        }

        .size-label {
            font-size: 20px;
            font-weight: 500;
        }

        .size-price {
            display: block;
            color: var(--primary-color);
            font-weight: 700;
            font-size: 20px;
        }

        .stepper {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            border-radius: 30px;
            padding: 4px;
            border: 2px solid #edeff0;
        }

        .stepper button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: white;
            color: var(--secondary-color);
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: var(--transition);
        }

        .stepper button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            box-shadow: none;
        }

        .stepper button:active:not(:disabled) {
            background: var(--secondary-color);
            color: white;
            scale: 0.9;
        }

        .stepper .count {
            width: 40px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            margin: 0 5px;
        }

        /* Floating Button */
        #cart-btn {
            position: fixed;
            bottom: 30px;
            right: 20px;
            width: 80px;
            height: 80px;
            background-color: var(--secondary-color);
            color: white;
            border-radius: 50%;
            border: none;
            box-shadow: 0 8px 30px rgba(0, 137, 123, 0.4);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        #cart-btn:active {
            scale: 0.85;
            box-shadow: 0 4px 15px rgba(0, 137, 123, 0.4);
        }

        #cart-btn i {
            font-size: 32px;
        }

        #cart-btn .badge {
            position: absolute;
            top: 0;
            right: 0;
            background-color: var(--primary-color);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }

        #cart-btn .label {
            font-size: 14px;
            font-weight: 700;
            margin-top: -2px;
        }

        /* Modal */
        #cart-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 300;
            display: none;
            justify-content: center;
            align-items: flex-end;
        }

        #cart-modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 600px;
            border-radius: 30px 30px 0 0;
            padding: 30px 20px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            animation: slideFromBottom 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideFromBottom {
            from {
                translate: 0 100%;
            }

            to {
                translate: 0 0%;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 28px;
            color: var(--primary-color);
        }

        #close-cart,
        #print-cart {
            background: #f0f0f0;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        #print-cart {
            background: #e0f2f1;
            color: var(--secondary-color);
            margin-right: 10px;
            display: none;
            /* Hidden by default, shown when cart has items */
        }

        #print-cart:active {
            scale: 0.9;
            background: var(--secondary-color);
            color: white;
        }

        .cart-items {
            overflow-y: auto;
            flex: 1;
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            gap: 10px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 700;
            font-size: 20px;
        }

        .cart-item-sub {
            font-size: 16px;
            color: var(--text-light);
            margin-top: 4px;
        }

        .cart-item-price {
            text-align: right;
            font-weight: 700;
            color: var(--primary-color);
        }

        .cart-total {
            background: #fff8f8;
            padding: 20px;
            border-radius: var(--radius);
            margin-top: 10px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: 900;
            color: var(--primary-color);
        }

        .empty-cart {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }

        .empty-cart i {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        /* Footer Action */
        footer {
            margin-top: 40px;
            padding: 40px 20px;
            text-align: center;
            background: #eee;
            border-radius: var(--radius);
        }

        .pdf-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: white;
            color: var(--primary-color);
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 20px;
            border: 2px solid var(--primary-color);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: var(--transition);
        }

        .pdf-btn:active {
            scale: 0.95;
            background: var(--primary-color);
            color: white;
        }

        /* Custom Scrollbar for elderly */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }

        /* Micro-animations */
        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .header-reload-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            translate: 0 -50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: white;
            border-radius: 12px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
            line-height: 1;
        }

        .header-reload-btn:active {
            scale: 0.9;
            background: white;
            color: var(--primary-color);
        }

        .header-reload-btn i {
            font-size: 26px;
            margin-bottom: 2px;
        }

        .header-reload-btn span {
            font-size: 12px;
            font-weight: 900;
        }
    </style>
</head>

        let cart = {}; // Key format: "DishName-Size"

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            menuData.forEach((cat, catIdx) => {
                const section = document.createElement('div');
                section.className = 'category-section';
                section.style.animationDelay = `${catIdx * 0.1}s`;

                const title = document.createElement('div');
                title.className = 'category-title';
                title.innerHTML = `<span>${cat.category}</span>`;
                section.appendChild(title);

                cat.items.forEach(dish => {
                    const card = document.createElement('div');
                    card.className = 'dish-card';

                    const dishName = document.createElement('div');
                    dishName.className = 'dish-name';
                    dishName.textContent = dish.name;
                    card.appendChild(dishName);

                    dish.options.forEach(opt => {
                        const row = document.createElement('div');
                        row.className = 'size-option';

                        const info = document.createElement('div');
                        info.className = 'size-info';
                        info.innerHTML = `
                        <span class="size-label">${opt.size}</span>
                        <span class="size-price">$${opt.price}</span>
                    `;
                        row.appendChild(info);

                        const stepper = document.createElement('div');
                        stepper.className = 'stepper';

                        const cartKey = `${dish.name}-${opt.size}`;
                        const count = cart[cartKey] ? cart[cartKey].qty : 0;

                        stepper.innerHTML = `
                        <button onclick="updateQty('${dish.name}', '${opt.size}', ${opt.price}, -1)" ${count === 0 ? 'disabled' : ''}>-</button>
                        <div class="count">${count}</div>
                        <button onclick="updateQty('${dish.name}', '${opt.size}', ${opt.price}, 1)" ${count === 5 ? 'disabled' : ''}>+</button>
                    `;
                        row.appendChild(stepper);
                        card.appendChild(row);
                    });

                    section.appendChild(card);
                });
                container.appendChild(section);
            });
        }

        function updateQty(name, size, price, delta) {
            const key = `${name}-${size}`;
            if (!cart[key]) {
                cart[key] = { name, size, price, qty: 0 };
            }

            cart[key].qty += delta;

            if (cart[key].qty <= 0) {
                delete cart[key];
            } else if (cart[key].qty > 5) {
                cart[key].qty = 5;
            }

            renderMenu();
            updateCartUI();

            // Add a little pop effect to the cart button
            const btn = document.getElementById('cart-btn');
            btn.classList.add('pulse');
            setTimeout(() => btn.classList.remove('pulse'), 500);
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const list = document.getElementById('cart-items-list');
            const footer = document.getElementById('cart-footer');
            const printBtn = document.getElementById('print-cart');

            let totalItems = 0;
            let grandTotal = 0;

            list.innerHTML = '';

            const cartKeys = Object.keys(cart);

            if (cartKeys.length === 0) {
                badge.style.display = 'none';
                printBtn.style.display = 'none';
                list.innerHTML = `
                <div class="empty-cart">
                    <i class="ph-bold ph-shopping-cart"></i>
                    <p>尚未點選任何菜色</p>
                </div>
            `;
                footer.innerHTML = '';
            } else {
                badge.style.display = 'flex';
                printBtn.style.display = 'flex';
                cartKeys.forEach(key => {
                    const item = cart[key];
                    totalItems += item.qty;
                    const subtotal = item.price * item.qty;
                    grandTotal += subtotal;

                    const itemEl = document.createElement('div');
                    itemEl.className = 'cart-item';
                    itemEl.innerHTML = `
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-sub">${item.size} ($${item.price}) x ${item.qty}</div>
                    </div>
                    <div class="cart-item-price">
                        $${subtotal}
                    </div>
                `;
                    list.appendChild(itemEl);
                });

                badge.textContent = totalItems;
                footer.innerHTML = `
                <div class="cart-total">
                    <div class="total-row">
                        <span>總計</span>
                        <span>$${grandTotal}</span>
                    </div>
                </div>
            `;
            }
        }

        function printCart() {
            const printWindow = window.open('', '_blank');
            const now = new Date();
            const dateStr = now.toLocaleDateString('zh-TW');
            const timeStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

            let itemsHtml = '';
            let grandTotal = 0;

            Object.values(cart).forEach(item => {
                const subtotal = item.price * item.qty;
                grandTotal += subtotal;
                itemsHtml += `
                    <tr>
                        <td>${item.name}</td>
                        <td>${item.size}</td>
                        <td class="text-center">${item.qty}</td>
                        <td class="text-right">$${item.price}</td>
                        <td class="text-right">$${subtotal}</td>
                    </tr>
                `;
            });

            const content = `
                <!DOCTYPE html>
                <html lang="zh-TW">
                <head>
                    <meta charset="UTF-8">
                    <title>點菜單列印 - 翠庭 (JADE)</title>
                    <style>
                        body { font-family: "Noto Sans TC", sans-serif; padding: 40px; color: #333; line-height: 1.4; }
                        .header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
                        h1 { margin: 0; font-size: 24px; }
                        .meta { font-size: 14px; text-align: right; }
                        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
                        th, td { border-bottom: 1px solid #eee; padding: 12px 8px; text-align: left; font-size: 16px; }
                        th { background: #f9f9f9; font-weight: bold; border-bottom: 2px solid #ddd; }
                        .text-center { text-align: center !important; }
                        .text-right { text-align: right !important; }
                        .total-section { margin-top: 30px; text-align: right; border-top: 2px solid #333; padding-top: 10px; }
                        .total-label { font-size: 18px; margin-right: 20px; }
                        .total-amount { font-size: 24px; font-weight: bold; }
                        .footer-note { margin-top: 50px; font-size: 12px; color: #888; text-align: center; border-top: 1px dashed #ccc; padding-top: 10px; }
                        @media print {
                            .no-print { display: none; }
                            body { padding: 0; }
                        }
                        .btn-close { 
                            margin-top: 40px; 
                            padding: 12px 30px; 
                            background: #666; 
                            color: white; 
                            border: none; 
                            border-radius: 4px; 
                            cursor: pointer;
                            font-size: 16px;
                        }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h1>我的點菜單 - 翠庭 (JADE)</h1>
                        <div class="meta">
                            <div>列印日期：${dateStr}</div>
                            <div>時間：${timeStr}</div>
                        </div>
                    </div>
                    
                    <table>
                        <thead>
                            <tr>
                                <th>品名</th>
                                <th>規格</th>
                                <th class="text-center">數量</th>
                                <th class="text-right">單價</th>
                                <th class="text-right">小計</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsHtml}
                        </tbody>
                    </table>
                    
                    <div class="total-section">
                        <span class="total-label">總計金額</span>
                        <span class="total-amount">$${grandTotal}</span>
                    </div>

                    <div class="footer-note">
                        * 此清單僅供參考，請以櫃檯結帳金額為準 *
                    </div>

                    <div class="no-print" style="text-align: center;">
                        <button class="btn-close" onclick="window.close()">關閉視窗</button>
                    </div>

                    <script>
                        window.onload = function() {
                            setTimeout(() => {
                                window.print();
                            }, 500);
                        };
                    <\/script>
                </body>
                </html>
            `;

            printWindow.document.write(content);
            printWindow.document.close();
        }

        // Modal Control
        document.getElementById('cart-btn').addEventListener('click', () => {
            document.getElementById('cart-modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        });

        document.getElementById('close-cart').addEventListener('click', () => {
            document.getElementById('cart-modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        });

        // Initial Render
        renderMenu();
        updateCartUI();
    </script>

</body>

</html>
