<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#221244">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>每日箴言小卡產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{background:#221244} /* overscroll 回彈時不露白 */
:root{
  --bg1:#221244;--bg2:#3b1d63;--bg3:#122a52;
  --gold:#f0c04a;--gold-2:#e0a23a;
  --ink:#f5f2ff;
  --ink-dim:rgba(245,242,255,.62);
  --glass:rgba(255,255,255,.09);
  --stroke:rgba(255,255,255,.20);
  --field:rgba(9,5,28,.35);
  --r-l:20px;--r-m:13px;
  --shadow:0 10px 34px rgba(8,4,30,.38);
}
body{
  margin:0;color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.6;
  background:linear-gradient(136deg,var(--bg1) 0%,var(--bg2) 46%,var(--bg3) 100%) fixed;
  min-height:100vh;
}
/* 兩顆柔光暈：紫光（左上）與金光（右下），呼應圖卡的金色 */
body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(90px)}
body::before{width:52vw;height:52vw;left:-14vw;top:-16vw;background:rgba(168,85,247,.30)}
body::after{width:46vw;height:46vw;right:-12vw;bottom:-14vw;background:rgba(240,176,74,.20)}
.wrap{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:26px 18px 48px;padding-top:calc(26px + env(safe-area-inset-top,0px))}
/* iOS 主畫面 App：狀態列底下的固定毛玻璃底條，捲動內容從其下方穿過，時間電量保持可讀 */
.statusbar-backdrop{
  position:fixed;top:0;left:0;right:0;
  height:env(safe-area-inset-top,0px);
  background:rgba(20,10,45,.72);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
  z-index:99;pointer-events:none;
}
.app-head{display:flex;align-items:center;gap:16px;margin:6px 0 26px}
.app-head .mark{
  font-family:'Material Symbols Rounded';font-size:52px;line-height:1;flex:none;
  background:linear-gradient(135deg,#f6cf6b,#e0a23a);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.app-head h1{font-size:26px;letter-spacing:.04em;margin:0;font-weight:800}
.app-head .sub{margin:2px 0 0;font-size:14px;color:var(--ink-dim);letter-spacing:.14em}
.grid{display:grid;grid-template-columns:minmax(330px,430px) 1fr;gap:22px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:1fr}}
.panel{
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);
  backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--stroke);
  border-radius:var(--r-l);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.14);
  padding:20px 22px;margin-bottom:18px;
}
/* 不支援 backdrop-filter 的瀏覽器改用實色深底，確保可讀性 */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .panel{background:rgba(24,14,52,.88)}
}
.panel h2{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;letter-spacing:.22em;color:var(--gold);margin:0 0 14px}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#f6cf6b,#e0a23a);color:#2c1d07;font-size:13px;letter-spacing:0;flex:none}
label{display:block;font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);margin:12px 0 6px}
input[type=text],textarea{
  width:100%;font-size:16px;font-family:inherit;color:var(--ink);
  background:var(--field);border:1px solid var(--stroke);border-radius:var(--r-m);
  padding:10px 12px;transition:border-color .2s,box-shadow .2s;
}
textarea{resize:vertical;line-height:1.7}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,192,74,.22)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.date-row{position:relative}
button{
  font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);
  background:rgba(255,255,255,.10);border:1px solid var(--stroke);border-radius:var(--r-m);
  padding:10px 16px;cursor:pointer;
  transition:background .2s,transform .15s,box-shadow .2s;
}
button:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
button:active{transform:translateY(0)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.seg{flex:1;display:flex;align-items:stretch;min-width:230px;background:rgba(255,255,255,.07);border:1px solid var(--stroke);border-radius:var(--r-m);overflow:hidden}
.seg button{flex:none;border:0;border-radius:0;background:transparent}
.seg button:hover{background:rgba(255,255,255,.14);transform:none}
.seg .date-display{flex:1;border-left:1px solid var(--stroke);border-right:1px solid var(--stroke);white-space:nowrap;padding:10px 8px}
.mode-seg{flex:none;min-width:0}
.mode-seg button{padding:10px 20px}
.mode-seg button.active{background:linear-gradient(135deg,#f6cf6b,#e0a23a);color:#2c1d07}
.size-seg{min-width:170px;align-items:center}
.size-seg[hidden]{display:none}
.size-seg button:first-child{border-right:1px solid var(--stroke)}
.size-seg button:last-child{border-left:1px solid var(--stroke)}
.size-seg input{flex:1;width:64px;min-width:0;text-align:right;background:transparent;border:0;border-radius:0;color:var(--ink);font-size:16px;font-weight:700;font-family:inherit;padding:10px 2px}
.size-seg input:focus{outline:none}
.size-seg input::-webkit-outer-spin-button,.size-seg input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.size-seg .px{color:var(--ink-dim);font-size:14px;padding:0 10px 0 4px;align-self:center}
.hint.warn{color:#f5b04a;font-weight:700}
#dateInput{position:absolute;left:50%;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none}
#dateInput.exposed{position:static;width:100%;height:auto;opacity:1;pointer-events:auto;font-size:16px;font-family:inherit;color:var(--ink);background:var(--field);padding:10px 12px;border:1px solid var(--stroke);border-radius:var(--r-m);margin-top:10px;color-scheme:dark}
button.primary{
  width:100%;padding:13px;font-size:17px;letter-spacing:.08em;border:none;color:#332108;
  background:linear-gradient(135deg,#f6cf6b,#e0a23a);
  box-shadow:0 8px 22px rgba(224,162,58,.35);
}
button.primary:hover{background:linear-gradient(135deg,#f9d87e,#e8ab42);box-shadow:0 10px 28px rgba(224,162,58,.5);transform:translateY(-1px)}
.dropzone{
  border:1.5px dashed rgba(255,255,255,.35);border-radius:var(--r-m);
  padding:30px 14px;text-align:center;color:var(--ink-dim);cursor:pointer;user-select:none;
  background:rgba(255,255,255,.04);transition:border-color .2s,background .2s,color .2s;
}
.dropzone:hover{border-color:rgba(240,192,74,.6);color:var(--ink)}
.dropzone.dragover{border-color:var(--gold);background:rgba(240,192,74,.10);color:var(--ink)}
.dropzone.loaded{border-style:solid;border-color:rgba(240,192,74,.75);background:rgba(240,192,74,.10);color:var(--gold)}
.hint{font-size:13.5px;color:var(--ink-dim);margin:10px 0 0}
.preview-panel{position:sticky;top:18px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px}
canvas{
  display:block;width:100%;max-width:540px;height:auto;border-radius:14px;
  box-shadow:0 26px 64px rgba(4,2,18,.55),0 0 90px rgba(240,192,74,.12);
  background:#222c40;
}
.canvas-caption{font-size:13px;letter-spacing:.14em;color:var(--ink-dim)}
@media (max-width:880px){.preview-panel{position:static}}
</style>
</head>
<body>
<div class="statusbar-backdrop" aria-hidden="true"></div>
<div class="wrap">
<header class="app-head">
  <div class="mark material-symbols-rounded" aria-hidden="true">add_photo_alternate</div>
  <div>
    <h1>每日箴言小卡產生器</h1>
    <p class="sub">選日期 · 改文字 · 上背景 · 出圖卡</p>
  </div>
</header>
<div class="grid">
  <div>
    <section class="panel">
      <h2><span class="step">1</span>選擇日期</h2>
      <div class="row date-row">
        <div class="seg">
          <button id="btnPrev" type="button" aria-label="前一日" title="前一日">◀</button>
          <button id="btnDate" type="button" class="date-display" title="點擊選擇日期"></button>
          <button id="btnNext" type="button" aria-label="後一日" title="後一日">▶</button>
        </div>
        <button id="btnToday" type="button">今天</button>
        <input id="dateInput" type="date" aria-label="選擇日期">
      </div>
      <p class="hint">點擊中間的日期可開啟日曆直接選擇。</p>
    </section>
    <section class="panel">
      <h2><span class="step">2</span>確認文字</h2>
      <label for="taContent">箴言內容</label>
      <textarea id="taContent" rows="6"></textarea>
      <label for="inSource">出處</label>
      <input id="inSource" type="text">
      <label>主箴言字級</label>
      <div class="row">
        <div class="seg mode-seg">
          <button id="btnSizeAuto" type="button" class="active">自動</button>
          <button id="btnSizeManual" type="button">手動</button>
        </div>
        <div class="seg size-seg" id="sizeSeg" hidden>
          <button id="btnSizeDown" type="button" aria-label="減小字級">−</button>
          <input id="sizeInput" type="number" min="24" max="240" step="8" aria-label="字級（px）">
          <span class="px">px</span>
          <button id="btnSizeUp" type="button" aria-label="增大字級">＋</button>
        </div>
      </div>
      <p class="hint warn" id="sizeWarn" hidden>目前字級超出版面，文字可能壓到署名。</p>
      <p class="hint">作者固定為「——池田大作」。修改文字後預覽即時更新。</p>
    </section>
    <section class="panel">
      <h2><span class="step">3</span>上傳背景圖片</h2>
      <div id="dropzone" class="dropzone" tabindex="0"><span id="dropHint">點擊選擇圖片，或將圖片拖放到這裡</span></div>
      <input id="fileInput" type="file" accept="image/*" hidden>
      <p class="hint">背景會自動置中裁切為 3:4（1536×2048）。建議選用主題單純、留白較多的圖片。</p>
    </section>
    <section class="panel">
      <h2><span class="step">4</span>下載</h2>
      <button id="btnDownload" class="primary" type="button">下載 PNG 圖卡</button>
    </section>
  </div>
  <div class="panel preview-panel">
    <canvas id="cv" width="1536" height="2048"></canvas>
    <div class="canvas-caption">直式 3:4 · 1536×2048 · PNG</div>
  </div>
</div>
</div>
<script>
'use strict';
const QUOTES={"12月31日":{"c":"感謝意味著心靈豐富。知道感謝的人是充滿喜悅的，幸福的。","s":"摘自： 《新人間革命》第十七卷〈希望〉"},"12月30日":{"c":"什麼都好，向著某件事去挑戰。在不斷努力的過程中，自然會決定出方向來。","s":"摘自： 《青春對話》"},"12月29日":{"c":"唯有生活在偉大的目標之中，才能領悟到真正的人生樂趣。根本不需要和他人比較。","s":"譯自： 《池田大作全集第六十一卷　對話》"},"12月28日":{"c":"要守信，一旦承諾友人，就要言而有信。這就是友情。為此，也要遵守對自己的承諾。","s":"摘自： 《青春對話》"},"12月27日":{"c":"互相開誠布公地對話交流，能使彼此覺醒到獨自一人至今察覺不到的新景象，通過人格之間的共鳴，能孕育出新的創造性。","s":"摘自： 2016年度《和平倡言》"},"12月26日":{"c":"「只有對話才是和平的王道」——只要人類歷史不停止前進，人類就不得不永遠肩負這一命題。","s":"摘自： 2005年度《和平倡言》"},"12月25日":{"c":"一生不忘卻好學、進取之心，為了自己的目標奮勉不懈——這股熱忱才是青春的標誌。","s":"摘自： 《擁抱未來》"},"12月24日":{"c":"我認為，所謂青春不僅是年齡的、肉體的年輕。到死堅持青年時期的信念，燃燒不熄，這才是真正的青春光輝。","s":"摘自： 《新人間革命》第二十二卷〈新世紀〉"},"12月23日":{"c":"我們的一生是非常寶貴的，所以希望你們持有明確的目的，以及不斷為自己創造奮鬥的目標。","s":"摘自： 香港人才組總會（1998年2月21日，香港）"},"12月22日":{"c":"不論處境怎樣﹐決意成為「太陽」﹐悠然地前進。說到太陽﹐當然也有陰天的時候。但是即使是陰天﹐太陽仍舊是太陽。","s":"摘自： 《青春對話》"},"12月21日":{"c":"打開「對話之窗」就是將這層陰霾抹去的第一步。為了世界和平，我們絕對不能容許任何民族、任何國家被國際社會孤立。","s":"摘自： 《擁抱未來》"},"12月20日":{"c":"人生是挑戰，是奮鬥，是學習，是動腦筋，勝利就在這日積月累之中。","s":"摘自： 《新人間革命》第二十一卷〈共鳴音〉"},"12月19日":{"c":"是時時歡喜、充實、躍動地活到底的力量，是創造性生命。可以說，這就是永遠不會崩潰的幸福源泉。","s":"摘自： 《新人間革命》第二十一卷〈人性外交〉"},"12月18日":{"c":"所謂和平，不單指沒有戰爭的狀態，還應該人與人以信賴相連，從而充滿生存的歡喜、躍動和希望。","s":"摘自： 《新人間革命》第十四卷〈使命〉"},"12月17日":{"c":"生命如清徹的流水，擁有可以洗滌現實污濁的力量。生命如孕育草木的大地，擁有公正保護﹑平等關懷眾人的力量。","s":"譯自： 《池田大作全集第五十三卷　致詞》"},"12月16日":{"c":"按自己的步伐前進，哪怕是一步二步也好。不用在意旁人的閑言閑語，勝利屬於堅韌不拔中度過人生的人。","s":"摘自： 《青春對話》"},"12月15日":{"c":"森羅萬象，一切都是「緣起」，即由因緣而產生。因為一切事物是互相依靠著，沒有東西是無用的，也不會有無意義的東西。","s":"摘自： 特里布文大學演講（1995年11月2日，尼泊爾）"},"12月14日":{"c":"離開實現和平就沒有宗教。為和平做貢獻是宗教人士應該完成的第一使命。","s":"摘自： 《新人間革命》第十六卷〈舉翼〉"},"12月13日":{"c":"加深友情，首先要加深本身對他人的關心。","s":"摘自： 《新人間革命》第二十卷〈信義的繫絆〉"},"12月12日":{"c":"始終不改真誠的態度﹐自然而然會聚來好的友人。","s":"摘自： 《青春對話》"},"12月11日":{"c":"出自強烈的信念和堅定的決心，拼命的誠摯行動必將打開任何局面。","s":"摘自： 《新人間革命》第二十卷〈友誼之路〉"},"12月10日":{"c":"要建構不以眼前利害得失為重的社會。為此，首先要自尊自重，有自信、毅然地生存。這樣的人也能重視他人。","s":"摘自： 《青春對話》"},"12月09日":{"c":"小事故是大事故的警鐘。去除粗心大意，轉變一念，一切都重新檢查、重新考慮，就能防止大事故或失敗於未然。","s":"摘自： 《新人間革命》第二十二卷〈潮流〉"},"12月08日":{"c":"佛法是為了誰而說的？不如說是為了使受到歧視、虐待、淪於「最痛苦」的人們，成為「最幸福」的人而說的。","s":"摘自： 《法華經的智慧》"},"12月07日":{"c":"人生不可能一帆風順，反倒是困難重重。要跨越過去，就必須自覺自己的使命，由此產生希望。","s":"摘自： 《新人間革命》第十六卷〈對話〉"},"12月06日":{"c":"任何時候都朝著未來，滿懷希望，雄壯有力地前進，這本身就是人生的勝利。","s":"摘自： 《新人間革命》第十六卷〈舉翼〉"},"12月05日":{"c":"如果沒有對話，人類只得在獨善其身的黑暗中摸索。對話可說是在黑暗中互相照亮對方足下，找出應行之道的燈火。","s":"摘自： 2002年度《和平倡言》"},"12月04日":{"c":"歡喜是活力之源。它帶來生命的躍動，突破困難的障礙。","s":"摘自： 《新人間革命》第二十二卷〈波濤〉"},"12月03日":{"c":"無論發生什麽也不畏懼——這是幸福的根本。不管遇到什麽也儼然前進──這是人的勝利境界。","s":"摘自： 本部幹部會議（1996年4月23日，東京）"},"12月02日":{"c":"一個人偉大的人間革命，不久，也能轉換一個國家的宿命，進而能轉換全人類的宿命。","s":"摘自： 《人間革命》第一卷　序言"},"12月01日":{"c":"也有人不知不覺地發了牢騷，牢騷的可怕就是每次說了胸中便彌漫陰雲。","s":"摘自： 《新人間革命》第二十四卷〈培育人才〉"},"11月30日":{"c":"毫不誇張地說，能對人說多少「謝謝」，能否說感謝話，其實是人德的表現。","s":"摘自： 《新人間革命》第二十二卷〈潮流〉"},"11月29日":{"c":"只要出生在這世上，就一定會有非你莫屬的使命；否則，就不可能降臨在這世上。宇宙絕無絲毫多餘的份兒，準有什麼意義。","s":"摘自： 《青春對話》"},"11月28日":{"c":"積累一個個瞬間的勝利，會成為歷史性的大勝利。無悔的奮鬥會帶來大歡喜。","s":"摘自： 《新人間革命》第二十二卷〈命寶〉"},"11月27日":{"c":"真正幸福必定有一顆堅強的心，面對任何事態都決不會低頭。","s":"摘自： 《新人間革命》第十九卷〈長虹之舞〉"},"11月26日":{"c":"滿懷希望地面對困難的人不會有苦鬥與苦勞等感受。","s":"摘自： 《新人間革命》第二十二卷〈新世紀〉"},"11月25日":{"c":"青春時代絕對沒有什麼不可挽回的事。不如說青春時代的失敗就是畏懼失敗，不敢接受挑戰，或是自暴自棄。","s":"摘自： 《青春對話》"},"11月24日":{"c":"勝利、成功的時候，也會產生未來失敗和輸的因；失敗的時候，也會產生未來永遠大勝利的因。","s":"摘自： 《新人間革命》第十九卷〈凱歌〉"},"11月23日":{"c":"把人生的困難看作幸與不幸，那便要基於本身的「一念」的強和弱而決定。堅強的一念，使本身能夠愉快地盡情享受人生。","s":"摘自： 關西青年部紀念總會（1995年5月21日，京都）"},"11月22日":{"c":"古今文學是架構在人們心與心之間的橋梁，能渡過多少會決定自己心的內容。","s":"摘自： 《青春對話》"},"11月21日":{"c":"創造歷史的是人，主角就是你本身。不要依賴別人，你來演出痛快淋漓的創造劇。毅然站起來！打破自身的僵殼！","s":"摘自： 《新人間革命》第十五卷〈創價大學〉"},"11月20日":{"c":"不可對慘絕人寰的戰爭置身事外，應去培養對於他人的痛苦能感同身受之心。","s":"摘自： 《擁抱未來》"},"11月19日":{"c":"不是為流於安樂與懶惰，以致天天悔恨。我們活著是為了戰勝考驗，突破烏雲，為歡喜、幸福而舞蹈，出演民眾勝利的活劇。","s":"摘自： 《新人間革命》第二十二卷〈新世紀〉"},"11月18日":{"c":"不論處於什麼樣的逆境，心總是充滿希望和勇氣，搏動挑戰的氣概，那生命就會歡喜、躍動和充實。這就是幸福的實像。","s":"摘自： 《新人間革命》第二十二卷〈命寶〉"},"11月17日":{"c":"要廢棄造就戰爭的制度，首先必須確立尊重生命的思想為時代的精神。","s":"摘自： 《擁抱未來》"},"11月16日":{"c":"為實現世界和平和人類幸福，重要的是要體認到人類是命運共同體，共同攜手前進。","s":"摘自： 《新人間革命》第三十卷（下）〈誓願〉"},"11月15日":{"c":"無論處身怎樣的環境，自己本身成爲光源的話，這個世界便沒有黑暗。","s":"譯自： 《池田大作全集第一百二十二卷　隨筆》"},"11月14日":{"c":"把不幸變為幸福的是人間革命。把安於慣性和被命運愚弄的人生改革過來的偉大力量就在你們內心之中。","s":"譯自： 《池田大作全集第一百四十三卷　教育指針》"},"11月13日":{"c":"人不能看表面，也不是在順境時看得出來。不經出生入死的人，是不會知道人生的深邃。也不會了解真正友情的可貴。","s":"摘自： 《青春對話》"},"11月12日":{"c":"多麼小的事情也不疏忽，一一檢驗、確認之後才進行，做到完美無缺。大事業的成功在於徹底消滅粗心大意與姑息。","s":"摘自： 《新人間革命》第十六卷〈舉翼〉"},"11月11日":{"c":"健康不單是指沒病的狀態。……跨越任何苦難，就連最壞的環境條件也變為飛躍的動力，這才是真正的健康狀態。","s":"摘自： 《新人間革命》第二十二卷〈命寶〉"},"11月10日":{"c":"活著就有苦惱，但並非因而不幸。被苦惱束縛，心胸閉塞，喪失希望，喪失勇氣，喪失前進的氣概，那才是不幸。","s":"摘自： 《新人間革命》第十八卷〈前進〉"},"11月09日":{"c":"假如每個人都以友情和同理心為畫筆，重新描繪心中的世界地圖，那麼展現在眼前的現實世界也會大為改變。","s":"摘自： 2016年度《和平倡言》"},"11月08日":{"c":"不錯過時機，走在前面，勝利的桂冠就戴在這種人的頭上。明日勝利的原因即在於此時此刻的決心與行動。","s":"摘自： 《新人間革命》第十六卷〈舉翼〉"},"11月07日":{"c":"它告訴人們如何呼吸著宇宙的大生命，過著朝氣蓬勃的人生，以及教我們如何變革自己，嘗試這真正的冒險。","s":"摘自： 《法華經的智慧》"},"11月06日":{"c":"心中輝耀著確信的太陽，會打破覆蓋周圍人們不安的陰霾。","s":"摘自： 《新人間革命》第三十卷（下）〈勝利歡呼〉"},"11月05日":{"c":"先下定交談的決心，努力騰出時間。一旦進行對話，就要無所畏懼地坦誠相對，以此培育真正的友情。","s":"摘自： 《新人間革命》第二十一卷〈人性外交〉"},"11月04日":{"c":"不用心去欣賞是什麽也看不到的。以熱愛生命的心去看世界，美好的世界就會出現在我們眼前。","s":"譯自： 《池田大作全集第一百二十二卷　隨筆》"},"11月03日":{"c":"只要歧視他人，就等於在歧視自身的生命。","s":"摘自： 《法華經的智慧》"},"11月02日":{"c":"強盛的一念是產生無限活力和智慧的源泉。","s":"摘自： 《新人間革命》第十七卷〈民眾城〉"},"11月01日":{"c":"有感謝之心的人是謙虛的。而且，感謝之心會成為自身向上的力量。","s":"摘自： 《新人間革命》第二十一卷〈寶冠〉"},"10月31日":{"c":"人生不可只顧眼前的現實，應該追求理想、超越現實。但是，也不可脫離現實，若不腳踏實地，現實不會有任何改變。","s":"摘自： 《法華經的智慧》"},"10月30日":{"c":"使人變得無力的是斷念死心，「啊，已經不行啦！」那就是用自己的手關上自身所蘊藏的可能性大門，封閉自己的鬥志。","s":"摘自： 《新人間革命》第二十六卷〈奮迅〉"},"10月29日":{"c":"通過對話的人與人心靈交流，才是創造和平網絡的力量。","s":"摘自： 《新人間革命》第三十卷（下）〈誓願〉"},"10月28日":{"c":"新的時代靠新的挑戰來打開。天天前進！天天向上！","s":"摘自： 《新人間革命》第十五卷〈創價大學〉"},"10月27日":{"c":"打破此心，一定要創造出最好的，從毅然決然的一念產生新的智慧、力量和創造。","s":"摘自： 《新人間革命》第二十三卷〈勇氣〉"},"10月26日":{"c":"向前、向著光明、不斷努力向上的人能夠創造真正的價值。並且不要忘記，幸福就在其中。","s":"摘自： 《新人間革命》第二十三卷〈學光〉"},"10月25日":{"c":"和一個人誠實相交，貫徹信義，友情之環就會一圈圈擴大開來。要誠心誠意重視一個人。","s":"摘自： 《新人間革命》第二十一卷〈人性外交〉"},"10月24日":{"c":"要從自己身邊的具體地方開始，一步一步地，不斷擴展周遭的人性紐帶，增加新的「鄰人」，這才是走向和平最確實的道路。","s":"摘自： 2009年度《和平倡言》"},"10月23日":{"c":"經歷多少艱辛就積聚多少自身的經驗，有多少苦鬥就積蓄多少力量。只有徹底經歷辛勞，才能培育為真正的領導人。","s":"摘自： 《新人間革命》第二十六卷〈奮迅〉"},"10月22日":{"c":"拼命的人，不在乎閑言閑語。為無聊的事而動搖、左顧右盼、在意別人的評價；如果一直左顧右盼，怎能有所作為？","s":"摘自： 學生部代表會議（1996年1月26日，東京）"},"10月21日":{"c":"佛法裏沒有「把自己的幸福構築在他人的不幸上」這種生活方式。","s":"摘自： 哈佛大學演講（1991年9月26日，美國劍橋）"},"10月20日":{"c":"「下決心」這件事本身就是前進的證明。就算是「三天打魚兩天曬網」，一再重復的話，結果也很可觀。","s":"摘自： 《青春對話》"},"10月19日":{"c":"日復一日奔向目標的腳步停下來，青春和人生都不會勝利。","s":"摘自： 《新人間革命》第十六卷〈心血〉"},"10月18日":{"c":"偉大的音樂與藝術超越國家及民族的差異，奏響靈魂的共鳴，聯結人心。","s":"摘自： 《新人間革命》第三十卷（下）〈誓願〉"},"10月17日":{"c":"人際關係就像面鏡子，自己心想：「只要他對我再體諒一點，我就什麼都會跟他商量啊！」","s":"摘自： 《青春對話》"},"10月16日":{"c":"也許身處艱苦奮鬥的漩渦之中，只得拼搏下去。但日後會知道，那時是最成長、最前進、最磨礪自身的時候。","s":"摘自： 《新人間革命》第二十三卷〈勇氣〉"},"10月15日":{"c":"偉大的人物都很謙虛。威風逞強其實是無能的證據。","s":"摘自： 《青春對話》"},"10月14日":{"c":"所謂的和平，並不是安祥、蠻不在乎地度日，而是要能與使人痛苦的「邪惡」奮戰。","s":"譯自： 《池田大作全集第六十五卷　對話》"},"10月13日":{"c":"憎惡、戰爭的感情會傳遞開去，協力、和平的感情也會傳遞開去。","s":"摘自： 《新人間革命》第二十一卷〈寶冠〉"},"10月12日":{"c":"新鮮感會隨歲月而消逝，逐漸惰性化，這是世上的常事。但如此一來就沒有新發展。為打破惰性，需要回到原點。","s":"摘自： 《新人間革命》第二十三卷〈未來〉"},"10月11日":{"c":"心與心的交流，向友情的汪洋大海出航，其門戶就是致意打招呼。","s":"摘自： 《新人間革命》第二卷〈勇舞〉"},"10月10日":{"c":"尊敬別人者，也會受到別人的尊敬。對人施以慈愛者，自己也會受到別人的維護。環境基本上是「反映出自己」的結果。","s":"摘自： 落基山最高會議（1996年6月10日，美國丹佛市）"},"10月09日":{"c":"真正的國際化，從具有「人人都同樣是尊嚴存在」的信念、培養要擴大友情的心開始。","s":"摘自： 《新人間革命》第三十卷（下）〈勝利歡呼〉"},"10月08日":{"c":"友情是各位的財產。不論多麼有地位、有錢，如果沒有朋友，人生是寂寞、冷清的，還會變得專擅偏頗。","s":"摘自： 《青春對話》"},"10月07日":{"c":"注意那些他人沒有關注到的細節，做到萬無一失，這種行動就是責任感的表現。","s":"摘自： 《新人間革命》第二十三卷〈未來〉"},"10月06日":{"c":"不是由性格決定幸福與否，而是決定在生存方法，就是人生的「內容」。","s":"摘自： 《青春對話》"},"10月05日":{"c":"一切戰鬥都是跟時間的戰鬥。遲疑行動，浪費時間，就將是敗者。","s":"摘自： 《新人間革命》第二十三卷〈奮鬥〉"},"10月04日":{"c":"戰勝這種心，不斷地挑戰、努力、下功夫，直到極限，才能開闢新的道路。","s":"摘自： 《新人間革命》第三十卷（下）〈勝利歡呼〉"},"10月03日":{"c":"心中輝耀著確信的太陽，會打破覆蓋周圍人們不安的陰霾。","s":"摘自： 《青春對話》"},"10月02日":{"c":"和平友好始於人與人的友誼和信賴。民眾心心相連是和平的堅固基礎，人的紐帶形成和平紐帶。","s":"摘自： 《新人間革命》第二十一卷〈人性外交〉"},"10月01日":{"c":"勝者是挑戰自己、戰勝自己的有「勇氣」的人。自身的軟弱、怯懦、怠惰、逃避、絕望，制服這些才能打開所有的勝利之門。","s":"摘自： 《新人間革命》第二十三卷〈勇氣〉"},"09月30日":{"c":"歡喜地對待事物的人是堅強的。因為那不是出自義務感的行動，而是自己主體性意志的展現。","s":"摘自： 《新人間革命》第二十三卷〈學光〉"},"09月29日":{"c":"跨越障礙，取得勝利之時，就會給抱有同樣苦惱的人，給眾人指出新的勝利大道，給予希望，給予活力。","s":"摘自： 《新人間革命》第十六卷〈心血〉"},"09月28日":{"c":"最吃苦的人最能成長，背負嚴酷「宿命」的人就是肩負最高「使命」的人。","s":"摘自： 《新人間革命》第二十三卷〈勇氣〉"},"09月27日":{"c":"靠努力取得某種勝利的喜悅，能化作巨大的自信。一個勝利成為所有勝利的突破口，成為跳板。","s":"摘自： 《新人間革命》第二十四卷〈培育人才〉"},"09月26日":{"c":"對於有不屈的信念和上進心的人而言，一切都會是學習的場所。","s":"摘自： 《新人間革命》第三十卷（下）〈誓願〉"},"09月25日":{"c":"也就是說，要使這種自發的為他人貢獻的生活方式，成為新時代的精神與潮流。","s":"摘自： 2010年度《和平倡言》"},"09月24日":{"c":"人的真正價值表現在「緊急關頭」、「關鍵時刻」。重要的時候做了什麼，認真地、拼命地行動到什麼程度。","s":"摘自： 《新人間革命》第十六卷〈心血〉"},"09月23日":{"c":"能否造就成功的人生，取決於「心志」的有無。","s":"摘自： 《新人間革命》第二十三卷〈奮鬥〉"},"09月22日":{"c":"要實現理想，必須注目現實。不顧現實，那就不是理想，而是空想。","s":"摘自： 《新人間革命》第二十卷〈信義的繫絆〉"},"09月21日":{"c":"青年心裡有無邊無際的希望藍天，火紅熱情的太陽熊熊燃燒。有迸發的勇氣和無限的創造源泉。新時代的主角是青年。","s":"摘自： 《新人間革命》第三十卷（下）〈勝利歡呼〉"},"09月20日":{"c":"新挑戰伴隨著不安，但跨越過去，勇往直前，就會有發展。","s":"摘自： 《新人間革命》第二十三卷〈學光〉"},"09月19日":{"c":"佛法是創造價值的源泉。其第一步，就是以智慧把面對的一切事情變成喜悅、希望、感謝與勝利。","s":"摘自： 《新人間革命》第十六卷〈心血〉"},"09月18日":{"c":"人類具有無窮的能力，能於最困難條件下開拓新的局面，創造更充實和豐饒的價值。","s":"摘自： 2000年度《和平倡言》"},"09月17日":{"c":"只從一方面看事物是不能瞭解真實的。越是從更多的視點看事物，真實越浮現。正確的評價需要正確的認識。","s":"摘自： 《新人間革命》第十六卷〈對話〉"},"09月16日":{"c":"向前，向前，奔向希望，轉變自身的一念，這就是人間革命。","s":"摘自： 《新人間革命》第十六卷〈心血〉"},"09月15日":{"c":"人生伴隨著波折與考驗。那時候怎樣跨越呢？那時的艱苦奮鬥，將成爲人生之寶，使自己的生命放射光輝。","s":"摘自： 《新人間革命》第二十三卷〈未來〉"},"09月14日":{"c":"對「死」抱有意識，就是提升自己的境界。因為自覺「死」時，就已開始追求「永恆」，下定決心要珍惜每一瞬。","s":"摘自： 《法華經的智慧》"},"09月13日":{"c":"改變宿命絕不是脫離自己，變成另一個人，而是用自己的真實姿態創造最高的幸福境界。","s":"摘自： 《新人間革命》第十六卷〈心血〉"},"09月12日":{"c":"關鍵在於一念，在於下定決心。決意不堅就會不戰而敗。","s":"摘自： 《新人間革命》第二十四卷〈燈塔〉"},"09月11日":{"c":"立誓建構「沒有悲慘戰爭的世界」，立足於實現人類和平與幸福這一共同的根本目的，聯結人和人。","s":"摘自： 《新人間革命》第三十卷（下）〈誓願〉"},"09月10日":{"c":"胸懷驕傲與理想的青年，信念的火焰熊熊燃燒，從生命迸發出亮麗的光彩。","s":"摘自： 《新人間革命》第十六卷〈心血〉"},"09月09日":{"c":"打破友人迷津的力量，是親身經歷所證明的確信的話語。","s":"摘自： 《新人間革命》第二十五卷〈人才城〉"},"09月08日":{"c":"如果在全世界人們的心裡樹立起生命絕對尊嚴的思想，人類就能夠為和平而互相聯結。","s":"摘自： 《新人間革命》第三十卷（下）〈誓願〉"},"09月07日":{"c":"對話是人的特權。它會成為最牢固的紐帶，跨越所有隔絕人的障礙，聯結人心，聯結世界。","s":"摘自： 《新人間革命》第十六卷〈對話〉"},"09月06日":{"c":"人生有暴風雨，有黑夜，跨越過去，那麼，苦難有多深，巨大幸福的早晨就有多光明。","s":"摘自： 《新人間革命》第二十四卷〈母親之詩〉"},"09月05日":{"c":"要獲得幸福，需要有明確指出「什麼是幸福」的「哲學」。「哲學」是作為生活方式之根本的觀點。","s":"摘自： 《新人間革命》第二十五卷〈人才城〉"},"09月04日":{"c":"世間有許多心靈受創的人，我們應對他們伸出援手。對他人伸出援手，其實是在治癒自己。","s":"摘自： 《法華經的智慧》"},"09月03日":{"c":"有未來的目標就胸懷希望的太陽。只要有希望，人生就沒有挫折，沒有山窮水盡。","s":"摘自： 《新人間革命》第十六卷〈心血〉"},"09月02日":{"c":"奮鬥的歷史刻在生命中，會化作開啟光榮未來的力量。艱辛苦鬥的險路是達到勝利頂峰的黃金之路。","s":"摘自： 《新人間革命》第二十四卷〈嚴護〉"},"09月01日":{"c":"「一定要做到」，有這樣強烈的一念就會產生各種辦法。相反，如果死了心，就會自己摘掉創造力的萌芽。","s":"摘自： 《新人間革命》第二十六卷〈奮迅〉"},"08月31日":{"c":"真正的幸福是自己創造的。不是由他人賦予的。從自己以外所得到的幸福是短暫的幸福，隨著時間，早晚將崩潰。","s":"摘自： 《新人間革命》第二十五卷〈人才城〉"},"08月30日":{"c":"可以說，人生就是跟無情的宿命風暴戰鬥。培養起戰勝那風暴的堅韌精神，才會有幸福。","s":"摘自： 《新人間革命》第二十六卷〈法旗〉"},"08月29日":{"c":"主動採取行動，時時關心大家安全的是領導人。這樣的行動受人們信賴。","s":"摘自： 《新人間革命》第二十五卷〈薰風〉"},"08月28日":{"c":"看清自己的弱點是什麼，邁出挑戰的一步，人間革命就開始了。","s":"摘自： 《新人間革命》第二十六卷〈厚田〉"},"08月27日":{"c":"今日敗了，明日取勝。這連續的鬥志正是勝者之心。","s":"譯自： 《池田大作全集第三十八卷　詩歌・贈言》〈有價值的每一天〉"},"08月26日":{"c":"向著未來，點燃希望的火焰，朝著理想與信念勇往直前，如果這就是青年，那麽，人必須永遠是青年。","s":"摘自： 《新人間革命》第二卷〈磨練〉"},"08月25日":{"c":"知道人的苦勞，知道人的努力，這是當領導的最必要條件。","s":"摘自： 《新人間革命》第二十六卷〈奮迅〉"},"08月24日":{"c":"新時代的大門由青年打開。只有年輕的英才陸續成長，充分地發揮力量，國家、社會和團體才能得到永遠的發展。","s":"摘自： 《新人間革命》第三十卷（下）〈誓願〉"},"08月23日":{"c":"真心熱情的對話是打開局面的最佳方法。","s":"摘自： 《新人間革命》第二十五卷〈人才城〉"},"08月22日":{"c":"真正的幸福是不被時代的激變和潮流所左右的。它就在積累的「心之財」當中。","s":"摘自： 《新人間革命》第二十五卷〈共戰〉"},"08月21日":{"c":"常有人追求名譽、名聲，迷失自我。重要的是凝視自己，磨礪自己，這才會得到真正的充實、勝利與幸福。","s":"摘自： 《新人間革命》第二十三卷〈學光〉"},"08月20日":{"c":"有「感謝」的人有「歡喜」，而且燃燒的歡喜生命就會是挑戰、前進、勝利、幸福的活力泉源。","s":"摘自： 《新人間革命》第二十六卷〈奮迅〉"},"08月19日":{"c":"「謝謝」是非暴力的精髓，當中包含了對他人的尊敬，表露謙遜的態度，以及對人生最大的肯定。","s":"摘自： 《創造幸福與和平的智慧》"},"08月18日":{"c":"對話，是敞開人心的靈魂撞擊，是能夠產生良心共鳴音響的生命音樂。","s":"摘自： 《新人間革命》第二十六卷〈法旗〉"},"08月17日":{"c":"化不信為信，反目為理解，憎惡為慈愛，不言而喻，其根本在「誠實」。用計謀或手段不能耕耘信賴這塊友誼大地。","s":"摘自： 東亞大學演講（1991年1月30日，中國澳門）"},"08月16日":{"c":"處於最嚴峻狀況的人毅然而起，演出輝耀勝利的活劇，就會給萬眾勇氣、希望和確信。","s":"摘自： 《新人間革命》第二十三卷〈勇氣〉"},"08月15日":{"c":"從核武器、饑餓、貧困、歧視等威脅人類的一切恐懼、不安中解放，能切實感受活著的喜悅與幸福，才是真正的和平。","s":"摘自： 《新人間革命》第三十卷（下）〈誓願〉"},"08月14日":{"c":"一點點時間都不浪費，如何有效地利用，如何做出看不見的努力，這就是一切勝敗的關鍵。","s":"摘自： 《新人間革命》第二十六卷〈法旗〉"},"08月13日":{"c":"到最後依然奮戰不懈的人最可敬、最年輕。此人擁有不老的生命，是人生的勝利者。","s":"摘自： 《創造幸福與和平的智慧》"},"08月12日":{"c":"所謂「前途莫測」，看似一帆風順，卻不知前方有什麼在等待著，這就是人生的航路。","s":"摘自： 《新人間革命》第二十六卷〈厚田〉"},"08月11日":{"c":"我們的聲音打動人心，改變社會，改變世界。從竭力發聲開始踏出新的一步。","s":"摘自： 《新人間革命》第三十卷（下）〈誓願〉"},"08月10日":{"c":"誠實的品格表現出彬彬有禮的舉止，由此產生信賴。","s":"摘自： 《新人間革命》第二十五卷〈共戰〉"},"08月09日":{"c":"「自身」改變的話，「世界」將會改變。「自我一念的變革」將是一切變革的關鍵。這就是「人間革命」。","s":"摘自： 《一生成佛抄講義》"},"08月08日":{"c":"封閉在利己主義的軀殼裡，心中照不進光芒。大大敞開利他的窗戶，希望的太陽才會燦爛照射。","s":"摘自： 《新人間革命》第二十五卷〈福光〉"},"08月07日":{"c":"幸福取決於自己，取決於自己的心。若擁有堅強的心，景色就完全不同了。所看到的完全不同。堅強是幸福。","s":"摘自： 女子部和婦人部聯合協議會（2006年2月14日，東京）"},"08月06日":{"c":"沒有什麼比和平更寶貴、比和平更幸福的了！和平才是人類應邁進的根本的第一步。","s":"摘自： 《新人間革命》第一卷〈旭日〉"},"08月05日":{"c":"把每個人默默付出的努力和辛苦予以表揚，那是比什麽都大的鼓勵，會激發勇氣。","s":"摘自： 《新人間革命》第十七卷〈希望〉"},"08月04日":{"c":"要有與人見面和對話的勇氣！「選擇對話」本身就是和平的勝利，也是人性的勝利。","s":"譯自： 《池田大作全集第一百三十四卷　隨筆》"},"08月03日":{"c":"抬頭看看星星、月亮、寫寫詩，擁有餘裕的心也很重要。以廣大的心胸凝視宇宙，也等於在凝視自己的人生。","s":"摘自： 《法華經的智慧》"},"08月02日":{"c":"發現意義，自覺意義，由此開始價值創造。從中心靈也會變得堅強和豐裕。","s":"摘自： 《新人間革命》第二十六卷〈厚田〉"},"08月01日":{"c":"不論年紀多大，都要嚴以律己，探求自己的貢獻之道，這就是「創造價值」的生活態度。","s":"摘自： 《創造幸福與和平的智慧》"},"07月31日":{"c":"常保笑容的人最堅強……愈是辛苦，愈要以明朗笑容鼓勵身旁的人，繼續前進。","s":"摘自： 《創造幸福與和平的智慧》"},"07月30日":{"c":"你走過的地方就成了路。你談過話，就播下希望的種子。","s":"摘自： 《新人間革命》第二十五卷〈共戰〉"},"07月29日":{"c":"無論與鄰人的對話，還是與歷史、自然或宇宙的對話，只有在對話的開放空間裡，人才能保障其整體人性。","s":"摘自： 克萊爾蒙特・麥肯納大學演講（1993年1月29日，美國加州）"},"07月28日":{"c":"考驗是磨礪自己、使自己變強的財富。如果能從心裡這麼把握，就能大成長。","s":"摘自： 《新人間革命》第二十五卷〈人才城〉"},"07月27日":{"c":"自己經歷過苦鬥才能真正鼓勵人。勞苦磨礪人，深化人。","s":"摘自： 《新人間革命》第二十三卷〈學光〉"},"07月26日":{"c":"「當下」這一瞬間蘊含著無限未來。推動歷史也是剎那的判斷與行動。為了不錯過「時」，每一瞬間都要全力以赴。","s":"摘自： 《新人間革命》第二十六卷〈奮迅〉"},"07月25日":{"c":"對立和緊張狀態無法阻擾對話，不願意去了解對方才是最大的障礙。主動展開對話是最要緊的一步，一切都由那一刻開始。","s":"摘自： 2016年度《和平倡言》"},"07月24日":{"c":"只一句鼓勵也會使人奮起。「聲音」宛如清新的微風，喚起勇氣。","s":"摘自： 《新人間革命》第二十三卷〈學光〉"},"07月23日":{"c":"人能發揮的最大說服力就是認真。竭盡全力的話語具有打碎擋路岩石的力量。","s":"摘自： 《新人間革命》第二十六卷〈法旗〉"},"07月22日":{"c":"決定勝利的好時機經常有。能充分利用好時機的人不斷地努力、奮鬥，不論好時機什麼時候出現都能夠最好地利用。","s":"摘自： 《新人間革命》第二十六卷〈奮迅〉"},"07月21日":{"c":"任何時刻都能凝視自己，控制自己，堂堂地、悠然地去演出「人生」，「人格」的力量就在於此。","s":"摘自： 巴西SGI紀念總會（1993年2月13日，里約熱內盧）"},"07月20日":{"c":"重要的是踏出那「一步」。下定決心﹐若能先克服了小恐懼﹐將從而產生迎接下一個挑戰的勇氣。","s":"摘自： 《青春對話》"},"07月19日":{"c":"闡明死，是宗教的使命，由此形成怎麼活的人生觀。","s":"摘自： 《新人間革命》第二十六卷〈厚田〉"},"07月18日":{"c":"無小事則無大事。認真對待小事就能防止大事故。","s":"摘自： 《新人間革命》第二十六卷〈勇將〉"},"07月17日":{"c":"笑容使人心柔和，敞開友好與交談的大門。而且可以說，那是在浩瀚境界的巔峰上綻放的鮮花。","s":"摘自： 《新人間革命》第二十六卷〈法旗〉"},"07月16日":{"c":"奮鬥，誰決心取勝誰勝利。因為對勝利的執著會變成無窮的力量。","s":"摘自： 《新人間革命》第十七卷〈大本營〉"},"07月15日":{"c":"生命是永遠的。因此，所謂老，不是一天天等待終結，而是今世人生的最後完成，同時也是下一次新生的準備期間。","s":"摘自： 《新人間革命》第二十六卷〈厚田〉"},"07月14日":{"c":"人生是起伏不平的，也有要一邊苦鬥一邊前進的時候。但是，向那些考驗挑戰時，自己被磨礪、鍛鍊，變得堅強，得以成長。","s":"摘自： 《新人間革命》第二十六卷〈奮迅〉"},"07月13日":{"c":"人心有所改變，奮起大勇猛心，聲音、表情、行動、氣魄都會變，進而能轉換一切狀況和環境。","s":"摘自： 《新人間革命》第二十六卷〈法旗〉"},"07月12日":{"c":"譬如，只想明哲保身的心脆弱，但母親拼命要保護孩子的心堅強。利他之念使人堅強。","s":"摘自： 《新人間革命》第二十五卷〈人才城〉"},"07月11日":{"c":"要贏得別人的信賴，最大的條件是不忘約定，必定實現。哪怕對方忘記了也要遵守，以此確立自己的生活方式、信念與人格。","s":"摘自： 《新人間革命》第二十六卷〈厚田〉"},"07月10日":{"c":"人本主義不是搞什麼特別的生活方式，而是在與他人苦樂與共之中——如果有人在奮鬥，在勞苦，就打聲招呼，予以鼓勵；","s":"摘自： 《新人間革命》第二十六卷〈法旗〉"},"07月09日":{"c":"聯結夢想與現實的橋樑就是努力。努力的人會湧現希望。希望是努力的產物。胸懷遠大理想，努力挑戰，這就是青春。","s":"摘自： 《青春對話》"},"07月08日":{"c":"立下 「非打開局面不可」的一念，就會無限地擴大自身的可能性，並能敞開新的大門。","s":"摘自： 《新人間革命》第三十卷（下）〈勝利歡呼〉"},"07月07日":{"c":"不管多大年齡，不苦戰奮鬥，精神就空虛。為了自己的幸福，為了充實，要自我奮鬥，譜寫自己挑戰的篇章。","s":"摘自： 《新人間革命》第十七卷〈大本營〉"},"07月06日":{"c":"失去希望就是失去人生的光明，而信仰是在心中點燃希望的燈火，燃起歡喜的火焰。","s":"摘自： 《新人間革命》第二十六卷〈法旗〉"},"07月05日":{"c":"孤獨感使心軟弱，但自覺了和人的牢固紐帶，心就會堅強如鐵。","s":"摘自： 《新人間革命》第二十五卷〈人才城〉"},"07月04日":{"c":"建設一個人人都可享有和平與尊嚴的國際社會並非遙不可及的目標。我堅信，民眾團結一心，眾志成城，就能實現這個目標。","s":"摘自： 2018年度《和平倡言》"},"07月03日":{"c":"一個人充滿勇氣與熱情的行動，從一波擴展為千重浪，開啟新門扉。","s":"摘自： 《新人間革命》第二十六卷〈法旗〉"},"07月02日":{"c":"和平也是從堅韌不拔的對話開始。忍耐是一切大業的動力。","s":"摘自： 《新人間革命》第十六卷〈對話〉"},"07月01日":{"c":"人並非敗給困境，而是敗給自己。自己灰心喪氣，放棄信念，走向失敗。","s":"摘自： 《新人間革命》第十三卷〈光城〉"},"06月30日":{"c":"對話宛如一場歷險的旅程，那是人人都可參與的。有時，它甚至連歷史都能夠改變。","s":"摘自： 2008年8月6日《國際新聞社》〈對話的文明〉"},"06月29日":{"c":"放下心來才能振作，才能鼓起力量，所以拂去不安是領導的職責。","s":"摘自： 《新人間革命》第十七卷〈希望〉"},"06月28日":{"c":"謙虛之人有感恩之心。感恩之心帶來感動，成為幸福的源泉。","s":"摘自： 《新人間革命》第十九卷〈凱歌〉"},"06月27日":{"c":"青年就是要譜寫自身的勝利詩篇。這決定人生的軌道，會成為值得自豪的畢生財富。","s":"摘自： 《新人間革命》第十七卷〈民眾城〉"},"06月26日":{"c":"所以，沒有磐石般的家庭建設，就沒有社會的繁榮，而沒有社會的和平，也就不能有家庭的幸福。這也是世界和平的方程式。","s":"摘自： 《新人間革命》第二卷〈磨練〉"},"06月25日":{"c":"由於你心中清楚地描繪、想像、確信「勝利的結果」，「大腦」就會竭盡全力，把藍圖變成現實。","s":"摘自： 美國代表者會議（1993年3月9日，邁阿密）"},"06月24日":{"c":"意識到自己的生命如「寶珠」般珍貴之時，人也會從心底裡把他人生命中閃耀之「寶珠」予以十分重視和尊重吧！","s":"摘自： 《擁抱未來》"},"06月23日":{"c":"思想、愛情都不單表現在語言上，更表現在無微不至的關懷上，從中更可感受到這人的信念與哲學。","s":"摘自： 《新人間革命》第十七卷〈希望〉"},"06月22日":{"c":"不要害怕障礙。辛苦之中有動人的活劇。膽怯就是「障礙」，但鼓起勇氣，突飛猛進，那就變成勝利的「跳板」。","s":"摘自： 《新人間革命》第十七卷〈民眾城〉"},"06月21日":{"c":"人自覺了使命時，就能突破自身的壁障。","s":"摘自： 《新人間革命》第二十六卷〈厚田〉"},"06月20日":{"c":"所謂人生的勝利者，就是向一個個眼前的課題挑戰，戰而勝之，從中開闢光榮未來的人。","s":"摘自： 《新人間革命》第七卷〈萌芽〉"},"06月19日":{"c":"人的價值取決於如何能尊敬他人，尊敬人是「人權」意識的出發點。","s":"摘自： 《法華經的智慧》"},"06月18日":{"c":"人生是不斷的翻山越嶺，能登上最高峰的就是勝者。相反地，逃避登山，不斷往谷底走，將成為人生的敗者。","s":"摘自： 《青春對話》"},"06月17日":{"c":"鬥志如火蔓延。領導人有真正的鬥志，那就會瞬間蔓延到組織的每個角落，使之生氣勃勃。","s":"摘自： 《新人間革命》第十九卷〈陽光〉"},"06月16日":{"c":"超乎計算利害得失、更為有情的人生。「算計的人生」把自己的事情也計算在內。算計是有限，而自然無限。","s":"摘自： 《青春對話》"},"06月15日":{"c":"開闢從未有過的路，其艱苦是筆舌難盡的。但是，苦鬥的青春將成為自身未來最寶貴的財富。","s":"摘自： 《新人間革命》第十七卷〈希望〉"},"06月14日":{"c":"有感謝，覺得感激，就湧出歡喜。有歡喜，就鼓起勇氣，也就有要努力的心情，以報答別人。有感謝的人是幸福的。","s":"摘自： 《新人間革命》第九卷〈光彩〉"},"06月13日":{"c":"一句話，能使人煩惱、傷心，也能使人感到安慰、鼓起勇氣。所以用字遣詞很重要。","s":"摘自： 《新人間革命》第四卷〈春瀾〉"},"06月12日":{"c":"不管情況如何，強烈的一念能打破任何困難的圍牆。","s":"摘自： 《新人間革命》第十七卷〈希望〉"},"06月11日":{"c":"幸福絕對要自己去創造，並不是別人賜予的。","s":"摘自： 全國代表會議（1996年3月29日，東京）"},"06月10日":{"c":"宣告春天的太陽在哪裡呢？在你們胸中。不，應該說你們本身就是給家、地區、工作單位和社會帶來幸福與和平的春天太陽。","s":"摘自： 《新人間革命》第七卷〈早春〉"},"06月09日":{"c":"人不是輸給困難，而是由於喪失鬥志，敗給自己。哪怕被打到，俯伏在地，只要有鬥志，人就能夠站起來。","s":"摘自： 《新人間革命》第二十五卷〈人才城〉"},"06月08日":{"c":"風吹波興，起而行動，狀況就會有所變化。行動是突破限界、提高自己境界的力量。行動的人不會死心。","s":"摘自： 《新人間革命》第十七卷〈綠野〉"},"06月07日":{"c":"人心變化是一瞬之間。把一念凝縮於一瞬，認真挑戰，那時就會產生共鳴與希望，觸動他人的心。","s":"摘自： 《新人間革命》第十七卷〈民眾城〉"},"06月06日":{"c":"自己終歸是自己，羨慕別人也無濟於事。人有短處，也有長處，應該正視自己，發現長處，發展長處。","s":"摘自： 《新人間革命》第六卷〈寶土〉"},"06月05日":{"c":"有目標就有希望。確定了目標，一步步的步伐也有力。","s":"摘自： 《新人間革命》第十七卷〈大本營〉"},"06月04日":{"c":"同時，不是要自己上前台來，而是為大家盡力，在背後支撐。這就是團結的要諦。","s":"摘自： 《新人間革命》第十七卷〈希望〉"},"06月03日":{"c":"發揮想像力去理解他人的苦惱，這就是「同苦」的開始。所謂關懷，就是體諒他人處境的結晶。","s":"摘自： 《新人間革命》第十九卷〈寶塔〉"},"06月02日":{"c":"「你要站起來！」這種發自生命、盡心竭力的祈願才會打動對方的心。所謂鼓勵，是火焰一般的一念所帶來的心靈的觸發。","s":"摘自： 《新人間革命》第十九卷〈長虹之舞〉"},"06月01日":{"c":"守護一個人的生命的慈愛之心就是強大的和平之心。","s":"摘自： 《新人間革命》第十四九卷〈使命〉"},"05月31日":{"c":"所謂偉業，是在沒有稱讚沒有喝彩中默默地靜靜地實現的。","s":"摘自： 《新人間革命》第十一卷〈常勝〉"},"05月30日":{"c":"為最後獲勝，現在付出苦勞。流汗，流淚，不斷挑戰。無論發生什麼都勇敢地迎上去，堅韌不拔，拼命跑到底。","s":"摘自： 《新人間革命》第十七卷〈綠野〉"},"05月29日":{"c":"生命尊嚴，並非一個人能獨自展現的。只有在如此互相關聯的過程中，他人的生命方可顯示其「無可替代」的尊貴一面，","s":"摘自： 2013年度《和平倡言》"},"05月28日":{"c":"事實上，為他人的幸福投注心力是使自己真正幸福的必要條件。","s":"摘自： 《法華經的智慧》"},"05月27日":{"c":"日日都全力以赴，生命便會散發耀眼的光芒。戰勝今天，明天就勝利在握。","s":"摘自： 《新人間革命》第十七卷〈民眾城〉"},"05月26日":{"c":"不「破邪」就無法「顯正」。不，必須明白，不「破邪」，結果是袒護「邪惡」，與之同罪。","s":"摘自： 《新人間革命》第二十七卷〈正義〉"},"05月25日":{"c":"任何事情都是「小事」積累成「大事」。每一瞬間考慮自己應該做什麼，全力以赴。這樣積累下去，就成就大業，取得大勝。","s":"摘自： 《新人間革命》第十七卷〈希望〉"},"05月24日":{"c":"信賴不是一朝一夕能建立的，而是建立在一天天行為的扎實積累中。這種信賴就是人際關係的牢固基礎。","s":"摘自： 《新人間革命》第二十七卷〈激戰〉"},"05月23日":{"c":"人生有自己被考驗的「關鍵時刻」，所以平日保持什麼樣的心態，怎樣努力很重要。","s":"摘自： 《新人間革命》第十九卷〈凱歌〉"},"05月22日":{"c":"從聆聽之心中萌生「互相理解」，進而從互相理解中萌生「社會的和平」。非暴力是至高的謙虛，也是至高的勇氣。","s":"摘自：《世界由你來改變》（The World Is Yours to Change）"},"05月21日":{"c":"要打破謠言，就是勇敢地講真實。放棄這種挑戰，就會把真實的位置讓給謠言。","s":"摘自： 《新人間革命》第二十七卷〈激戰〉"},"05月20日":{"c":"上進、改革的路是跟苦惱的搏鬥。但那一天天的過程中才有生命的充實與躍動，才有自身成長的最高果實。","s":"摘自： 《新人間革命》第二十七卷〈激戰〉"},"05月19日":{"c":"奮戰需要時機，而人生的時間也是有限的。該做時不做該做的事，留下的是後悔。","s":"摘自： 《新人間革命》第二十七卷〈正義〉"},"05月18日":{"c":"未來的結果取決於今天每一瞬的行動，取決於現在做什麼。現在，天天咬緊牙關奮鬥，才會有榮譽。","s":"摘自： 《新人間革命》第十七卷〈希望〉"},"05月17日":{"c":"為大業而生，必須準備吃苦受難。沒有勇氣是成就不了大願的。","s":"摘自： 《新人間革命》第二十卷〈信義的繫絆〉"},"05月16日":{"c":"為人們的幸福而盡力的人遠遠比只是為個人幸福活著的人能切實感受到幸福。沒有比為人們獻身更美好的行為。","s":"摘自： 《新人間革命》第二十七卷〈激戰〉"},"05月15日":{"c":"真心沒有國境，沒有年齡之隔。從關懷對方的一念產生的語言激起強烈的共鳴。","s":"摘自： 《新人間革命》第二十三卷〈未來〉"},"05月14日":{"c":"心中點亮勇氣之光的人能戰勝困苦的黑夜。黑暗越深，升起的陽光越耀眼。","s":"摘自： 《新人間革命》第二十三卷〈學光〉"},"05月13日":{"c":"鼓勵眼前一個苦惱的人，給與勇氣，使之復甦，就是實現生命尊嚴社會最踏實的第一步，將成為和平建設的起點。","s":"摘自： 《新人間革命》第三十卷（上）〈雄飛〉"},"05月12日":{"c":"向苦惱屈服，喪失希望，自暴自棄，人就會不幸。所以，只有鑄就一顆堅強而博大的心，不向煩惱和苦難低頭。","s":"摘自： 《新人間革命》第十八卷〈飛躍〉"},"05月11日":{"c":"時間對誰都是一樣多。歸根結底，如何利用每一瞬間，將來因之而大不一樣。不流的水沉澱，不轉的車輪生銹。","s":"摘自： 《新人間革命》第十八卷〈前進〉"},"05月10日":{"c":"但願晚年能如承諾翌日亦是晴天的無限夕陽一般，燦爛盡顯，光輝四射，向未來的世代送上希望的光明。","s":"摘自： 《擁抱未來》"},"05月09日":{"c":"各種的民族、文化，彼此尊重其多樣性，以同樣的「人」、「生命」層次互相產生連帶關係。失去這點，人類就無未來可言。","s":"摘自： 《法華經的智慧》"},"05月08日":{"c":"有人死守和平，和平才能維持。所謂永久和平，是為和平的鬥爭不斷勝利的歸結。","s":"摘自： 《新人間革命》第十八卷〈飛躍〉"},"05月07日":{"c":"一分一秒不鬆懈，認真地不斷行動，將創造出光榮的歷史。一步一步的步伐即使小，積累下去就是大前進。","s":"摘自： 《新人間革命》第二十三卷〈奮鬥〉"},"05月06日":{"c":"希望友人幸福的勉勵話語化作復蘇之光，喚起勇氣與力量。","s":"摘自： 《新人間革命》第三十卷（上）〈雌伏〉"},"05月05日":{"c":"培育人材靠心靈觸發。要培養人就必須燃燒整個生命，用火熱的心靈交談。心的火焰使人燃燒，使人奮起。","s":"摘自： 《新人間革命》第十八卷〈師恩〉"},"05月04日":{"c":"文化是人的生命大地上開放的花朵。創造新文化，建設未來，轉變人類的宿命，都是從一個個人的內在變革開始。","s":"摘自： 《新人間革命》第二十三卷〈勇氣〉"},"05月03日":{"c":"關懷一個背負最深重苦惱的人，對他伸出救濟之手，就是給萬眾打開幸福之路的行動。","s":"摘自： 《新人間革命》第二十四卷〈培育人才〉"},"05月02日":{"c":"人生如櫻梅桃李。我是我，不可能變成他人。只要忠於自己，綻放盛大的花朶即可。","s":"摘自： 《法華經方便品・壽量品講義》"},"05月01日":{"c":"此火焰不但能消除他人痛苦的烏雲，也同時能消除覆蓋自己心中的陰霾。","s":"摘自： 2014年度《和平倡言》"},"04月30日":{"c":"這可說是與自己戰鬥的關鍵時刻。氣餒、妥協，克服這些盤踞心中的軟弱，不斷向前，就能打開新局面。","s":"摘自： 《新人間革命》第三十卷（上）〈雄飛〉"},"04月29日":{"c":"只有在社會中推廣這種利他也利己的生活態度，才能撥開混沌黑暗世紀的烏雲，迎來晴朗的明天。","s":"摘自： 2010年度《和平倡言》"},"04月28日":{"c":"而其中發揮出推動作用的，是在面臨個性或觀念上的差異時也堅持去理解學習的決心。","s":"摘自： 2008年8月6日《國際新聞社》〈對話的文明〉"},"04月27日":{"c":"活躍才是幸福的異名，重要在於充分發揮自己的天分。使自己完全輝耀，才意味真正的生存。","s":"摘自： 《青春對話》"},"04月26日":{"c":"有原點的人堅強。不要忘記原點。不忘原點，人就不會迷失應該勇往直前的信念軌道。","s":"摘自： 《新人間革命》第十八卷〈師子吼〉"},"04月25日":{"c":"人本來同樣希求和平。編織此心，靠的不是美麗詞藻等表面功夫，而是敞開胸襟、表露人性之真誠的坦率對話。","s":"摘自： 《新人間革命》第三十卷（上）〈雄飛〉"},"04月24日":{"c":"正義若屈服也就變成惡。很悲慘，但這是社會的現實，是歷史的常事。正因為如此，行正義之道的人絕不能屈服。","s":"摘自： 《新人間革命》第二十一卷〈人性外交〉"},"04月23日":{"c":"發現意義能豐富我們的心靈、改變生活方式、創造價值。","s":"摘自： 《新人間革命》第十七卷〈希望〉"},"04月22日":{"c":"信賴，是誠實積累而成的黃金城堡。","s":"摘自： 《新人間革命》第十八卷〈前進〉"},"04月21日":{"c":"認識到自己的不利條件和缺點，要努力克服時，這些不利條件和缺點就變成新的長處而閃光。","s":"摘自： 《新人間革命》第十八卷〈師子吼〉"},"04月20日":{"c":"「心為切要」啊。人心中確有無比脆弱、見異思遷等醜陋的東西。但是，人心中更有剛強無比、堅定不移、崇高的部分。","s":"摘自： 《青春對話》"},"04月19日":{"c":"真正的友情對話超越民族、國境，超越利害，超越所有分裂的壁壘。","s":"摘自： 《新人間革命》第三十卷（下）〈誓願〉"},"04月18日":{"c":"在人際關係中，人透過培育、成長，互相學習，互相幫助，成為真正的人。所以，沒有只顧自己一個人的幸福。","s":"摘自： 《新人間革命》第三十卷（上）〈大山〉"},"04月17日":{"c":"而且，熱情是幸福的條件，因為人生大部分的幸與不幸都取決於對事物有無熱情。","s":"摘自： 《新人間革命》第十九卷〈陽光〉"},"04月16日":{"c":"人能從事的最大偉業是培育人才。只有靠這一艱辛工作才能改變世界，改變未來。","s":"摘自： 《新人間革命》第十七卷〈希望〉"},"04月15日":{"c":"慈悲的「悲」是「同苦」之意，因為「想救」才會煩惱「怎麽救才好」。有這份慈悲才能使智慧湧現。","s":"摘自： 《法華經的智慧》"},"04月14日":{"c":"奮勇戰鬥的人的心是年輕的，唯此才有新躍進。","s":"摘自： 《新人間革命》第十八卷〈師恩〉"},"04月13日":{"c":"同樣的，當面臨貧窮或疾病時，由於知道擁有同伴的支持，便能大大改變面對困境時的姿態，這是佛教哲學的核心思想。","s":"摘自： 2020年度《和平倡言》"},"04月12日":{"c":"傲慢的才智者欲玩弄世界於自己掌中，相對的，詩人的心欲向世界的神祕虔誠俯首。","s":"摘自： 《擁抱未來》"},"04月11日":{"c":"苦惱越大，戰勝它的時候能感受的幸福就越大。不，挑戰的過程中就搏動著充實與歡喜的生命，自己內心就成為幸福的泉源。","s":"摘自： 《新人間革命》第十八卷〈飛躍〉"},"04月10日":{"c":"覺悟自己就是承擔一切的領導者、負責人時，勇氣迸發，力量倍增，智慧泉湧，鍥而不捨。","s":"摘自： 《新人間革命》第二十二卷〈新世紀〉"},"04月09日":{"c":"幸福取決於發生什麼都不低頭的強韌精神，創造價值的智慧，還要培養一顆充滿喜悅與希望的豐饒的心。","s":"摘自： 《新人間革命》第十八卷〈飛躍〉"},"04月08日":{"c":"所以，年輕人啊，你就是開啟明天的主人公！既然如此，那就無所畏懼地挑戰，昂首挺胸，沿著創造的大道行進吧！","s":"摘自： 《新人間革命》第十八卷〈師恩〉"},"04月07日":{"c":"因為我深信，不宣揚恐慌，以希望來引導，人類才可方向無誤地向前邁進。","s":"摘自： 《擁抱未來》"},"04月06日":{"c":"能發現更多美好事物的人，才是美麗的人。","s":"摘自： 《給妳希望、勇氣和幸福——365日》"},"04月05日":{"c":"坦率的一句話打開心扉。在勇敢的對話中加固人與人的紐帶。","s":"摘自： 《新人間革命》第十九卷〈寶塔〉"},"04月04日":{"c":"要在未來這場比賽中獲勝，關鍵是現在，必須贏得每一分每一秒。","s":"摘自： 《新人間革命》第十九卷〈寶塔〉"},"04月03日":{"c":"不論遭遇什麼情況，向前，向前，就會在不後退的行動中迎來勝利的早晨。","s":"摘自： 《新人間革命》第十九卷〈凱歌〉"},"04月02日":{"c":"人與人之間，也只有通過人格的互相切磋琢磨，才能鍛鍊人向著更高目標進發——「師弟」關係使此理想得以實現。","s":"摘自： 美國創價大學紀念演講（2005年5月22日，美國加州）"},"04月01日":{"c":"人不能單獨存在，是被父母、老師、社會等支撐著生活。自覺這一點，懷有感謝之心，知恩圖報，這當中有人性之路。","s":"摘自： 《新人間革命》第二十一卷〈共鳴音〉"},"03月31日":{"c":"面向未來最重要的佈局，就是全心全意地在肩負未來的接班人心中播下使命的種子。","s":"摘自： 《新人間革命》第十九卷〈長虹之舞〉"},"03月30日":{"c":"無論要做成什麼事情，必不可少的條件是忍耐。比如挖井，即使累了，若中途住手，那就得不到水。","s":"摘自： 《新人間革命》第十九卷〈寶塔〉"},"03月29日":{"c":"可以說，人生莫測的情況層出不窮。在這種狀態下如何行動，反映出這人的人生哲學。","s":"摘自： 《新人間革命》第十九卷〈凱歌〉"},"03月28日":{"c":"浪費時間就是浪費生命。價值創造從有效地利用時間開始。","s":"摘自： 《新人間革命》第十九卷〈凱歌〉"},"03月27日":{"c":"「為人點燈，明在我前。」燃盡一生，誠心地為社會帶來光芒的人，在人生大成之期將綻放莊嚴的異彩。","s":"摘自： 《擁抱未來》"},"03月26日":{"c":"從他人身上看清自己，從自己的心中去感受與他人的一體性——這種想法是「人生態度」的大改革。","s":"摘自： 《法華經的智慧》"},"03月25日":{"c":"未來取決於青年，所以，一切都繫於培育青年與否。青年是「人類的至寶」。","s":"摘自： 《新人間革命》第二十一卷〈共鳴音〉"},"03月24日":{"c":"人都希求和平。因此，要互相轉變一念，鼓起勇氣進行對話。要打破盤踞在自己心中的不信、憎惡與恐怖。","s":"摘自： 《新人間革命》第十九卷〈凱歌〉"},"03月23日":{"c":"敢於講真話，就會敞開心扉，照進來靈魂之光。這就是培育信賴的幼苗。","s":"摘自： 《新人間革命》第二十卷〈橋樑〉"},"03月22日":{"c":"即使被污泥包裹，黃金仍然是黃金，真實必定勝利。","s":"摘自： 《新人間革命》第十九卷〈長虹之舞〉"},"03月21日":{"c":"如今，我們所要追求的是「對人看法」的一種變革，只要改變對人的看法，一切都會隨之改變。","s":"摘自： 《法華經的智慧》"},"03月20日":{"c":"一息尚存，就學習不止，奮鬥不休。創造價值的為人之道即在於此。","s":"摘自： 《新人間革命》第十九卷〈凱歌〉"},"03月19日":{"c":"躲在個人的小小殼子裡，只盼望自身幸福，是不可能獲得真正的幸福的。","s":"摘自： 《新人間革命》第五卷〈歡喜〉"},"03月18日":{"c":"在民眾心中點燃對和平的誓願之火，燃燒開來，世界才會被永久和平的光亮籠罩。","s":"摘自： 《新人間革命》第二十二卷〈潮流〉"},"03月17日":{"c":"如果「絕望」的無力感繼續蔓延，「訴諸暴力」的風氣也會相對地增大。亦即是說，這種無力感最後會引發出暴力。","s":"摘自： 《擁抱未來》"},"03月16日":{"c":"構建新歷史的動力，是滿溢青年胸中的大志。青年的「意志」決定他本身和社會的未來。","s":"摘自： 《新人間革命》第十九卷〈凱歌〉"},"03月15日":{"c":"重要的是要創建一股一代接一代、誰也阻擋不了的滔滔洪流，並日積月累地把它發展和擴大。","s":"摘自： 2012年度《和平倡言》"},"03月14日":{"c":"希望能產生一切；希望能帶來無限的珍寶；希望能引出人類的潛能；希望正是所謂的「如意棒」。","s":"摘自： SGI研修會的指導（1999年7月4日，東京）"},"03月13日":{"c":"就以一個切身的例子而言，在社區或家中，就生命尊嚴、人類平等等話題，和青少年促膝暢談，是具有深長意義的。","s":"摘自： 《擁抱未來》"},"03月12日":{"c":"放棄的心態打不開任何事態。和平就是與放棄心態的鬥爭。","s":"摘自： 《新人間革命》第三十卷（下）〈誓願〉"},"03月11日":{"c":"自覺使命就鼓起無限力量，能克服任何困難。而且，勇敢行動起來更增加力量。","s":"摘自： 《新人間革命》第十九卷〈寶塔〉"},"03月10日":{"c":"路途遙遠，但仍然堅持走下去。這種堅韌的行動在世界上擴大了確實的和平漣漪。","s":"摘自： 《新人間革命》第三十卷（下）〈誓願〉"},"03月09日":{"c":"友好或和平並不在遠方，就看用什麼樣的心思接觸身邊的人，做什麼。這當中就有通向和平的道路。","s":"摘自： 《新人間革命》第二十一卷〈人性外交〉"},"03月08日":{"c":"社會建設的真正主角是女性，她們的智慧和行動才是開啟和平與民主的人本主義時代的動力。","s":"摘自： 《新人間革命》第十八卷〈前進〉"},"03月07日":{"c":"對領導人的信賴取決於能否照顧到大家。有勇氣，有冷靜的判斷力，同時還關照周圍，是領導人的極為重要的條件。","s":"摘自： 《新人間革命》第二十一卷〈寶冠〉"},"03月06日":{"c":"無論自己處於任何狀態，當感到有人需要自己時，就會產生要回應對方的意願。","s":"摘自：2015年度《和平倡言》"},"03月05日":{"c":"決心表現在行動上。進而可以說，在有限的時間裏做什麼，清楚表現出決心是真是假。","s":"摘自： 《新人間革命》第十九卷〈長虹之舞〉"},"03月04日":{"c":"不要疏忽小事，看上去是小小的勇氣，但「勇氣」就是「勇氣」。重要的是勇於向前邁出一步的精神。","s":"摘自： 《青春對話》"},"03月03日":{"c":"勇於為後輩當台階，培養出超越自己的後輩，這就是培育人材的要訣。","s":"摘自： 《新人間革命》第十九卷〈長虹之舞〉"},"03月02日":{"c":"決心雖是刹那之間的事，但這就決定未來，決定一生。","s":"摘自： 《新人間革命》第十九卷〈寶塔〉"},"03月01日":{"c":"「時」不再來。該做的時候全力以赴，扎扎實實地完成該做的事情，偉大的歷史就建構在這種連續行動之中。","s":"摘自： 《新人間革命》第二十卷〈信義的繫絆〉"},"02月29日":{"c":"新的力量創造未來，所以要嘔心瀝血地培養年輕一代。","s":"摘自： 《新人間革命》第二十卷〈信義的繫絆〉"},"02月28日":{"c":"未必任何事情都能按計劃進行，或許莫如說人生就是常遇到出乎預料的情況。這種時候不要驚慌失措，以智慧創造新價值。","s":"摘自： 《新人間革命》第二十卷〈友誼之路〉"},"02月27日":{"c":"誠摯不分國界。誠摯是連結人的心靈紐帶。","s":"摘自： 《新人間革命》第二十卷〈信義的繫絆〉"},"02月26日":{"c":"雖說有長壽與短命之別，以永恆的生命來看，則毫無差別。因此，不是壽命的長短，而是在於人生是怎麼過的？做了什麼？","s":"摘自： 《法華經的智慧》"},"02月25日":{"c":"不管是否心甘情願，每個人都共乘這一艘名「地球」號的宇宙船，我們應該睜開心中雙眼，看清此簡單卻又嚴峻的事實。","s":"摘自： 《擁抱未來》"},"02月24日":{"c":"灰心，絕望，戰勝這些的勇氣是開拓時代的力量。","s":"摘自： 《新人間革命》第二十卷〈信義的繫絆〉"},"02月23日":{"c":"沒有缺乏感謝之心的人本主義，也沒有不能表達自己想法、木無表情的人本主義。","s":"摘自： 《新人間革命》第二十一卷〈寶冠〉"},"02月22日":{"c":"在信念的步伐之前必然有困難阻礙，跨越過去才能開闢新路。","s":"摘自： 《新人間革命》第二十卷〈信義的繫絆〉"},"02月21日":{"c":"今日社會的混亂，可說是由於人分不清「智慧」與「知識」的差別，和無法辨別「信仰」與「盲信」的不同。","s":"摘自： 《法華經的智慧》"},"02月20日":{"c":"站於這種清晰的認知與視野，人就會理所當然地反省自己的應有態度。","s":"摘自： 《擁抱未來》"},"02月19日":{"c":"培育青年，人道與和平的流水才會化為永遠的大河。","s":"摘自： 《新人間革命》第二十一卷〈SGI〉"},"02月18日":{"c":"懷有感謝之心，把這種情緒傳達給對方，要有所報答，友情就是在這當中加深的。","s":"摘自： 《新人間革命》第二十一卷〈寶冠〉"},"02月17日":{"c":"談戀愛到頭來只會找到符合自己境涯的戀愛，友情也是。現在愈接受磨練，將來愈能結合美好的良緣。","s":"摘自： 《青春對話》"},"02月16日":{"c":"所以對任何人不可一口否定「那個人不行」，尤其是不可輕易認定自己的潛能。","s":"摘自： 《法華經的智慧》"},"02月15日":{"c":"時代在推移，時代在變遷。首先要推動人心，人變則歷史也一定變。","s":"摘自： 《新人間革命》第二十卷〈信義的繫絆〉"},"02月14日":{"c":"熱情引發熱情，真心引發真心，生命共鳴的樂曲就是對話。","s":"摘自： 《新人間革命》第二十卷〈友誼之路〉"},"02月13日":{"c":"全宇宙的所有運作，使每一個人擁有獨自性。換句話說，每一個人是以獨自的方式照映出「大宇宙」的「小宇宙」。","s":"摘自： 《法華經的智慧》"},"02月12日":{"c":"革命也有許多種。有政治革命﹑經濟革命﹑產業革命﹑科學革命﹑藝術的革命。這些革命都各自具有其意義﹐有時的確必須。","s":"摘自： 《青春對話》"},"02月11日":{"c":"宛如春風吹醒了嫩芽，真心的鼓勵融化冰凍的心，使人振奮。鼓勵是最大的蘇生力量。","s":"摘自： 《新人間革命》第十九卷〈寶塔〉"},"02月10日":{"c":"只要自己是太陽，「早晨」一定會到來，「晴朗」的日子一定會到來，「春天」一定會到來。","s":"摘自： 《青春對話》"},"02月09日":{"c":"倘若到了晚年還是被過去的怨恨或憎惡纏身，那麼不管獲得什麼樣財富或榮譽，其人生都是悲慘且不幸的。","s":"摘自： 《新人間革命》第二十卷〈橋樑〉"},"02月08日":{"c":"但重要的是，我們要踏實地向著自己的理想和目標前進、採取行動。必須不屈於現狀，向創造新的現實挑戰。","s":"摘自： 2000年度《和平倡言》"},"02月07日":{"c":"決心化為行動，產生結果，才具有意義。沒有行動的決心不過是空想。","s":"摘自： 《新人間革命》第二十卷〈友誼之路〉"},"02月06日":{"c":"在自己生活的社區推廣「對話」，就是給自己開闢一個被他人接納、有歸屬感的「安心空間」。","s":"摘自： 2014年度《和平倡言》"},"02月05日":{"c":"領導一旦成了權威的俘虜，就不會有新發展。發展是不斷探索的別名。","s":"摘自： 《新人間革命》第二十卷〈橋樑〉"},"02月04日":{"c":"總之，拿出勇氣做任何事情，決不至於會後悔。假如後悔說「要是當初有多點勇氣，就……」，這才是不幸的人生。","s":"摘自： 《青春對話》"},"02月03日":{"c":"書寫的力量是強大的。真誠的言論掃蕩虛偽的黑暗，傾瀉真實之光，在人們心中升起勇氣的太陽。","s":"摘自： 《新人間革命》第二十卷〈信義的繫絆〉"},"02月02日":{"c":"失敗和衰退隨之而來。要向前、向前、再向前，只有在不懈的挑戰中才有生命的躍動和人生的勝利。","s":"摘自： 《新人間革命》第二十卷〈友誼之路〉"},"02月01日":{"c":"關鍵是團結。為了真正團結起來，要互相關心、尊敬及信賴。形成真正的團結，不但集體都輝耀光芒，個人也能大顯身手。","s":"摘自： 《新人間革命》第二十一卷〈SGI〉"},"01月31日":{"c":"甘於維持現狀，忘記新挑戰，局面就不會有進展。","s":"摘自： 《新人間革命》第二十一卷〈寶冠〉"},"01月30日":{"c":"只要有心靈的深深共鳴，即便是短暫的相聚也會種下友情的種子。關鍵在於是否認真，是否誠摯。","s":"摘自： 《新人間革命》第二十一卷〈人性外交〉"},"01月29日":{"c":"要建構不以眼前利害得失為重的社會。為此，首先要自尊自重，有自信、毅然地生存。這樣的人也能重視他人。","s":"摘自： 《青春對話》"},"01月28日":{"c":"表現出普遍的精神世界——「自己」和「宇宙」的融合。優秀的藝術超越民族和國家，使萬眾產生共鳴。","s":"摘自： 《新人間革命》第七卷〈文化之花〉"},"01月27日":{"c":"對話是湧來蕩去的波濤。猶如波濤不知不覺地改變岩石的形狀，在反復進行推心置腹的誠實對話過程中，不信也能變成信賴。","s":"摘自： 《新人間革命》第二十一卷〈人性外交〉"},"01月26日":{"c":"和平不是在遠處，要在自己所在的地方建構信賴與友情的世界。這個網絡擴大開來就是世界和平。","s":"摘自： 《新人間革命》第二十一卷〈SGI〉"},"01月25日":{"c":"只要有一位好友，人生的喜悅會加倍，這就是真正富有的人。","s":"摘自： 《青春對話》"},"01月24日":{"c":"有勇氣的對話會擴大共鳴的波動，成為推動世界的力量。","s":"摘自： 《新人間革命》第二十一卷〈人性外交〉"},"01月23日":{"c":"要認真盡責，計劃自然就周密。可以說，粗枝大葉，缺乏具體性的計劃所體現的是欠缺要使之成功的一念。","s":"摘自： 《新人間革命》第二十二卷〈波濤〉"},"01月22日":{"c":"人擁有無法估量的力量。堅韌不拔的意志使潛力爆發，勢如破竹。","s":"摘自： 《新人間革命》第十七卷〈民眾城〉"},"01月21日":{"c":"開闢道路是艱難的，而繼續開闢更是難上加難。但是，不繼續下去道路就不能延續。","s":"摘自： 《新人間革命》第二十一卷〈人性外交〉"},"01月20日":{"c":"即使時間短暫，只要進行打動生命的對話，心和心就能夠緊緊相連。","s":"摘自： 《新人間革命》第二十一卷〈寶冠〉"},"01月19日":{"c":"不是和別人比，是和昨天的自己比。前進了一步就是勝利。","s":"摘自： 《青春對話》"},"01月18日":{"c":"對話的真正價值在於人的精神互相碰撞、交織的過程，此要勝過對話所能得到的成果。","s":"摘自： 巴勒莫大學演講（2007年3月23日，意大利）"},"01月17日":{"c":"縱使語言、文化、民族、宗教各有不同，但我們大家都共同擁有「未來」，那是各國年輕一代携手向前的「未來」。","s":"摘自： 《擁抱未來》"},"01月16日":{"c":"一天只有二十四小時，大家都一樣，如何有效地利用這有限的時間，決定人生的工作量與充實程度。","s":"摘自： 《新人間革命》第二十一卷〈人性外交〉"},"01月15日":{"c":"真正的信賴不是靠地位和勢力能得到的。人品贏得信賴。人品才是聯結人心的力量。","s":"摘自： 《新人間革命》第二十一卷〈SGI〉"},"01月14日":{"c":"「反對核武器與戰爭」的呼喊，並非單純是傷感等情緒的表露，應該說那是直視「生命尊嚴」的人的最高理性體現。","s":"摘自： 《擁抱未來》"},"01月13日":{"c":"友情是決定在自己，不是在於對方，是在於自己的態度。","s":"摘自： 《青春對話》"},"01月12日":{"c":"師匠與弟子好比針與線，師匠是針，弟子是線。縫衣服時，針在前面開路，到終點後就沒用了，留下的線才有價值。","s":"摘自： 《新人間革命》第九卷〈鳳雛〉"},"01月11日":{"c":"這是宇宙的法則、生命的法則。所以即使日子再艱辛，人也不可放棄希望。只要懷著希望，春天一定會到來。","s":"摘自： 《青春對話》"},"01月10日":{"c":"真實的幸福存在勇氣之中。勇氣才是「幸福之門」。","s":"譯自： 《池田大作全集第一百三十六卷　隨筆》"},"01月09日":{"c":"要是昨天沒搞好，那就今天獲勝。今天要是失敗了，明天就一定要勝利。","s":"摘自： 《新人間革命》第十二卷〈愛鄉〉"},"01月08日":{"c":"只要一心懷著急他人所需、為他人盡力的意念，人就可常保朝氣，暖和身邊之人的心，讓社區更顯光明。","s":"摘自： 《擁抱未來》"},"01月07日":{"c":"接受教育的人必須帶有光榮的使命感，要在有形、無形上，為未受教育的人作出貢獻。","s":"摘自： 哥倫比亞大學教育學院演講（1996年6月13日，美國紐約）"},"01月06日":{"c":"佛法是爲了「現當二世」而有。不必在意過去。唯有向前進。唯有靠目前的努力與忍耐，贏得未來。","s":"摘自： 紐約各方面代表會議（1996年6月15日，美國紐約）"},"01月05日":{"c":"喪失奮戰之心，人就容易病，容易老。與困難奮戰，奪取勝利，就能構築人生的幸福。","s":"摘自： 《新人間革命》第十八卷〈前進〉"},"01月04日":{"c":"活著就要學習，並充滿向學心，這就是青年的使命和特徵。","s":"摘自： 《新人間革命》第二十一卷〈SGI〉"},"01月03日":{"c":"作為一個人，重要的是要有勇氣，該說時就要把該說的話說清楚。","s":"摘自： 《新人間革命》第二十卷〈橋樑〉"},"01月02日":{"c":"有感謝的地方有生命的共鳴，也會產生團結。","s":"摘自： 《新人間革命》第二十一卷〈共鳴音〉"},"01月01日":{"c":"好，讓我們輕鬆地邁出新步伐！人生就是和有限生命的競賽。既然如此，那每天就必須不斷地前進。","s":"摘自： 《新人間革命》第二十卷〈橋樑〉"}};

function shiftDate(n){
  const d=new Date(curDate);
  d.setDate(d.getDate()+n);
  setDate(d);
}
function loadQuote(){
  if(sizeMode!=='auto')setSizeMode('auto');  // 切換日期時回到自動縮字
  const q=QUOTES[dateKey()];
  taContent.value=q?q.c:'';
  inSource.value=q?q.s:'';
  requestDraw();
}

function shadow(on,blur,off){
  if(on){ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=blur;ctx.shadowOffsetX=off;ctx.shadowOffsetY=off;}
  else{ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;}
}

// 中文逐字斷行，含禁則處理（標點不落行首）。
// 採「追出式」：行尾遇標點時，把前一字連同標點移到下一行，行寬絕不超過 maxW。
function wrapText(text,font,maxW){
  ctx.font=font;
  const lines=[];
  for(const para of text.split('\n')){
    if(!para.trim()){continue;}
    let line='';
    for(const ch of para){
      if(ctx.measureText(line+ch).width>maxW&&line){
        const arr=[...line];
        if(NO_START.includes(ch)&&arr.length>1){
          const last=arr.pop();
          lines.push(arr.join(''));
          line=last+ch;
        }else if(NO_START.includes(ch)){
          lines.push(line+ch);
          line='';
        }else{
          lines.push(line);
          line=ch;
        }
      }else{line+=ch;}
    }
    if(line)lines.push(line);
  }
  return lines;
}

// 引號字型度量（引號字級 = 主文字級 × 1.8）
function markMetrics(size){
  const ms=Math.round(size*1.8);
  ctx.font='900 '+ms+'px Georgia,serif';
  const mL=ctx.measureText('“'),mR=ctx.measureText('”');
  return {ms,ascL:mL.actualBoundingBoxAscent,descR:mR.actualBoundingBoxDescent};
}
// 以指定字級排版：斷行、行高（1.5×）、左上引號保留高度一次算齊
function layoutAt(text,size){
  const lines=wrapText(text,'900 '+size+'px '+STACK,QW);
  const lineH=Math.round(size*1.5);
  const resv=Math.ceil(size*0.2+markMetrics(size).ascL);
  return{size,lines,lineH,resv};
}
// 主箴言自動縮字：區域頂端先保留左上引號的高度（確保引號不跑到日期/標題旁），
// 再從最大字級往下試，直到整段放得進剩餘高度
function fitQuote(text){
  for(let size=156;size>=60;size-=8){
    const f=layoutAt(text,size);
    if(f.lines.length*f.lineH<=QBOX.h-f.resv)return f;
  }
  return layoutAt(text,60);
}
// 依目前模式取得排版：自動＝逐級試排（並記下結果字級），手動＝直接用指定字級
function currentFit(text){
  if(sizeMode==='manual'&&manualSize)return layoutAt(text,manualSize);
  const f=fitQuote(text);
  lastAutoSize=f.size;
  return f;
}

function drawOutlined(text,x,y,fill,lineWidth){
  ctx.lineJoin='round';
  ctx.miterLimit=2;
  ctx.strokeStyle='#000';
  ctx.lineWidth=lineWidth;
  shadow(true,18,6);
  ctx.strokeText(text,x,y);
  shadow(false);
  ctx.fillStyle=fill;
  ctx.fillText(text,x,y);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // 背景：cover 置中裁切；未上傳時以深色漸層代替
  if(bgImg){
    const s=Math.max(W/bgImg.width,H/bgImg.height);
    const w=bgImg.width*s,h=bgImg.height*s;
    ctx.drawImage(bgImg,(W-w)/2,(H-h)/2,w,h);
  }else{
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#3b4a63');g.addColorStop(1,'#1e2635');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  ctx.textBaseline='alphabetic';
  // 標題：每日箴言（金黃粗體＋黑陰影，頂部置中）
  ctx.textAlign='center';
  ctx.font='900 118px '+STACK;
  shadow(true,18,6);
  ctx.fillStyle=GOLD;
  ctx.fillText('每日箴言',W/2,218);
  shadow(false);
  // 日期：OO月OO日（白色粗體＋黑描邊）
  ctx.font='700 74px '+STACK;
  drawOutlined(dateKey(),W/2,352,'#fff',6);
  // 主箴言：白色粗體＋黑描邊＋陰影，區域內垂直置中；
  // 手動字級排不下時改為頂端對齊、只往下溢出，並顯示警告
  const text=taContent.value.trim();
  if(sizeWarn)sizeWarn.hidden=true;
  if(text){
    const fit=currentFit(text);
    const mk=markMetrics(fit.size);
    const totalH=fit.lines.length*fit.lineH;
    const availH=QBOX.h-fit.resv;
    const overflow=totalH>availH;
    if(overflow&&sizeWarn)sizeWarn.hidden=false;
    let y=QBOX.top+fit.resv+(overflow?0:(availH-totalH)/2)+Math.round(fit.size*0.85);
    // 左上金黃引號（置於主文第一行上方；fitQuote 已保留高度，不會侵入日期/標題）
    ctx.textAlign='left';
    ctx.font='900 '+mk.ms+'px Georgia,serif';
    shadow(true,12,4);
    ctx.fillStyle=GOLD;
    ctx.fillText('“',QX-14,y-Math.round(fit.size*1.05));
    shadow(false);
    ctx.font='900 '+fit.size+'px '+STACK;
    const lw=Math.max(7,Math.round(fit.size*0.11));
    let lastBaseline=y;
    for(const line of fit.lines){
      drawOutlined(line,QX,y,'#fff',lw);
      lastBaseline=y;
      y+=fit.lineH;
    }
    // 右下金黃引號：下緣對齊箴言最後一行的下緣；
    // 預設在區塊右緣，最後一行太長時自動右移，避免壓到行尾文字
    ctx.font='900 '+fit.size+'px '+STACK;
    const lastM=ctx.measureText(fit.lines[fit.lines.length-1]);
    const lastBottom=lastBaseline+lastM.actualBoundingBoxDescent;
    ctx.font='900 '+mk.ms+'px Georgia,serif';
    const markX=Math.max(QX+QW+14, QX+lastM.width+24+ctx.measureText('”').width);
    ctx.textAlign='right';
    shadow(true,12,4);
    ctx.fillStyle=GOLD;
    ctx.fillText('”',markX,lastBottom-mk.descR);
    shadow(false);
  }
  // 作者：——池田大作（金黃粗體，主文下方偏右；68 放大兩級距 → 84）
  ctx.textAlign='right';
  ctx.font='900 84px '+STACK;
  shadow(true,14,5);
  ctx.fillStyle=GOLD;
  ctx.fillText('——池田大作',W-140,1742);
  shadow(false);
  // 出處：白色粗體，作者下方（過長自動換行，最多三行；46 放大兩級距 → 62）
  const src=inSource.value.trim();
  if(src){
    ctx.font='700 62px '+STACK;
    const sLines=wrapText(src,ctx.font,SW).slice(0,3);
    let sy=1848;
    for(const line of sLines){
      drawOutlined(line,W-140,sy,'#fff',6);
      sy+=88;
    }
  }
}

function requestDraw(){
  if(rafPending)return;
  rafPending=true;
  requestAnimationFrame(()=>{rafPending=false;draw();});
}

function handleFile(file){
  if(!file)return;
  if(!file.type.startsWith('image/')){alert('請選擇圖片檔案（JPG、PNG 等）');return;}
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    URL.revokeObjectURL(url);
    bgImg=img;
    dropHint.textContent='已載入：'+file.name+'（點擊可更換）';
    dropzone.classList.add('loaded');
    requestDraw();
  };
  img.onerror=()=>{URL.revokeObjectURL(url);alert('無法讀取這個圖片檔案');};
  img.src=url;
}

btnPrev.addEventListener('click',()=>shiftDate(-1));
btnNext.addEventListener('click',()=>shiftDate(1));
btnToday.addEventListener('click',()=>setDate(new Date()));
btnDate.addEventListener('click',()=>{
  if(typeof dateInput.showPicker==='function'){
    try{dateInput.showPicker();return;}catch(e){/* 落入 fallback */}
  }
  dateInput.classList.add('exposed');  // 不支援 showPicker 時直接顯示原生日期欄位
  dateInput.focus();
});
dateInput.addEventListener('change',()=>{
  const v=dateInput.value;
  if(!v)return;
  const p=v.split('-');
  setDate(new Date(+p[0],+p[1]-1,+p[2]));
});
taContent.addEventListener('input',requestDraw);
inSource.addEventListener('input',requestDraw);
function setSizeMode(m){
  sizeMode=m;
  btnSizeAuto.classList.toggle('active',m==='auto');
  btnSizeManual.classList.toggle('active',m==='manual');
  sizeSeg.hidden=(m!=='manual');
  if(m==='manual'){
    manualSize=lastAutoSize||116;  // 初始值 = 目前自動縮字的結果
    sizeInput.value=manualSize;
  }
  requestDraw();
}
function setManualSize(v){
  v=Math.round(v);
  if(!isFinite(v))v=manualSize||lastAutoSize||116;
  v=Math.min(240,Math.max(24,v));
  manualSize=v;
  sizeInput.value=v;
  requestDraw();
}
btnSizeAuto.addEventListener('click',()=>setSizeMode('auto'));
btnSizeManual.addEventListener('click',()=>setSizeMode('manual'));
btnSizeDown.addEventListener('click',()=>setManualSize((manualSize||lastAutoSize||116)-8));
btnSizeUp.addEventListener('click',()=>setManualSize((manualSize||lastAutoSize||116)+8));
sizeInput.addEventListener('change',()=>setManualSize(parseFloat(sizeInput.value)));
dropzone.addEventListener('click',()=>fileInput.click());
dropzone.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fileInput.click();}});
dropzone.addEventListener('dragover',e=>{e.preventDefault();dropzone.classList.add('dragover');});
dropzone.addEventListener('dragleave',()=>dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop',e=>{
  e.preventDefault();
  dropzone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change',()=>handleFile(fileInput.files[0]));
btnDownload.addEventListener('click',()=>{
  cv.toBlob(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download='每日箴言_'+dateKey()+'.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  },'image/png');
});

// 等網頁字型載入完成後重繪，避免 Canvas 畫到 fallback 字型
if(document.fonts){
  Promise.all([
    document.fonts.load('900 100px "Noto Sans TC"','每日箴言'),
    document.fonts.load('700 100px "Noto Sans TC"','每日箴言')
  ]).then(requestDraw).catch(()=>{});
  document.fonts.ready.then(requestDraw);
}

setDate(new Date());
</script>
