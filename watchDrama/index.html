<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>追劇小幫手 - 您的私人影院</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --primary: #f59e0b;
            --primary-glow: rgba(245, 158, 11, 0.3);
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #f43f5e;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            font-size: 1.15rem; /* 整體字級加大 */
        }

        /* --- Layout --- */
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 80px; /* 加高 Header */
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 
                inset 1px 1px 2px rgba(255,255,255,0.4),
                inset -1px -1px 2px rgba(0,0,0,0.5),
                0 4px 8px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .main-content {
            padding: 110px 1.5rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- Components --- */
        .btn {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.8rem 1.2rem; /* 稍微縮小內距以平衡寬度 */
            border-radius: 16px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: all 0.3s;
            font-size: 1.1rem;
            flex-shrink: 0;      /* 禁止被壓縮 */
            min-width: 160px;   /* 固定最小寬度 */
            white-space: nowrap; /* 禁止文字換行 */
        }

        .btn:active { transform: scale(0.95); } /* 點擊回饋 */
        .btn-primary { background: var(--primary); color: #000; border: none; }
        .btn-primary:hover { background: #fbbf24; box-shadow: 0 5px 20px var(--primary-glow); }
        
        /* 新增：追蹤(綠)/取消(紅) 樣式 */
        .btn-success { background: var(--success); color: #fff; border: none; }
        .btn-success:hover { background: #059669; box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4); }
        .btn-danger { background: var(--danger); color: #fff; border: none; }
        .btn-danger:hover { background: #e11d48; box-shadow: 0 5px 20px rgba(244, 63, 94, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* --- Views --- */
        .view { display: none; animation: fadeIn 0.4s ease-out; }
        .view.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- User Selector --- */
        #userView { text-align: center; padding-top: 5vh; }
        #userView h1 { font-size: 2.2rem; margin-bottom: 1rem; }
        .user-grid { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; margin-top: 2rem; }
        .user-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 28px;
            cursor: pointer;
            transition: all 0.3s;
            width: 85%;
            max-width: 300px;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            border: 2px solid transparent;
        }
        .user-card:hover { border-color: var(--primary); background: #2d3748; }
        .user-avatar { 
            width: 70px; height: 70px; background: var(--primary); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: #000; font-weight: 800;
            flex-shrink: 0;
        }
        .user-card h3 { font-size: 1.4rem; }

        /* --- Grid (Home & Library) --- */
        .drama-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); /* 卡片放寬方便閱讀 */
            gap: 2rem;
        }

        /* 橫向卡片排列 (用於首頁) */
        .drama-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); /* 在電腦上可並排，手機上自動佔滿 */
            gap: 1.5rem;
        }

        .drama-card-horizontal {
            background: var(--card-bg);
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            gap: 1.5rem;
            padding: 1.2rem;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
            align-items: center;
        }

        .drama-card-horizontal:hover { border-color: var(--primary); background: #2d3748; }
        
        .drama-card-horizontal .img-box {
            width: 140px;
            flex-shrink: 0;
            aspect-ratio: 2/3;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .drama-card-horizontal .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .drama-card-horizontal .content-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            overflow: hidden;
        }

        .drama-card-horizontal .title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .drama-card-horizontal .progress-text {
            color: var(--primary);
            font-size: 1.1rem;
            font-weight: 800;
            margin: 0.2rem 0;
        }

        .drama-card-horizontal .intro-text {
            color: var(--text-dim);
            font-size: 1.05rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }

        .drama-card-horizontal { position: relative; } /* 為右上角按鈕做準備 */

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            background: rgba(244, 63, 94, 0.15);
            color: var(--danger);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(244, 63, 94, 0.2);
            z-index: 10;
        }

        .remove-btn:hover {
            background: var(--danger);
            color: #fff;
            transform: scale(1.1);
        }

        /* 探索清單樣式 (條列式) */
        .library-list {
            background: var(--card-bg);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .library-item {
            display: flex;
            align-items: center; /* 標題換行時按鈕居中 */
            justify-content: space-between;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
            gap: 1.5rem; /* 字與按鈕間距 */
        }

        .library-item:last-child { border-bottom: none; }
        .library-item:hover { background: rgba(255,255,255,0.03); }

        .library-item-content {
            flex: 1; /* 佔滿剩餘空間 */
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            min-width: 0; /* 允許內部文字換行 */
        }

        .library-item-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #fff;
        }

        .library-item-meta {
            font-size: 0.95rem;
            color: var(--text-dim);
        }

        .library-item-meta.followed {
            color: var(--primary);
            font-weight: 600;
        }

        /* --- Player View --- */
        .player-container { max-width: 1000px; margin: 0 auto; }
        #videoPlayer { width: 100%; border-radius: 20px; background: #000; margin-bottom: 1.5rem; }
        .episode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
        .ep-btn {
            background: #2d3748; border: 1px solid rgba(255,255,255,0.1); padding: 1.2rem 0.5rem; border-radius: 14px; 
            color: #fff; cursor: pointer; transition: 0.2s; font-size: 1.1rem; font-weight: 600;
        }
        .ep-btn.active { background: var(--primary); color: #000; border: none; box-shadow: 0 0 15px var(--primary-glow); }

        .line-selector { display: flex; gap: 0.8rem; margin: 1.5rem 0; overflow-x: auto; padding-bottom: 0.8rem; }
        .line-tab {
            padding: 0.7rem 1.5rem; background: rgba(255,255,255,0.08); border-radius: 24px;
            cursor: pointer; white-space: nowrap; font-size: 1.1rem; font-weight: 600;
        }
        .line-tab.active { background: var(--primary); color: #000; border: none; }

        /* --- Utils --- */
        .loading { text-align: center; padding: 5rem; font-size: 1.2rem; color: var(--text-dim); }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1.5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Modal (Elderly Friendly) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 1.5rem;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 32px;
            padding: 2.5rem 2rem;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.1);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-message {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 2.5rem;
            line-height: 1.4;
            color: #fff;
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
    </style>
</head>
<body>

    <header class="header" id="appHeader" style="display: none;">
        <div style="display: flex; align-items: center; gap: 1rem; cursor: pointer;" onclick="goHome()">
            <img src="icon.png" class="header-logo" alt="Logo">
            <h1 style="font-size: 1.4rem; font-weight: 800;">追劇小幫手</h1>
        </div>
        <div style="display: flex; gap: 1rem;">
            <button class="btn" onclick="logout()" id="userBtn">
                <span class="material-symbols-outlined">account_circle</span> <span></span>
            </button>
        </div>
    </header>

    <div class="main-content">
        <!-- 1. 使用者選擇頁面 -->
        <div id="userView" class="view">
            <h1>歡迎回來</h1>
            <p style="color: var(--text-dim); margin-top: 0.5rem;">請選擇您的使用者身份</p>
            <div id="userList" class="user-grid"></div>
        </div>

        <!-- 2. 我要追的劇 (首頁) -->
        <div id="homeView" class="view">
            <h2 style="margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 0.6rem;">
                    <span class="material-symbols-outlined" style="color: var(--primary);">favorite</span> 我的追劇清單
                </div>
                <button class="btn btn-primary" onclick="showView('libraryView')" style="padding: 0.6rem 1.2rem; border-radius: 12px;">
                    <span class="material-symbols-outlined">settings_suggest</span> 管理
                </button>
            </h2>
            <div id="myDramaGrid" class="drama-list"></div>
            
            <!-- 版本資訊與重新整理 -->
            <div style="margin-top: 4rem; text-align: center; color: var(--text-dim); font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 1rem; padding-bottom: 3rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 2rem;">
                <span id="fileModTime">最後修改時間：載入中...</span>
                <button class="btn" style="min-width: auto; width: 50px; height: 50px; border-radius: 50%; padding: 0;" onclick="location.reload()" title="重新整理頁面">
                    <span class="material-symbols-outlined">refresh</span>
                </button>
            </div>
        </div>

        <!-- 3. 全域劇庫 (找劇) -->
        <div id="libraryView" class="view">
            <h2 style="margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 0.6rem;">
                    <span class="material-symbols-outlined" style="color: var(--primary);">explore</span> 管理追劇清單
                </div>
                <button class="btn" onclick="goHome()" style="padding: 0.6rem 1.2rem; border-radius: 12px;">
                    <span class="material-symbols-outlined">arrow_back</span> 返回
                </button>
            </h2>
            <div id="globalDramaGrid" class="library-list"></div>
        </div>

        <!-- 4. 播放頁面 -->
        <div id="playerView" class="view">
            <div class="player-container">
                <video id="videoPlayer" controls></video>
                
                <div id="dramaDetail" style="margin-top: 2rem;">
                    <div style="display: flex; gap: 2rem; margin-bottom: 2rem;">
                        <img id="playerCover" src="" style="width: 150px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                        <div style="flex: 1;">
                            <h2 id="playerTitle"></h2>
                            <p id="playerProgress" style="color: var(--primary); margin: 0.5rem 0; font-size: 0.9rem; font-weight: 600;"></p>
                            <p id="playerIntro" style="color: var(--text-dim); font-size: 0.9rem; margin-top: 1rem; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;"></p>
                        </div>
                    </div>

                    <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                        <button class="btn btn-primary" id="resumeBtn">點擊續播</button>
                        <button class="btn" id="prevBtn"><span class="material-symbols-outlined">skip_previous</span> 上一集</button>
                        <button class="btn" id="nextBtn"><span class="material-symbols-outlined">skip_next</span> 下一集</button>
                    </div>

                    <div id="lineSelector" class="line-selector"></div>
                    <div id="episodeGrid" class="episode-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 自定義確認視窗 (長輩大字版) -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-content">
            <div id="confirmMsg" class="modal-message"></div>
            <div class="modal-actions">
                <button class="btn btn-danger" style="height: 70px; font-size: 1.4rem;" id="modalConfirmBtn">確定，我要取消追蹤</button>
                <button class="btn" style="height: 70px; font-size: 1.4rem;" onclick="closeModal()">我點錯了，不要取消</button>
            </div>
        </div>
    </div>

    <script>
        // --- 設定 (由您提供的 URL) ---
        const GAS_1 = "https://script.google.com/macros/s/AKfycbzwHa2fa4e_QdyfD3z01tXepwY9ZyY98UlS_6mjVGOsPZaoHVloSyEc9_kJniuNn2_X/exec";
        const GAS_2 = "https://script.google.com/macros/s/AKfycbzw88UmoJlK2n8CNn65QsitfC0N4OUk3I4WbDB72gCwj7ptR4i_A5hoI8aDuEGpHfks/exec";

        // --- 全域變數 ---
        let currentUser = null;
        let globalDramaList = JSON.parse(localStorage.getItem('cache_global_list') || '[]');
        let userLibrary = [];
        let userProgress = [];
        let currentDrama = null;
        let currentLine = 0;
        let currentEpIdx = 0;

        // --- 初始化 ---
        window.onload = async () => {
            updateFileModTime(); // 初始化顯示檔案最後修改時間
            const savedUser = localStorage.getItem('watch_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                // 如果有緩存，先用緩存資料渲染首頁，避免白畫面
                syncFromCache();
                await startApp();
            } else {
                await loadUsers();
            }
        };

        function syncFromCache() {
            const cachedData = localStorage.getItem(`cache_user_data_${currentUser.userId}`);
            if (cachedData) {
                const data = JSON.parse(cachedData);
                userLibrary = data.library || [];
                userProgress = data.progress || [];
                renderHome();
            }
        }

        // --- 核心流程 ---
        async function loadUsers() {
            showView('userView');
            const list = document.getElementById('userList');
            
            // 先看緩存
            const cachedUsers = localStorage.getItem('cache_users');
            if (cachedUsers) {
                renderUserCards(JSON.parse(cachedUsers));
            } else {
                list.innerHTML = '<div class="spinner"></div><p>正在連線中...</p>';
            }

            try {
                const res = await fetch(`${GAS_2}?action=get_users`);
                const users = await res.json();
                localStorage.setItem('cache_users', JSON.stringify(users));
                renderUserCards(users);
            } catch (e) {
                console.error("Load users failed", e);
            }
        }

        function renderUserCards(users) {
            const list = document.getElementById('userList');
            list.innerHTML = users.map(u => `
                <div class="user-card" onclick='loginUser(${JSON.stringify(u)})'>
                    <div class="user-avatar">${u.userName[0]}</div>
                    <h3>${u.userName}</h3>
                </div>
            `).join('');
        }

        async function loginUser(user) {
            currentUser = user;
            localStorage.setItem('watch_user', JSON.stringify(user));
            await startApp();
        }

        function logout() {
            localStorage.removeItem('watch_user');
            location.reload();
        }

        async function startApp() {
            document.getElementById('appHeader').style.display = 'flex';
            const userBtn = document.getElementById('userBtn');
            userBtn.querySelector('span:last-child').innerText = currentUser.userName;
            
            // 同步載入資料
            await Promise.all([syncGlobalList(), syncUserLibrary()]);
            showView('homeView');
        }

        async function syncGlobalList() {
            try {
                const res = await fetch(GAS_1);
                globalDramaList = await res.json();
                localStorage.setItem('cache_global_list', JSON.stringify(globalDramaList));
            } catch (e) { console.error("Global sync failed", e); }
        }

        async function syncUserLibrary(skipHomeRefresh = false) {
            try {
                const res = await fetch(`${GAS_2}?action=get_user_data&userId=${currentUser.userId}`);
                const data = await res.json();
                userLibrary = data.library || [];
                userProgress = data.progress || [];
                
                // 緩存用戶專屬資料
                localStorage.setItem(`cache_user_data_${currentUser.userId}`, JSON.stringify(data));
                
                if (!skipHomeRefresh) renderHome();
                renderLibrary();
            } catch (e) { console.error("User sync failed", e); }
        }

        function updateFileModTime() {
            const lastMod = new Date(document.lastModified);
            const formatted = lastMod.getFullYear() + '-' + 
                              (lastMod.getMonth() + 1).toString().padStart(2, '0') + '-' + 
                              lastMod.getDate().toString().padStart(2, '0') + ' ' + 
                              lastMod.getHours().toString().padStart(2, '0') + ':' + 
                              lastMod.getMinutes().toString().padStart(2, '0') + ':' + 
                              lastMod.getSeconds().toString().padStart(2, '0');
            document.getElementById('fileModTime').innerText = `最後修改時間：${formatted}`;
        }

        // --- 畫面渲染 ---
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            window.scrollTo(0,0);
        }

        async function goHome() {
            showView('homeView');
            await syncUserLibrary(); // 回到首頁時同步最新進度與清單
        }

        function renderHome() {
            const grid = document.getElementById('myDramaGrid');
            if (userLibrary.length === 0) {
                grid.innerHTML = '<div style="text-align: center; padding: 4rem;">目前沒有追蹤的劇集！</div>';
                return;
            }

            // 依最後觀看時間排序
            const sortedLib = [...userLibrary].sort((a,b) => new Date(b.lastWatchedDate || 0) - new Date(a.lastWatchedDate || 0));
            
            grid.innerHTML = sortedLib.map(item => {
                const drama = globalDramaList.find(d => d.id.toString() === item.dramaId.toString());
                if (!drama) return '';
                const progress = userProgress.find(p => p.dramaId.toString() === item.dramaId.toString());
                return `
                    <div class="drama-card-horizontal" onclick="openPlayer('${drama.id}')">
                        <div class="remove-btn" onclick="confirmUntrack(event, '${drama.id}', '${drama.name.replace(/'/g, "\\'")}')" title="取消追蹤">
                            <span class="material-symbols-outlined" style="font-size: 20px;">close</span>
                        </div>
                        <div class="img-box">
                            <img src="${drama.cover_image}">
                        </div>
                        <div class="content-box">
                            <div class="title">${drama.name}</div>
                            <div class="progress-text">
                                ${progress ? `上次觀看：${progress.lineName} - ${progress.episodeName}` : '尚未開始觀看或紀錄中'}
                            </div>
                            <div class="intro-text">${drama.introduction}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderLibrary() {
            const grid = document.getElementById('globalDramaGrid');
            
            // 排序邏輯：有追蹤的在前，沒追蹤的在後；各組內依更新時間降冪
            const sortedList = [...globalDramaList].sort((a, b) => {
                const isFollowedA = userLibrary.some(item => item.dramaId.toString() === a.id.toString());
                const isFollowedB = userLibrary.some(item => item.dramaId.toString() === b.id.toString());
                
                if (isFollowedA !== isFollowedB) {
                    return isFollowedA ? -1 : 1;
                }
                return new Date(b.update_time) - new Date(a.update_time);
            });

            grid.innerHTML = sortedList.map(drama => {
                const isFollowed = userLibrary.some(item => item.dramaId.toString() === drama.id.toString());
                return `
                    <div class="library-item">
                        <div class="library-item-content">
                            <div class="library-item-title">${drama.name}</div>
                            <div class="library-item-meta ${isFollowed ? 'followed' : ''}">
                                ${isFollowed ? '<span class="material-symbols-outlined" style="font-size:1rem; vertical-align:middle;">check_circle</span> 已在追蹤清單' : '尚未追蹤'} · 更新於 ${new Date(drama.update_time).toLocaleDateString()}
                            </div>
                        </div>
                        <button class="btn ${isFollowed ? 'btn-danger' : 'btn-success'}" id="btn-follow-${drama.id}" onclick="toggleFollow('${drama.id}', true)">
                            <span class="material-symbols-outlined">${isFollowed ? 'heart_minus' : 'heart_plus'}</span>
                            ${isFollowed ? '取消追蹤' : '追　　蹤'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        // --- 管理邏輯 ---
        async function toggleFollow(dramaId, skipHomeRefresh = false) {
            const btn = document.getElementById(`btn-follow-${dramaId}`);
            if (btn) btn.disabled = true;

            try {
                const res = await fetch(GAS_2, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'toggle_follow', 
                        userId: currentUser.userId, 
                        dramaId: dramaId 
                    })
                });
                const result = await res.json();
                if (result.success) {
                    await syncUserLibrary(skipHomeRefresh); // 根據來源決定是否重整首頁
                }
            } catch (e) { 
                console.error("Toggle follow failed", e);
                // 這裡不彈出 alert，以免跟 confirmUntrack 衝突，交由調用者處理
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        async function confirmUntrack(event, dramaId, dramaName) {
            event.stopPropagation();
            const modal = document.getElementById('confirmModal');
            const msg = document.getElementById('confirmMsg');
            const confirmBtn = document.getElementById('modalConfirmBtn');

            msg.innerText = `確定要取消追蹤「${dramaName}」嗎？\n取消後將一併刪除播放進度喔！`;
            modal.style.display = 'flex';

            confirmBtn.onclick = async () => {
                closeModal();
                await toggleFollow(dramaId);
            };
        }

        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }

        // --- 播放邏輯 ---
        function openPlayer(dramaId) {
            currentDrama = globalDramaList.find(d => d.id.toString() === dramaId.toString());
            const progress = userProgress.find(p => p.dramaId.toString() === dramaId.toString());
            
            document.getElementById('playerCover').src = currentDrama.cover_image;
            document.getElementById('playerTitle').innerText = currentDrama.name;
            document.getElementById('playerIntro').innerText = currentDrama.introduction;
            
            const lines = JSON.parse(currentDrama.sources);
            renderLines(lines, progress);
            
            showView('playerView');
        }

        function renderLines(lines, progress) {
            const selector = document.getElementById('lineSelector');
            selector.innerHTML = lines.map((line, idx) => `
                <div class="line-tab ${progress && progress.lineName === line.line_name ? 'active' : ''}" 
                     id="line-tab-${idx}" onclick="selectLine(${idx})">
                    ${line.line_name}
                </div>
            `).join('');

            // 如果有進度，選取上次的線路，否則選第一個
            currentLine = progress ? lines.findIndex(l => l.line_name === progress.lineName) : 0;
            if (currentLine === -1) currentLine = 0;
            selectLine(currentLine, progress ? progress.episodeName : null);
        }

        function selectLine(idx, highlightEp = null) {
            currentLine = idx;
            document.querySelectorAll('.line-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`line-tab-${idx}`).classList.add('active');

            const lines = JSON.parse(currentDrama.sources);
            const episodes = lines[idx].episodes;
            const grid = document.getElementById('episodeGrid');
            
            grid.innerHTML = episodes.map((ep, eIdx) => `
                <button class="ep-btn ${highlightEp === ep.name ? 'active' : ''}" 
                        onclick="playVideo(${idx}, ${eIdx})">
                    ${ep.name}
                </button>
            `).join('');

            if (highlightEp) {
                document.getElementById('playerProgress').innerText = `上次觀看：${lines[idx].line_name} - ${highlightEp}`;
            } else {
                document.getElementById('playerProgress').innerText = '尚未開始觀看或紀錄中';
            }
        }

        async function playVideo(lineIdx, epIdx) {
            currentLine = lineIdx;
            currentEpIdx = epIdx;
            
            const lines = JSON.parse(currentDrama.sources);
            const line = lines[lineIdx];
            const ep = line.episodes[epIdx];
            const video = document.getElementById('videoPlayer');

            // HLS 播放邏輯
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(ep.play_url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ep.play_url;
                video.addEventListener('loadedmetadata', () => video.play());
            }

            // 更新高亮
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.ep-btn')[epIdx].classList.add('active');
            document.getElementById('playerProgress').innerText = `正在播放：${line.line_name} - ${ep.name}`;

            // 同步進度到雲端
            await fetch(GAS_2, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'update_progress',
                    userId: currentUser.userId,
                    dramaId: currentDrama.id,
                    lineName: line.line_name,
                    episodeName: ep.name,
                    timestamp: 0 // 未來可實作詳細秒數同步
                })
            });
        }

        // 續播、上一集、下一集
        document.getElementById('resumeBtn').onclick = () => {
            const progress = userProgress.find(p => p.dramaId.toString() === currentDrama.id.toString());
            const lines = JSON.parse(currentDrama.sources);
            if (progress) {
                const lIdx = lines.findIndex(l => l.line_name === progress.lineName);
                const eIdx = lines[lIdx].episodes.findIndex(e => e.name === progress.episodeName);
                playVideo(lIdx, eIdx);
            } else {
                playVideo(0, 0);
            }
        };

        document.getElementById('prevBtn').onclick = () => {
            if (currentEpIdx > 0) playVideo(currentLine, currentEpIdx - 1);
        };

        document.getElementById('nextBtn').onclick = () => {
            const lines = JSON.parse(currentDrama.sources);
            if (currentEpIdx < lines[currentLine].episodes.length - 1) playVideo(currentLine, currentEpIdx + 1);
        };
    </script>
</body>
</html>
