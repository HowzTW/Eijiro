<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>追劇小幫手</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.6.17"></script>
    <style>
        :root {
            --primary: #f59e0b;
            --primary-glow: rgba(245, 158, 11, 0.3);
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #f43f5e;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            font-size: 1.15rem; /* 整體字級加大 */
        }

        /* --- Layout --- */
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: calc(80px + env(safe-area-inset-top)); /* 考慮 iOS 劉海高度 */
            padding: env(safe-area-inset-top) 1.5rem 0 1.5rem; /* 將內容往下推 */
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 
                inset 1px 1px 2px rgba(255,255,255,0.4),
                inset -1px -1px 2px rgba(0,0,0,0.5),
                0 4px 8px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .main-content {
            padding: calc(110px + env(safe-area-inset-top)) 1.5rem calc(2rem + env(safe-area-inset-bottom)); /* 支援 iOS 安全邊距 */
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- Components --- */
        .btn {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.8rem 1.2rem; /* 稍微縮小內距以平衡寬度 */
            border-radius: 16px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: all 0.3s;
            font-size: 1.1rem;
            flex-shrink: 0;      /* 禁止被壓縮 */
            min-width: 160px;   /* 固定最小寬度 */
            white-space: nowrap; /* 禁止文字換行 */
        }

        .btn:active { transform: scale(0.95); } /* 點擊回饋 */
        .btn-primary { background: var(--primary); color: #000; border: none; }
        .btn-primary:hover { background: #fbbf24; box-shadow: 0 5px 20px var(--primary-glow); }
        
        /* 新增：追蹤(綠)/取消(紅) 樣式 */
        .btn-success { background: var(--success); color: #fff; border: none; }
        .btn-success:hover { background: #059669; box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4); }
        .btn-danger { background: var(--danger); color: #fff; border: none; }
        .btn-danger:hover { background: #e11d48; box-shadow: 0 5px 20px rgba(244, 63, 94, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* --- Views --- */
        .view { display: none; animation: fadeIn 0.4s ease-out; }
        .view.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- User Selector --- */
        #userView { text-align: center; padding-top: 5vh; }
        #userView h1 { font-size: 2.2rem; margin-bottom: 1rem; }
        .user-grid { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; margin-top: 2rem; }
        .user-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 28px;
            cursor: pointer;
            transition: all 0.3s;
            width: 85%;
            max-width: 300px;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            border: 2px solid transparent;
        }
        .user-card:hover { border-color: var(--primary); background: #2d3748; }
        .user-avatar { 
            width: 70px; height: 70px; background: var(--primary); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: #000; font-weight: 800;
            flex-shrink: 0;
        }
        .user-card h3 { font-size: 1.4rem; }

        /* --- Grid (Home & Library) --- */
        .drama-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); /* 卡片放寬方便閱讀 */
            gap: 1.5rem;
        }

        /* 橫向卡片排列 (用於首頁) */
        .drama-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); /* 在電腦上排版更緊湊，可容納三張 */
            gap: 1.5rem;
        }

        .drama-card-horizontal {
            background: var(--card-bg);
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            gap: 1.5rem;
            padding: 1.2rem;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
            align-items: stretch; /* 讓圖片與內容等高 */
        }

        .drama-card-horizontal:hover { border-color: var(--primary); background: #2d3748; }
        
        .drama-card-horizontal .img-box {
            width: clamp(100px, 35vw, 140px); /* 手機上自動縮小，保留文字空間 */
            flex-shrink: 0;
            aspect-ratio: 2/3;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .drama-card-horizontal .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .drama-card-horizontal .content-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .drama-card-horizontal .title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .drama-card-horizontal .progress-text {
            color: var(--primary);
            font-size: 1.1rem;
            font-weight: 800;
            margin: 0;
            margin-top: auto; /* 推到底部 */
            text-align: right; /* 靠右對齊 */
        }

        .drama-card-horizontal { position: relative; } /* 為右上角按鈕做準備 */

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            background: rgba(244, 63, 94, 0.15);
            color: var(--danger);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(244, 63, 94, 0.2);
            z-index: 10;
        }

        .remove-btn:hover {
            background: var(--danger);
            color: #fff;
            transform: scale(1.1);
        }

        /* 探索清單樣式 (條列式) */
        .library-list {
            background: var(--card-bg);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .library-item {
            display: flex;
            align-items: center; /* 標題換行時按鈕居中 */
            justify-content: space-between;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
            gap: 1.5rem; /* 字與按鈕間距 */
        }

        .library-item:last-child { border-bottom: none; }
        .library-item:hover { background: rgba(255,255,255,0.03); }

        .library-item-content {
            flex: 1; /* 佔滿剩餘空間 */
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            min-width: 0; /* 允許內部文字換行 */
        }

        .library-item-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #fff;
        }

        .library-item-meta {
            font-size: 0.95rem;
            color: var(--text-dim);
        }

        .library-item-meta.followed {
            color: var(--primary);
            font-weight: 600;
        }

        /* --- Player View --- */
        .player-container { max-width: 1000px; margin: 0 auto; }
        #videoPlayer { width: 100%; border-radius: 20px; background: #000; margin-bottom: 1.5rem; }
        .episode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
        .ep-btn {
            background: #2d3748; border: 1px solid rgba(255,255,255,0.1); padding: 1.2rem 0.5rem; border-radius: 14px; 
            color: #fff; cursor: pointer; transition: 0.2s; font-size: 1.1rem; font-weight: 600;
        }
        .ep-btn.active { background: var(--primary); color: #000; border: none; box-shadow: 0 0 15px var(--primary-glow); }

        .line-selector { display: flex; gap: 0.8rem; margin: 1.5rem 0; overflow-x: auto; padding-bottom: 0.8rem; }
        .line-tab {
            padding: 0.7rem 1.5rem; background: rgba(255,255,255,0.08); border-radius: 24px;
            cursor: pointer; white-space: nowrap; font-size: 1.1rem; font-weight: 600;
        }
        .line-tab.active { background: var(--primary); color: #000; border: none; }

        /* --- Utils --- */
        .loading { text-align: center; padding: 5rem; font-size: 1.2rem; color: var(--text-dim); }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1.5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Modal (Elderly Friendly) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: calc(1.5rem + env(safe-area-inset-top)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom));
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 32px;
            padding: 2.5rem 2rem;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.1);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-message {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 2.5rem;
            line-height: 1.4;
            color: #fff;
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* --- Intro Modal (Large Text & Scrollable) --- */
        #playerIntro { cursor: pointer; transition: color 0.2s; }
        #playerIntro:hover { color: var(--primary); }

        .intro-modal-content {
            background: var(--card-bg);
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            border: 2px solid rgba(255,255,255,0.1);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }

        .intro-modal-header {
            padding: 2rem 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .intro-modal-body {
            padding: 2rem;
            overflow-y: auto;
            font-size: 1.4rem;
            line-height: 1.6;
            color: #fff;
            text-align: justify;
            flex: 1;
        }

        .intro-modal-footer {
            padding: 1.5rem 2rem 2rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <header class="header" id="appHeader" style="display: none;">
        <div style="display: flex; align-items: center; gap: 1rem; cursor: pointer;" onclick="goHome()">
            <img src="icon.png" class="header-logo" alt="Logo">
            <h1 style="font-size: 1.4rem; font-weight: 800;">追劇小幫手</h1>
        </div>
        <div style="display: flex; gap: 1rem;">
            <button class="btn" onclick="logout()" id="userBtn">
                <span class="material-symbols-outlined">account_circle</span> <span></span>
            </button>
        </div>
    </header>

    <div class="main-content">
        <!-- 1. 使用者選擇頁面 -->
        <div id="userView" class="view">
            <h1>歡迎回來</h1>
            <p style="color: var(--text-dim); margin-top: 0.5rem;">請選擇您的使用者身份</p>
            <div id="userList" class="user-grid"></div>
        </div>

        <!-- 2. 我要追的劇 (首頁) -->
        <div id="homeView" class="view">
            <h2 style="margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 0.6rem;">
                    <span class="material-symbols-outlined" style="color: var(--primary);">favorite</span> 我的追劇清單
                </div>
                <button class="btn btn-primary" onclick="showPasswordModal(() => showView('libraryView'))" style="padding: 0.6rem 1.2rem; border-radius: 12px;">
                    <span class="material-symbols-outlined">settings_suggest</span> 管理
                </button>
            </h2>
            <div id="myDramaGrid" class="drama-list"></div>
            
            <!-- 版本資訊與重新整理 -->
            <div style="margin-top: 4rem; text-align: center; color: var(--text-dim); font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 1rem; padding-bottom: 3rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 2rem;">
                <span id="fileModTime">最後修改時間：載入中...</span>
                <button class="btn" style="min-width: auto; width: 50px; height: 50px; border-radius: 50%; padding: 0;" onclick="location.reload()" title="重新整理頁面">
                    <span class="material-symbols-outlined">refresh</span>
                </button>
            </div>
        </div>

        <!-- 3. 全域劇庫 (找劇) -->
        <div id="libraryView" class="view">
            <h2 style="margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 0.6rem;">
                    <span class="material-symbols-outlined" style="color: var(--primary);">explore</span> 管理追劇清單
                </div>
                <button class="btn" onclick="goHome()" style="padding: 0.6rem 1.2rem; border-radius: 12px;">
                    <span class="material-symbols-outlined">arrow_back</span> 返回
                </button>
            </h2>
            <div id="globalDramaGrid" class="library-list"></div>
        </div>

        <!-- 4. 播放頁面 -->
        <div id="playerView" class="view">
            <div class="player-container">
                <!-- 標題與返回 -->
                <h2 style="margin-bottom: 1.5rem; display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 0.8rem;">
                    <div id="playerTitle" style="font-size: 1.8rem; font-weight: 800; color: #fff;"></div>
                    <div style="display: flex; gap: 0.8rem; margin-left: auto;">
                        <button class="btn" id="fullscreenBtn" onclick="enterFullscreen()" style="padding: 0.6rem 1.2rem; border-radius: 12px;">
                            <span class="material-symbols-outlined">fullscreen</span> 全螢幕
                        </button>
                        <button class="btn" onclick="goHome()" style="padding: 0.6rem 1.2rem; border-radius: 12px;">
                            <span class="material-symbols-outlined">arrow_back</span> 返回
                        </button>
                    </div>
                </h2>

                <video id="videoPlayer" controls></video>
                
                <div id="dramaDetail" style="margin-top: 2rem;">
                    <div style="display: flex; gap: 2rem; margin-bottom: 2rem; align-items: flex-start;">
                        <img id="playerCover" src="" style="width: 140px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); flex-shrink: 0;" onerror="this.style.display='none'">
                        <div style="flex: 1; min-width: 0;">
                            <p id="playerProgress" style="color: var(--primary); margin: 0.2rem 0 0.8rem 0; font-size: 1.1rem; font-weight: 800;"></p>
                            <p id="playerIntro" onclick="showFullIntro()" style="color: var(--text-dim); font-size: 1.05rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 5; line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;" title="點擊查看完整內容"></p>
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 1.2rem; margin-bottom: 2rem;">
                        <button class="btn btn-primary" id="resumeBtn" style="height: 70px; font-size: 1.4rem;">點擊續播</button>
                        <div style="display: flex; gap: 1rem;">
                            <button class="btn" id="prevBtn" style="flex: 1; height: 60px;"><span class="material-symbols-outlined">skip_previous</span> 上一集</button>
                            <button class="btn" id="nextBtn" style="flex: 1; height: 60px;"><span class="material-symbols-outlined">skip_next</span> 下一集</button>
                        </div>
                    </div>

                    <div id="lineSelector" class="line-selector"></div>
                    <div id="episodeGrid" class="episode-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 自定義確認視窗 (長輩大字版) -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-content">
            <div id="confirmMsg" class="modal-message"></div>
            <div class="modal-actions">
                <button class="btn btn-danger" style="height: 70px; font-size: 1.4rem;" id="modalConfirmBtn">確定，我要取消追蹤</button>
                <button class="btn" style="height: 70px; font-size: 1.4rem;" onclick="closeModal()">我點錯了，不要取消</button>
            </div>
        </div>
    </div>

    <!-- 劇情介紹完整版視窗 -->
    <div id="introModal" class="modal-overlay">
        <div class="intro-modal-content">
            <div class="intro-modal-header">
                <h2 style="margin: 0;">劇情介紹</h2>
            </div>
            <div id="fullIntroBody" class="intro-modal-body"></div>
            <div class="intro-modal-footer">
                <button class="btn btn-primary" style="width: 100%; height: 70px; font-size: 1.4rem;" onclick="closeIntroModal()">看完返回</button>
            </div>
        </div>
    </div>

    <!-- 管理者密碼驗證視窗 (長輩大字版) -->
    <div id="passwordModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-message">請輸入四位數管理密碼</div>
            <div style="display: flex; justify-content: center; margin-bottom: 2rem;">
                <input type="password" id="passwordInput" maxlength="4" inputmode="numeric" 
                       style="width: 240px; height: 80px; font-size: 3rem; text-align: center; border-radius: 20px; border: 2px solid var(--primary); background: #0f172a; color: var(--primary); letter-spacing: 1.2rem; padding-left: 1.2rem;">
            </div>
            <div id="passwordError" style="color: var(--danger); margin-bottom: 1.5rem; display: none; font-size: 1.2rem; font-weight: 600;">⚠️ 密碼錯誤，請重新輸入</div>
            <div class="modal-actions">
                <button class="btn btn-primary" style="height: 70px; font-size: 1.4rem;" onclick="validatePassword()">確定進入</button>
                <button class="btn" style="height: 70px; font-size: 1.4rem;" onclick="closePasswordModal()">不進去了</button>
            </div>
        </div>
    </div>

    <script>
        // --- 設定 (由您提供的 URL) ---
        const GAS_1 = "https://script.google.com/macros/s/AKfycbzwHa2fa4e_QdyfD3z01tXepwY9ZyY98UlS_6mjVGOsPZaoHVloSyEc9_kJniuNn2_X/exec";
        const GAS_2 = "https://script.google.com/macros/s/AKfycbzw88UmoJlK2n8CNn65QsitfC0N4OUk3I4WbDB72gCwj7ptR4i_A5hoI8aDuEGpHfks/exec";

        // --- 全域變數 ---
        let currentUser = null;
        let globalDramaList = JSON.parse(localStorage.getItem('cache_global_list') || '[]');
        let userLibrary = [];
        let userProgress = [];
        let currentDrama = null;
        let playingLineIdx = 0; // 正在播放/預載的線路索引
        let playingEpIdx = 0;   // 正在播放/預載的集數索引
        let viewingLineIdx = 0; // 目前正在切換標籤觀看的線路索引
        let pendingPasswordAction = null; // 密碼驗證通過後要執行的動作

        // --- 初始化 ---
        window.onload = async () => {
            updateFileModTime(); // 初始化顯示檔案最後修改時間
            const savedUser = localStorage.getItem('watch_user');

            // 設定影片自動播放下一集與進度記錄
            const video = document.getElementById('videoPlayer');
            video.onended = () => {
                const lines = JSON.parse(currentDrama.sources);
                if (playingEpIdx < lines[playingLineIdx].episodes.length - 1) {
                    playVideo(playingLineIdx, playingEpIdx + 1);
                }
            };

            video.ontimeupdate = () => {
                if (!currentDrama || !currentUser) return;
                const progIdx = userProgress.findIndex(p => p.dramaId.toString() === currentDrama.id.toString());
                if (progIdx !== -1) {
                    const MathFloorTs = Math.floor(video.currentTime);
                    if (video._lastTs !== MathFloorTs) {
                        video._lastTs = MathFloorTs;
                        userProgress[progIdx].timestamp = MathFloorTs;
                        localStorage.setItem(`cache_user_data_${currentUser.userId}`, JSON.stringify({library: userLibrary, progress: userProgress}));
                    }
                }
            };

            video.onpause = () => {
                syncProgressToCloud();
            };

            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                // 如果有緩存，先用緩存資料渲染首頁，避免白畫面
                syncFromCache();
                await startApp();
            } else {
                await loadUsers();
            }
        };

        function syncFromCache() {
            const cachedData = localStorage.getItem(`cache_user_data_${currentUser.userId}`);
            if (cachedData) {
                const data = JSON.parse(cachedData);
                userLibrary = data.library || [];
                userProgress = data.progress || [];
                renderHome();
            }
        }

        // --- 核心流程 ---
        async function loadUsers() {
            showView('userView');
            const list = document.getElementById('userList');
            
            // 先看緩存
            const cachedUsers = localStorage.getItem('cache_users');
            if (cachedUsers) {
                renderUserCards(JSON.parse(cachedUsers));
            } else {
                list.innerHTML = '<div class="spinner"></div><p>正在連線中...</p>';
            }

            try {
                const res = await fetch(`${GAS_2}?action=get_users`);
                const users = await res.json();
                localStorage.setItem('cache_users', JSON.stringify(users));
                renderUserCards(users);
            } catch (e) {
                console.error("Load users failed", e);
            }
        }

        function renderUserCards(users) {
            const list = document.getElementById('userList');
            list.innerHTML = users.map(u => `
                <div class="user-card" onclick='selectUser(${JSON.stringify(u)})'>
                    <div class="user-avatar">${u.userName[0]}</div>
                    <h3>${u.userName}</h3>
                </div>
            `).join('');
        }

        function selectUser(user) {
            if (user.userId === 'user_hataro') {
                showPasswordModal(() => loginUser(user));
            } else {
                loginUser(user);
            }
        }

        async function loginUser(user) {
            currentUser = user;
            localStorage.setItem('watch_user', JSON.stringify(user));
            await startApp();
        }

        function logout() {
            localStorage.removeItem('watch_user');
            location.reload();
        }

        async function startApp() {
            document.getElementById('appHeader').style.display = 'flex';
            const userBtn = document.getElementById('userBtn');
            userBtn.querySelector('span:last-child').innerText = currentUser.userName;
            
            // 先進首頁（快取內容已由 syncFromCache 備妥），不必空等雲端回應
            const grid = document.getElementById('myDramaGrid');
            if (!grid.innerHTML.trim()) {
                grid.innerHTML = '<div class="loading"><div class="spinner"></div>正在載入您的追劇清單...</div>';
            }
            showView('homeView');

            // 背景更新；兩邊資料都到齊後再渲染一次，避免 GAS-1 較慢時查不到封面與片名
            await Promise.all([syncGlobalList(), syncUserLibrary()]);
            renderHome();
            renderLibrary();
        }

        async function syncGlobalList() {
            try {
                const res = await fetch(GAS_1);
                globalDramaList = await res.json();
                localStorage.setItem('cache_global_list', JSON.stringify(globalDramaList));
            } catch (e) { console.error("Global sync failed", e); }
        }

        async function syncUserLibrary(skipHomeRefresh = false) {
            try {
                const res = await fetch(`${GAS_2}?action=get_user_data&userId=${currentUser.userId}`);
                const data = await res.json();
                userLibrary = data.library || [];
                userProgress = data.progress || [];
                
                // 緩存用戶專屬資料
                localStorage.setItem(`cache_user_data_${currentUser.userId}`, JSON.stringify(data));
                
                if (!skipHomeRefresh) renderHome();
                renderLibrary();
            } catch (e) { console.error("User sync failed", e); }
        }

        function updateFileModTime() {
            const lastMod = new Date(document.lastModified);
            const formatted = lastMod.getFullYear() + '-' + 
                              (lastMod.getMonth() + 1).toString().padStart(2, '0') + '-' + 
                              lastMod.getDate().toString().padStart(2, '0') + ' ' + 
                              lastMod.getHours().toString().padStart(2, '0') + ':' + 
                              lastMod.getMinutes().toString().padStart(2, '0') + ':' + 
                              lastMod.getSeconds().toString().padStart(2, '0');
            document.getElementById('fileModTime').innerText = `最後修改時間：${formatted}`;
        }

        // --- 畫面渲染 ---
        function showView(viewId) {
            const activeView = document.querySelector('.view.active');
            if (activeView && activeView.id === 'playerView' && viewId !== 'playerView') {
                stopPlayback();
            }
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            window.scrollTo(0,0);
        }

        function stopPlayback() {
            const video = document.getElementById('videoPlayer');
            if (video) {
                if (!video.paused) video.pause(); // 這會觸發 onpause 並呼叫 syncProgressToCloud
                else syncProgressToCloud(); // 如果已經暫停，主動呼叫一次以防萬一
            }
        }

        function syncProgressToCloud() {
            if (!currentDrama || !currentUser) return;
            const prog = userProgress.find(p => p.dramaId.toString() === currentDrama.id.toString());
            if (!prog) return;

            fetch(GAS_2, {
                method: 'POST',
                keepalive: true, // 確保頁面關閉時請求仍能發送
                body: JSON.stringify({
                    action: 'update_progress',
                    userId: currentUser.userId,
                    dramaId: currentDrama.id,
                    lineName: prog.lineName,
                    episodeName: prog.episodeName,
                    timestamp: prog.timestamp || 0
                })
            }).catch(e => console.error("Sync progress failed", e));
        }

        async function goHome() {
            showView('homeView');
            await syncUserLibrary(); // 回到首頁時同步最新進度與清單
        }

        function renderHome() {
            const grid = document.getElementById('myDramaGrid');
            if (userLibrary.length === 0) {
                grid.innerHTML = '<div style="text-align: center; padding: 4rem;">目前沒有追蹤的劇集！</div>';
                return;
            }

            // 依最後觀看時間排序
            const sortedLib = [...userLibrary].sort((a,b) => new Date(b.lastWatchedDate || 0) - new Date(a.lastWatchedDate || 0));
            
            grid.innerHTML = sortedLib.map(item => {
                const drama = globalDramaList.find(d => d.id.toString() === item.dramaId.toString());
                if (!drama) return '';
                const progress = userProgress.find(p => p.dramaId.toString() === item.dramaId.toString());
                return `
                    <div class="drama-card-horizontal" onclick="openPlayer('${drama.id}')">
                        <div class="remove-btn" onclick="confirmUntrack(event, '${drama.id}', '${drama.name.replace(/'/g, "\\'")}')" title="取消追蹤">
                            <span class="material-symbols-outlined" style="font-size: 20px;">close</span>
                        </div>
                        <div class="img-box">
                            <img src="${drama.cover_image}" onerror="this.parentElement.style.display='none'">
                        </div>
                        <div class="content-box">
                            <div class="title">${drama.name}</div>
                            <div class="progress-text">
                                ${progress ? `上次觀看：${progress.lineName} - ${progress.episodeName}` : '尚未開始觀看或紀錄中'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderLibrary() {
            const grid = document.getElementById('globalDramaGrid');
            
            // 排序邏輯：有追蹤的在前，沒追蹤的在後；各組內依更新時間降冪
            const sortedList = [...globalDramaList].sort((a, b) => {
                const isFollowedA = userLibrary.some(item => item.dramaId.toString() === a.id.toString());
                const isFollowedB = userLibrary.some(item => item.dramaId.toString() === b.id.toString());
                
                if (isFollowedA !== isFollowedB) {
                    return isFollowedA ? -1 : 1;
                }
                return new Date(b.update_time) - new Date(a.update_time);
            });

            grid.innerHTML = sortedList.map(drama => {
                const isFollowed = userLibrary.some(item => item.dramaId.toString() === drama.id.toString());
                const dramaNameEscaped = drama.name.replace(/'/g, "\\'");
                return `
                    <div class="library-item">
                        <div class="library-item-content">
                            <div class="library-item-title">${drama.name}</div>
                            <div class="library-item-meta ${isFollowed ? 'followed' : ''}">
                                ${isFollowed ? '<span class="material-symbols-outlined" style="font-size:1rem; vertical-align:middle;">check_circle</span> 已在追蹤清單' : '尚未追蹤'} · 更新於 ${new Date(drama.update_time).toLocaleDateString()}
                            </div>
                        </div>
                        <button class="btn ${isFollowed ? 'btn-danger' : 'btn-success'}" id="btn-follow-${drama.id}" 
                            onclick="${isFollowed ? `confirmUntrack(event, '${drama.id}', '${dramaNameEscaped}', true)` : `toggleFollow('${drama.id}', true)`}">
                            <span class="material-symbols-outlined">${isFollowed ? 'heart_minus' : 'heart_plus'}</span>
                            ${isFollowed ? '取消追蹤' : '追　　蹤'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        // --- 管理邏輯 ---
        async function toggleFollow(dramaId, skipHomeRefresh = false) {
            // 樂觀更新：先改本地狀態並立即重繪，不讓使用者空等雲端往返
            const prevLibrary = userLibrary;
            const prevProgress = userProgress;
            const isFollowed = userLibrary.some(item => item.dramaId.toString() === dramaId.toString());

            if (isFollowed) {
                userLibrary = userLibrary.filter(item => item.dramaId.toString() !== dramaId.toString());
                // 後端取消追蹤時會一併刪除進度，本地比照處理
                userProgress = userProgress.filter(p => p.dramaId.toString() !== dramaId.toString());
            } else {
                userLibrary = [...userLibrary, { userId: currentUser.userId, dramaId: dramaId, addedDate: new Date().toISOString(), lastWatchedDate: '' }];
            }
            applyLibraryChange(skipHomeRefresh);

            try {
                const res = await fetch(GAS_2, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'toggle_follow',
                        userId: currentUser.userId,
                        dramaId: dramaId
                    })
                });
                const result = await res.json();
                if (!result.success) throw new Error(result.error || '雲端回報失敗');
            } catch (e) {
                console.error("Toggle follow failed", e);
                // 寫入雲端失敗，回滾本地狀態以免與雲端不一致
                userLibrary = prevLibrary;
                userProgress = prevProgress;
                applyLibraryChange(skipHomeRefresh);
                alert('連線失敗，剛才的變更沒有存到雲端，請稍後再試一次。');
            }
        }

        function applyLibraryChange(skipHomeRefresh) {
            localStorage.setItem(`cache_user_data_${currentUser.userId}`, JSON.stringify({library: userLibrary, progress: userProgress}));
            if (!skipHomeRefresh) renderHome();
            renderLibrary();
        }

        async function confirmUntrack(event, dramaId, dramaName, skipHomeRefresh = false) {
            event.stopPropagation();
            const modal = document.getElementById('confirmModal');
            const msg = document.getElementById('confirmMsg');
            const confirmBtn = document.getElementById('modalConfirmBtn');

            msg.innerText = `確定要取消追蹤「${dramaName}」嗎？\n取消後將一併刪除播放進度喔！`;
            modal.style.display = 'flex';

            confirmBtn.onclick = async () => {
                closeModal();
                await toggleFollow(dramaId, skipHomeRefresh);
            };
        }

        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }

        function showFullIntro() {
            if (!currentDrama) return;
            const modal = document.getElementById('introModal');
            document.getElementById('fullIntroBody').innerText = currentDrama.introduction;
            modal.style.display = 'flex';
        }

        function closeIntroModal() {
            document.getElementById('introModal').style.display = 'none';
        }

        // --- 管理權限邏輯 ---
        function showPasswordModal(action) {
            pendingPasswordAction = action;
            const modal = document.getElementById('passwordModal');
            const input = document.getElementById('passwordInput');
            const error = document.getElementById('passwordError');
            input.value = '';
            error.style.display = 'none';
            modal.style.display = 'flex';
            input.focus();
        }

        function validatePassword() {
            const input = document.getElementById('passwordInput');
            const error = document.getElementById('passwordError');
            if (input.value === '0000') {
                const action = pendingPasswordAction;
                pendingPasswordAction = null;
                closePasswordModal();
                if (action) action();
            } else {
                error.style.display = 'block';
                input.value = '';
                input.focus();
            }
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').style.display = 'none';
        }

        // --- 播放邏輯 ---
        function openPlayer(dramaId) {
            currentDrama = globalDramaList.find(d => d.id.toString() === dramaId.toString());
            const progress = userProgress.find(p => p.dramaId.toString() === dramaId.toString());
            
            const playerCover = document.getElementById('playerCover');
            playerCover.style.display = ''; // 恢復顯示，避免前一部圖破掉被隱藏
            playerCover.src = currentDrama.cover_image;
            document.getElementById('playerTitle').innerText = currentDrama.name;
            document.getElementById('playerIntro').innerText = currentDrama.introduction;
            
            const lines = JSON.parse(currentDrama.sources);
            renderLines(lines, progress);
            
            // 預載：自動讀取進度對應的集數，但不播放
            const lIdx = progress ? lines.findIndex(l => l.line_name === progress.lineName) : 0;
            const episodeName = progress ? progress.episodeName : (lines[0] && lines[0].episodes[0] ? lines[0].episodes[0].name : null);
            if (episodeName) {
                const eIdx = lines[lIdx].episodes.findIndex(e => e.name === episodeName);
                if (eIdx !== -1) playVideo(lIdx, eIdx, false); // false 代表不自動播放
            }

            showView('playerView');
        }

        function renderLines(lines, progress) {
            const selector = document.getElementById('lineSelector');
            selector.innerHTML = lines.map((line, idx) => `
                <div class="line-tab ${progress && progress.lineName === line.line_name ? 'active' : ''}" 
                     id="line-tab-${idx}" onclick="selectLine(${idx})">
                    ${line.line_name}
                </div>
            `).join('');

            // 如果有進度，選取上次的線路，否則選第一個
            viewingLineIdx = progress ? lines.findIndex(l => l.line_name === progress.lineName) : 0;
            if (viewingLineIdx === -1) viewingLineIdx = 0;
            selectLine(viewingLineIdx);
        }

        function selectLine(idx) {
            viewingLineIdx = idx;
            document.querySelectorAll('.line-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`line-tab-${idx}`).classList.add('active');

            const lines = JSON.parse(currentDrama.sources);
            const episodes = lines[idx].episodes;
            const grid = document.getElementById('episodeGrid');
            
            // 從這部劇的當前進度（含剛剛點選的）來決定 highlight
            const progress = userProgress.find(p => p.dramaId.toString() === currentDrama.id.toString());
            
            grid.innerHTML = episodes.map((ep, eIdx) => {
                const isCurrent = progress && progress.lineName === lines[idx].line_name && progress.episodeName === ep.name;
                return `
                    <button class="ep-btn ${isCurrent ? 'active' : ''}" 
                            onclick="playVideo(${idx}, ${eIdx})">
                        ${ep.name}
                    </button>
                `;
            }).join('');
        }

        async function playVideo(lineIdx, epIdx, autoPlay = true) {
            playingLineIdx = lineIdx;
            playingEpIdx = epIdx;
            
            const lines = JSON.parse(currentDrama.sources);
            const line = lines[lineIdx];
            const ep = line.episodes[epIdx];
            const video = document.getElementById('videoPlayer');

            // 取得先前的時間 (如果是續播同一集)
            let startTimestamp = 0;
            const progIdx = userProgress.findIndex(p => p.dramaId.toString() === currentDrama.id.toString());
            if (progIdx !== -1) {
                const p = userProgress[progIdx];
                if (p.lineName === line.line_name && p.episodeName === ep.name && p.timestamp) {
                    startTimestamp = p.timestamp;
                }
            }

            // 立即同步本機進度，讓切換標籤時 highlight 能維持
            const newProg = { dramaId: currentDrama.id, lineName: line.line_name, episodeName: ep.name, timestamp: startTimestamp };
            if (progIdx !== -1) userProgress[progIdx] = newProg;
            else userProgress.push(newProg);
            
            // 寫入快取
            localStorage.setItem(`cache_user_data_${currentUser.userId}`, JSON.stringify({library: userLibrary, progress: userProgress}));
            video._lastTs = startTimestamp; // 重置影片記憶體標記

            // HLS 播放邏輯
            if (Hls.isSupported()) {
                if (window.currentHls) window.currentHls.destroy();
                const hls = new Hls();
                window.currentHls = hls;
                hls.loadSource(ep.play_url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    if (startTimestamp > 0) video.currentTime = startTimestamp;
                    if (autoPlay) video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ep.play_url;
                video.addEventListener('loadedmetadata', () => {
                    if (startTimestamp > 0) video.currentTime = startTimestamp;
                    if (autoPlay) video.play();
                }, { once: true });
            }

            // 更新高亮與按鈕狀態 (僅當目前觀看的線路就是播放的線路時)
            if (viewingLineIdx === lineIdx) {
                document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                const epButtons = document.querySelectorAll('.ep-btn');
                if (epButtons[epIdx]) epButtons[epIdx].classList.add('active');
            }
            
            document.getElementById('playerProgress').innerText = `${autoPlay ? '正在播放' : '備妥待播'}：${line.line_name} - ${ep.name}`;

            // 更新 上一集 / 下一集 按鈕狀態
            document.getElementById('prevBtn').disabled = (epIdx === 0);
            document.getElementById('nextBtn').disabled = (epIdx === line.episodes.length - 1);

            // 同步進度到雲端
            syncProgressToCloud();
        }

        function enterFullscreen() {
            const video = document.getElementById('videoPlayer');
            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen();
            }
            video.play().catch(() => {});
        }

        // 續播、上一集、下一集
        document.getElementById('resumeBtn').onclick = () => {
            const progress = userProgress.find(p => p.dramaId.toString() === currentDrama.id.toString());
            const lines = JSON.parse(currentDrama.sources);
            if (progress) {
                const lIdx = lines.findIndex(l => l.line_name === progress.lineName);
                const eIdx = lines[lIdx].episodes.findIndex(e => e.name === progress.episodeName);
                playVideo(lIdx, eIdx);
            } else {
                playVideo(0, 0);
            }
        };

        document.getElementById('prevBtn').onclick = () => {
            if (playingEpIdx > 0) playVideo(playingLineIdx, playingEpIdx - 1);
        };

        document.getElementById('nextBtn').onclick = () => {
            const lines = JSON.parse(currentDrama.sources);
            if (playingEpIdx < lines[playingLineIdx].episodes.length - 1) playVideo(playingLineIdx, playingEpIdx + 1);
        };
    </script>
</body>
</html>
