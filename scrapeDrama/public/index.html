<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抓劇小幫手 - 影視管理系統</title>
    <!-- Favicon & iOS App Icon -->
    <link rel="icon" href="/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="抓劇小幫手">
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --primary: #f59e0b;
            --primary-glow: rgba(245, 158, 11, 0.3);
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #f43f5e;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding-top: 100px; /* 為固定 Header 留出空間 */
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(15px);
            z-index: 1000;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 1000px;
            margin: 0 auto;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-img {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            box-shadow: 
                0 4px 10px rgba(0,0,0,0.5),
                inset 0 1px 1px rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            object-fit: cover;
            filter: drop-shadow(0 2px 5px rgba(255, 158, 11, 0.3));
        }

        .btn {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-decoration: none;
            font-size: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #2d3748;
            border-color: rgba(255,255,255,0.2);
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
            border: none;
        }

        .btn-primary:hover {
            background: #fbbf24;
            box-shadow: 0 8px 25px var(--primary-glow);
        }

        .btn-secondary {
            background: #0ea5e9; /* Sky blue */
            color: #fff;
            border: none;
        }

        .btn-secondary:hover {
            background: #38bdf8;
            box-shadow: 0 8px 25px rgba(14, 165, 233, 0.3);
        }

        #navButtons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        /* --- Dashboard View --- */
        .drama-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 2rem;
            animation: fadeIn 0.6s ease-out;
        }

        .drama-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
        }

        .drama-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            border-color: var(--primary);
        }

        .drama-card .img-container {
            width: 100%;
            aspect-ratio: 2/3;
            overflow: hidden;
            background: #000;
        }

        .drama-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .drama-card:hover img {
            transform: scale(1.1);
        }

        .drama-info {
            padding: 1.2rem;
            background: linear-gradient(to top, var(--card-bg), transparent);
        }

        .drama-title {
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
            margin-bottom: 0.8rem;
            line-height: 1.4;
            height: 2.8rem; /* 剛好兩行的高度 */
            display: -webkit-box;
            -webkit-line-clamp: 2; /* 顯示兩行 */
            -webkit-box-orient: vertical;
            overflow: hidden;
            white-space: normal;
        }

        .drama-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .btn-icon {
            background: rgba(255,255,255,0.05);
            color: var(--text-dim);
            border: none;
            padding: 0.5rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .btn-icon:hover {
            background: rgba(244, 63, 94, 0.2);
            color: var(--danger);
        }

        /* --- Scrape View --- */
        #scrapeView {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .scrape-panel {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .input-wrapper {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        input {
            flex: 1;
            background: #0f172a;
            border: 2px solid rgba(255,255,255,0.1);
            padding: 1rem 1.5rem;
            border-radius: 14px;
            color: #fff;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: #1e293b;
        }

        /* --- Progress & Logs --- */
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .progress-bar-container {
            height: 10px;
            background: #0f172a;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 2rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .progress-bar-value {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #fbbf24);
            width: 0%;
            transition: width 0.4s ease;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .log-box {
            background: #000;
            padding: 1.5rem;
            border-radius: 14px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.85rem;
            height: 250px;
            overflow-y: auto;
            color: #10b981;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .log-line { margin-bottom: 0.4rem; opacity: 0.9; }

        #successPanel {
            margin-top: 2rem;
            display: none;
            padding: 1.5rem;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 16px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            animation: slideUp 0.4s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-view {
            text-align: center;
            padding: 8rem 2rem;
            color: var(--text-dim);
            grid-column: 1 / -1;
        }

        .empty-view .material-symbols-outlined {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            opacity: 0.3;
        }

        /* --- Responsive Design / Mobile --- */
        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .container {
                padding-top: 140px;
            }
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            header h1 {
                font-size: 1.5rem;
            }
            .logo-img {
                width: 35px;
                height: 35px;
            }
            #navButtons {
                width: 100%;
                justify-content: center;
                gap: 0.5rem;
            }
            .btn {
                padding: 0.6rem 0.8rem;
                font-size: 0.9rem;
                flex: 1;
                justify-content: center;
            }
            .drama-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }
            .drama-info {
                padding: 0.8rem;
            }
            .drama-title {
                font-size: 0.95rem;
                height: 2.6rem;
                margin-bottom: 0.5rem;
            }
            .input-wrapper {
                flex-direction: column;
            }
            #scrapeView .btn {
                flex: none;
                width: 100%;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header>
            <h1><img src="icon.png" alt="Logo" class="logo-img"> 抓劇小幫手</h1>
            <div id="navButtons">
                <!-- 新增的小鴨影音捷徑按鈕 -->
                <a href="https://777tv.ai" target="_blank" class="btn btn-secondary">
                    <span class="material-symbols-outlined">exit_to_app</span> 小鴨影音
                </a>
                <button id="showAddBtn" class="btn btn-primary">
                    <span class="material-symbols-outlined">add_circle</span> 新增劇集
                </button>
                <button id="showListBtn" class="btn" style="display: none;">
                    <span class="material-symbols-outlined">dashboard</span> 返回管理
                </button>
            </div>
        </header>

        <!-- Dashboard View -->
        <div id="listView">
            <div id="dramaGrid" class="drama-grid">
                <!-- Data will be injected here -->
            </div>
        </div>

        <!-- Scrape View -->
        <div id="scrapeView">
            <div class="scrape-panel">
                <div class="input-wrapper">
                    <input type="text" id="targetId" placeholder="輸入 777TV 劇集 ID (例如: 351808)">
                    <button id="runBtn" class="btn btn-primary">啟動任務</button>
                </div>

                <div id="statusSection" style="display: none;">
                    <div class="status-header">
                        <span id="statusLabel" style="color: var(--primary); font-weight: 600;">初始化中...</span>
                        <span id="percentLabel" style="color: var(--text-dim);">0%</span>
                    </div>
                    <div class="progress-bar-container">
                        <div id="progressBar" class="progress-bar-value"></div>
                    </div>
                    <div id="consoleLog" class="log-box"></div>
                </div>

                <div id="successPanel">
                    <!-- Success details will appear here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const listView = document.getElementById('listView');
        const scrapeView = document.getElementById('scrapeView');
        const dramaGrid = document.getElementById('dramaGrid');
        const showAddBtn = document.getElementById('showAddBtn');
        const showListBtn = document.getElementById('showListBtn');

        // --- Navigation ---
        showAddBtn.onclick = () => {
            listView.style.display = 'none';
            scrapeView.style.display = 'block';
            showAddBtn.style.display = 'none';
            showListBtn.style.display = 'flex';
            resetScrapeUI();
        };

        showListBtn.onclick = () => {
            scrapeView.style.display = 'none';
            listView.style.display = 'block';
            showListBtn.style.display = 'none';
            showAddBtn.style.display = 'flex';
            fetchDramas();
        };

        // --- Data Fetching ---
        async function fetchDramas() {
            dramaGrid.innerHTML = '<div class="empty-view"><div class="loading-spinner" style="margin: 0 auto 1.5rem;"></div>正在同步資料庫...</div>';
            try {
                const res = await fetch('/api/list-dramas');
                let items = await res.json();
                
                if (!items || items.length === 0) {
                    dramaGrid.innerHTML = `
                        <div class="empty-view">
                            <span class="material-symbols-outlined">cloud_off</span>
                            <p>資料庫目前空空如也，點擊新增按鈕開始抓取第一部劇集吧！</p>
                        </div>
                    `;
                    return;
                }

                // 依更新時間降冪排列 (近期排在前面)
                items.sort((a, b) => new Date(b.update_time) - new Date(a.update_time));

                dramaGrid.innerHTML = items.map(item => `
                    <div class="drama-card" id="item-${item.id}">
                        <div class="img-container">
                            <img src="${item.cover_image || 'https://via.placeholder.com/300x450?text=無封面圖'}" alt="${item.name}" onerror="this.parentElement.style.display='none'">
                        </div>
                        <div class="drama-info">
                            <div class="drama-title" title="${item.name}">${item.name}</div>
                            <div class="drama-actions">
                                <button class="btn-icon" onclick="handleDelete('${item.id}', '${item.name}')">
                                    <span class="material-symbols-outlined">delete</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                dramaGrid.innerHTML = `<div class="empty-view">連線錯誤: ${err.message}</div>`;
            }
        }

        // --- Deletion ---
        async function handleDelete(id, name) {
            if (!confirm(`🤔 確定要從資料庫中移除「${name}」嗎？`)) return;
            
            const card = document.getElementById(`item-${id}`);
            card.style.opacity = '0.3';
            card.style.pointerEvents = 'none';

            try {
                const res = await fetch('/api/delete-drama', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                const result = await res.text();
                if (result.includes('Deleted')) {
                    card.remove();
                    if (dramaGrid.children.length === 0) fetchDramas();
                } else {
                    alert('刪除失敗: ' + result);
                    card.style.opacity = '1';
                    card.style.pointerEvents = 'auto';
                }
            } catch (err) {
                alert('系統錯誤: ' + err.message);
                card.style.opacity = '1';
                card.style.pointerEvents = 'auto';
            }
        }

        // --- Scraper Engine ---
        const runBtn = document.getElementById('runBtn');
        const idInput = document.getElementById('targetId');
        const statusSection = document.getElementById('statusSection');
        const progressBar = document.getElementById('progressBar');
        const percentLabel = document.getElementById('percentLabel');
        const statusLabel = document.getElementById('statusLabel');
        const consoleLog = document.getElementById('consoleLog');
        const successPanel = document.getElementById('successPanel');

        function logLine(msg) {
            const row = document.createElement('div');
            row.className = 'log-line';
            row.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            consoleLog.appendChild(row);
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        function resetScrapeUI() {
            statusSection.style.display = 'none';
            successPanel.style.display = 'none';
            consoleLog.innerHTML = '';
            progressBar.style.width = '0%';
            percentLabel.innerText = '0%';
            idInput.value = '';
            runBtn.disabled = false;
        }

        runBtn.onclick = () => {
            const id = idInput.value.trim();
            if (!id) return alert('請先輸入 777TV ID');

            resetScrapeUI();
            statusSection.style.display = 'block';
            runBtn.disabled = true;
            logLine(`🚀 任務啟動：串接 ID ${id}`);

            const sse = new EventSource(`/api/scrape-progress?id=${id}`);

            sse.addEventListener('status', (e) => {
                const data = JSON.parse(e.data);
                statusLabel.innerText = data.message;
                logLine(data.message);
            });

            sse.addEventListener('progress', (e) => {
                const data = JSON.parse(e.data);
                const percent = Math.floor((data.current / data.total) * 100);
                progressBar.style.width = percent + '%';
                percentLabel.innerText = percent + '%';
                statusLabel.innerText = data.message;
                if (data.line && data.episode) {
                    logLine(`擷取中: ${data.line} → ${data.episode}`);
                }
            });

            sse.addEventListener('done', (e) => {
                const data = JSON.parse(e.data);
                sse.close();
                runBtn.disabled = false;

                if (data.success) {
                    successPanel.style.display = 'block';
                    let coverImg = '';
                    if (data.data.cover_image) {
                        coverImg = `<img src="${data.data.cover_image}" style="width: 70px; height: 100px; object-fit: cover; border-radius: 8px; float: left; margin-right: 1.2rem;">`;
                    }
                    successPanel.innerHTML = `
                        <div style="overflow: hidden;">
                            ${coverImg}
                            <div style="color: var(--success); font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem;">
                                <span class="material-symbols-outlined">check_circle</span> 抓取成功並已同步
                            </div>
                            <strong style="font-size: 1.1rem; display: block; margin-bottom: 0.3rem;">${data.data.name}</strong>
                            <p style="font-size: 0.85rem; color: var(--text-dim);">${data.status}</p>
                        </div>
                    `;
                    logLine('✨ 任務成功結束');
                } else {
                    alert('失敗: ' + data.error);
                    logLine('❌ 任務失敗: ' + data.error);
                }
            });

            sse.onerror = (e) => {
                sse.close();
                runBtn.disabled = false;
                logLine('⚠️ 通訊異常或伺服器連線中斷');
            };
        };

        // Initialize Dashboard
        fetchDramas();
    </script>
</body>
</html>
