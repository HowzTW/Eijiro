<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>預約回撥排程</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>預約回撥排程</h1>
      <button id="addBtn">＋ 新增</button>
    </header>

    <div id="formSection" class="hidden">
      <form id="recordForm">
        <input type="hidden" id="editId">
        <div class="form-row">
          <div class="form-group">
            <label>日期</label>
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <label>時間</label>
            <div class="time-select">
              <select id="timeHour"></select>
              <span class="time-colon">:</span>
              <select id="timeMinute"></select>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>電話號碼</label>
          <input type="tel" id="phone" placeholder="0912345678" required>
        </div>
        <div class="form-group">
          <label>備註 <span class="optional">（選填）</span></label>
          <textarea id="memo" rows="3" placeholder="輸入備註..."></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" id="saveBtn">儲存</button>
          <button type="button" id="cancelBtn">取消</button>
        </div>
      </form>
    </div>

    <div id="listSection">
      <div id="recordList"></div>
      <div id="emptyState" class="hidden">目前沒有預約紀錄</div>
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
