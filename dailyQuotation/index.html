<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0c29">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>每日箴言 | 沉浸式海報</title>
    <!-- Google Fonts & Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Montserrat:wght@300;400;700&display=swap">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-blur: blur(20px);
            --accent: #f1c40f;
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background-color: #0f0c29;
            /* Solid top color for iOS status bar */
        }

        body,
        html {
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Montserrat', 'Noto Serif TC', serif;
            color: var(--text-main);
        }

        body {
            background-color: #0f0c29;
        }

        /* App Container */
        .poster-wrapper {
            position: relative;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: calc(60px + env(safe-area-inset-top)) 20px 60px;
            /* Reduced base top padding, plus safe area */
            z-index: 10;
        }

        header {
            position: absolute;
            top: 30px;
            display: flex;
            align-items: center;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 1.1rem;
        }

        header .material-symbols-rounded {
            font-size: 32px;
            margin-right: 12px;
            color: var(--accent);
        }

        /* Main Poster Card */
        #poster_card {
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('background.png');
            background-size: cover;
            background-position: center;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            width: 100%;
            max-width: 500px;
            padding: 15px 10px;
            /* Drastically reduced for compactness */
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            /* Minimum gap */
            position: relative;
            overflow: hidden;
        }

        .card-title {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 10px;
            margin-bottom: 0px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .date-label {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 3px;
            margin-bottom: 5px;
            /* Adjusting space to quote box */
        }

        .quote-content {
            font-family: 'Noto Serif TC', serif;
            font-size: 2rem;
            font-weight: 900;
            line-height: 1.6;
            color: var(--text-main);
            word-break: break-word;
            position: relative;
            margin: 0px 0 5px;
            padding: 10px 15px 15px 15px;
            /* Drastically reduced padding */
            border-radius: 10px;
            transition: background 0.3s;
            cursor: text;
            outline: none;
            text-align: left;
            width: 100%;
        }

        .quote-content:focus {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 1px var(--glass-border);
        }

        .quote-content::before {
            content: "“";
            position: absolute;
            top: -30px;
            /* Adjusted for smaller size */
            left: -10px;
            font-size: 4rem;
            /* Reduced from 5.5rem */
            color: var(--accent);
            opacity: 1;
            pointer-events: none;
        }

        .quote-content::after {
            content: "”";
            position: absolute;
            bottom: -65px;
            /* Moved down further to handle compact padding */
            right: 0px;
            font-size: 4rem;
            color: var(--accent);
            opacity: 1;
            pointer-events: none;
        }

        .quote-source {
            font-size: 1rem;
            /* Further reduced for hierarchy */
            font-weight: 700;
            /* Bolder */
            color: var(--text-main);
            /* Higher contrast */
            text-align: right;
            width: 100%;
            padding: 5px;
            border-radius: 5px;
            transition: background 0.3s;
            cursor: text;
            outline: none;
        }

        .quote-source:focus {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 1px var(--glass-border);
        }

        .quote-author {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--accent);
            text-align: right;
            width: 100%;
            margin-top: 5px;
            /* Minimal gap above author */
        }

        .landmark-badge {
            background: rgba(0, 0, 0, 0.4);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        /* Nav Controls */
        #controls {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .circle-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .circle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .date-input-wrapper {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 10px 20px;
        }

        input[type="date"] {
            background: transparent;
            border: none;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }

        /* Floating Action Button (FAB) */
        #download_area {
            position: fixed;
            bottom: calc(30px + env(safe-area-inset-bottom));
            right: 30px;
            z-index: 100;
        }

        #download_area .circle-btn {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 70px;
            height: 70px;
        }

        #download_area .circle-btn .material-symbols-rounded {
            font-size: 32px;
        }

        /* Prompt Modal */
        #prompt_modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: rgba(20, 20, 35, 0.95);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--accent);
            font-size: 1.2rem;
            font-weight: 700;
        }

        #prompt_text_area {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            color: #eee;
            font-size: 0.95rem;
            line-height: 1.7;
            max-height: 50vh;
            overflow-y: auto;
            outline: none;
            cursor: text;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .action-btn {
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-copy {
            background: var(--accent);
            color: #000;
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        footer {
            position: fixed;
            bottom: 0;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
            width: 100%;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            z-index: 100;
        }

        /* Responsive Mobile */
        @media (max-width: 500px) {
            .circle-btn {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>

<body>

    <div class="poster-wrapper">
        <header>
            <span class="material-symbols-rounded">format_quote</span>
            <span>Daily Quotation</span>
        </header>

        <div id="controls">
            <div class="circle-btn" onclick="adjustDate(-1)">
                <span class="material-symbols-rounded">chevron_left</span>
            </div>
            <div class="date-input-wrapper">
                <input type="date" id="date_input" onchange="handleDateChange()">
            </div>
            <div class="circle-btn" onclick="adjustDate(1)">
                <span class="material-symbols-rounded">chevron_right</span>
            </div>
        </div>

        <div id="poster_card">
            <div class="card-title">每日箴言</div>
            <div id="date_label" class="date-label"></div>
            <div id="quote_text" class="quote-content" contenteditable="true" spellcheck="false">正在載入智慧...</div>

            <div style="width: 100%; text-align: right;">
                <div class="quote-author">——池田大作</div>
                <div id="source_text" class="quote-source" contenteditable="true" spellcheck="false"></div>
            </div>

            <div id="landmark_info" class="landmark-badge" style="display:none;">
                <span class="material-symbols-rounded">location_on</span>
                <span id="landmark_name"></span>
            </div>
        </div>
    </div>

    <div id="download_area">
        <div class="circle-btn" onclick="openPromptModal()" title="AI 提示詞產生器">
            <span class="material-symbols-rounded">psychology</span>
        </div>
    </div>

    <!-- AI Prompt Modal -->
    <div id="prompt_modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>AI 提示詞產生器</span>
                <span class="material-symbols-rounded" style="cursor:pointer" onclick="closeModal()">close</span>
            </div>
            <div id="prompt_text_area" contenteditable="true" spellcheck="false">
                正在產生提示詞...
            </div>
            <div class="modal-actions">
                <button class="action-btn btn-copy" onclick="copyPrompt()">
                    <span class="material-symbols-rounded">content_copy</span> 複製
                </button>
            </div>
        </div>
    </div>

    <footer>
        LAST UPDATED: <span id="last_mod"></span> | TPE TIME
    </footer>

    <script>
        let quotations = [];
        const dateInput = document.getElementById('date_input');
        const quoteText = document.getElementById('quote_text');
        const dateLabel = document.getElementById('date_label');
        const sourceText = document.getElementById('source_text');

        async function init() {
            try {
                // 讀取資料
                const dataRes = await fetch('data-cht.json');
                quotations = await dataRes.json();

                setToToday();
                updateLastMod();
            } catch (e) {
                quoteText.innerText = "無法載入資源。";
            }
        }

        function setToToday() {
            const now = new Date();
            dateInput.value = now.toISOString().split('T')[0];
            updatePoster();
        }

        function adjustDate(offset) {
            const d = new Date(dateInput.value);
            d.setDate(d.getDate() + offset);
            dateInput.value = d.toISOString().split('T')[0];
            updatePoster();
        }

        function handleDateChange() {
            updatePoster();
        }

        // 處理點擊外部自動取消編輯狀態與關閉彈出視窗
        document.addEventListener('click', (e) => {
            const quote = document.getElementById('quote_text');
            const source = document.getElementById('source_text');
            const modal = document.getElementById('prompt_modal');
            const modalBody = document.querySelector('.modal-content');

            // 處理內容編輯區域的失焦：只有當點選的地方不是 quote 或 source 時才失焦
            if (!quote.contains(e.target) && !source.contains(e.target)) {
                if (document.activeElement === quote || document.activeElement === source) {
                    document.activeElement.blur();
                }
            }

            // 處理彈出視窗點擊外部關閉
            if (modal.style.display === 'flex' && e.target === modal) {
                closeModal();
            }
        });

        function updatePoster() {
            const d = new Date(dateInput.value);
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            const targetDate = `${mm}月${dd}日`;

            dateLabel.innerText = targetDate;
            const item = quotations.find(q => q.date === targetDate);

            if (item) {
                quoteText.innerText = item.content;
                sourceText.innerText = item.source.replace(/<\/?[^>]+(>|$)/g, "");

                // 更新地標資訊
                const landmarkInfo = document.getElementById('landmark_info');
                const landmarkName = document.getElementById('landmark_name');
                if (item.background) {
                    landmarkName.innerText = item.background;
                    landmarkInfo.style.display = 'flex';
                } else {
                    landmarkInfo.style.display = 'none';
                }
            } else {
                quoteText.innerText = "此日期目前無箴言。";
                sourceText.innerText = "";
                document.getElementById('landmark_info').style.display = 'none';
            }
        }

        async function openPromptModal() {
            const modal = document.getElementById('prompt_modal');
            const textArea = document.getElementById('prompt_text_area');
            modal.style.display = 'flex';
            textArea.innerText = "正在讀取範本...";

            try {
                // 動態讀取範本
                const response = await fetch('prompt-cht.txt');
                let template = await response.text();

                // 準備替換的內容
                const d = new Date(dateInput.value);
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const dateStr = `${mm}月${dd}日`;

                const item = quotations.find(q => q.date === dateStr) || {};

                // 優先使用目前畫面上可能已經編輯過的文字
                const currentContent = quoteText.innerText;
                const currentSource = sourceText.innerText.replace(/^—\s*/, "");
                const backgroundCh = item.background || "自然風景";
                const backgroundEn = item['background-eng'] || "Nature orientation";

                // 進行佔位符替換
                let prompt = template
                    .replace(/《background》/g, backgroundCh)
                    .replace(/《background-eng》/g, backgroundEn)
                    .replace(/《date》/g, dateStr)
                    .replace(/《content》/g, currentContent)
                    .replace(/《source》/g, currentSource);

                textArea.innerText = prompt;
            } catch (err) {
                console.error("無法產生提示詞:", err);
                textArea.innerText = "無法載入 prompt-cht.txt 範本。內容如下：\n" + quoteText.innerText;
            }
        }

        function closeModal() {
            document.getElementById('prompt_modal').style.display = 'none';
        }

        function copyPrompt() {
            const text = document.getElementById('prompt_text_area').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const copyBtn = document.querySelector('.btn-copy');
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '<span class="material-symbols-rounded">done</span> 已複製';
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                }, 2000);
            }).catch(err => {
                alert("複製失敗，請手動選取文字。");
            });
        }

        function downloadPoster() {
            // 保留下載功能供內部測試或未來恢復，但目前 UI 不呼叫它
            const target = document.querySelector('.poster-wrapper');
            html2canvas(target, {
                useCORS: true,
                backgroundColor: "#000000",
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Quote.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        function updateLastMod() {
            const m = new Date(document.lastModified);
            const options = {
                timeZone: 'Asia/Taipei',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            const formatter = new Intl.DateTimeFormat('sv-SE', options); // Using sv-SE for YYYY-MM-DD HH:mm:ss format
            document.getElementById('last_mod').innerText = formatter.format(m).replace(' ', ' ');
        }

        init();
    </script>
</body>

</html>
