<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日箴言 | 沉浸式海報</title>
    <!-- Google Fonts & Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Montserrat:wght@300;400;700&display=swap">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-blur: blur(20px);
            --accent: #f1c40f;
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Montserrat', 'Noto Serif TC', serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: var(--text-main);
        }

        /* App Container */
        .poster-wrapper {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 100px 20px 60px;
            z-index: 10;
        }

        header {
            position: absolute;
            top: 30px;
            display: flex;
            align-items: center;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 1.1rem;
        }

        header .material-symbols-rounded {
            font-size: 32px;
            margin-right: 12px;
            color: var(--accent);
        }

        /* Main Poster Card */
        #poster_card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            width: 100%;
            max-width: 500px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            position: relative;
        }

        .date-label {
            font-size: 1.2rem;
            font-weight: 300;
            color: var(--text-sub);
            letter-spacing: 2px;
        }

        .quote-content {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.8rem;
            font-weight: 900;
            line-height: 1.6;
            color: var(--text-main);
            word-break: break-all;
            position: relative;
            margin: 20px 0;
            padding: 10px 10px 10px 20px;
            border-radius: 10px;
            transition: background 0.3s;
            cursor: text;
            outline: none;
            text-align: left;
            width: 100%;
        }

        .quote-content:focus {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 1px var(--glass-border);
        }

        .quote-content::before {
            content: "“";
            position: absolute;
            top: -40px;
            left: -20px;
            font-size: 6rem;
            color: var(--accent);
            opacity: 0.3;
            pointer-events: none;
        }

        .quote-source {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-sub);
            text-align: right;
            width: 100%;
            padding: 5px;
            border-radius: 5px;
            transition: background 0.3s;
            cursor: text;
            outline: none;
        }

        .quote-source:focus {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 1px var(--glass-border);
        }

        .landmark-badge {
            background: rgba(0, 0, 0, 0.4);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        /* Nav Controls */
        #controls {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .circle-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .circle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .date-input-wrapper {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 10px 20px;
        }

        input[type="date"] {
            background: transparent;
            border: none;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }

        /* Downloader */
        #download_area {
            position: fixed;
            top: 20px;
            right: 20px;
        }

        footer {
            position: fixed;
            bottom: 15px;
            width: 100%;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }

        /* Responsive Mobile */
        @media (max-width: 500px) {
            #poster_card {
                padding: 40px 25px;
            }

            .quote-content {
                font-size: 1.4rem;
            }

            .circle-btn {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>

<body>

    <div class="poster-wrapper">
        <header>
            <span class="material-symbols-rounded">format_quote</span>
            <span>Daily Quotation</span>
        </header>

        <div id="controls">
            <div class="circle-btn" onclick="adjustDate(-1)">
                <span class="material-symbols-rounded">chevron_left</span>
            </div>
            <div class="date-input-wrapper">
                <input type="date" id="date_input" onchange="handleDateChange()">
            </div>
            <div class="circle-btn" onclick="adjustDate(1)">
                <span class="material-symbols-rounded">chevron_right</span>
            </div>
        </div>

        <div id="poster_card">
            <div id="date_label" class="date-label"></div>
            <div id="quote_text" class="quote-content" contenteditable="true" spellcheck="false">正在載入智慧...</div>
            <div id="source_text" class="quote-source" contenteditable="true" spellcheck="false"></div>
            <div id="landmark_info" class="landmark-badge" style="display:none;">
                <span class="material-symbols-rounded">location_on</span>
                <span id="landmark_name"></span>
            </div>
        </div>
    </div>

    <div id="download_area">
        <div class="circle-btn" onclick="downloadPoster()" title="下載海報">
            <span class="material-symbols-rounded">download</span>
        </div>
    </div>

    <footer>
        LAST UPDATED: <span id="last_mod"></span> | TPE TIME
    </footer>

    <script>
        let quotations = [];
        const dateInput = document.getElementById('date_input');
        const quoteText = document.getElementById('quote_text');
        const dateLabel = document.getElementById('date_label');
        const sourceText = document.getElementById('source_text');

        async function init() {
            try {
                // 讀取資料
                const dataRes = await fetch('data-cht.json');
                quotations = await dataRes.json();

                setToToday();
                updateLastMod();
            } catch (e) {
                quoteText.innerText = "無法載入資源。";
            }
        }

        function setToToday() {
            const now = new Date();
            dateInput.value = now.toISOString().split('T')[0];
            updatePoster();
        }

        function adjustDate(offset) {
            const d = new Date(dateInput.value);
            d.setDate(d.getDate() + offset);
            dateInput.value = d.toISOString().split('T')[0];
            updatePoster();
        }

        function handleDateChange() {
            updatePoster();
        }

        // 處理點擊外部自動取消編輯狀態
        document.addEventListener('click', (e) => {
            const quote = document.getElementById('quote_text');
            const source = document.getElementById('source_text');

            // 如果點選的不是編輯區塊，且目前正在編輯中，則強制取消焦點
            if (e.target !== quote && e.target !== source) {
                if (document.activeElement === quote || document.activeElement === source) {
                    document.activeElement.blur();
                }
            }
        });

        function updatePoster() {
            const d = new Date(dateInput.value);
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            const targetDate = `${mm}月${dd}日`;

            dateLabel.innerText = targetDate;
            const item = quotations.find(q => q.date === targetDate);

            if (item) {
                quoteText.innerText = item.content;
                sourceText.innerText = "— " + item.source.replace(/<\/?[^>]+(>|$)/g, "");
            } else {
                quoteText.innerText = "此日期目前無箴言。";
                sourceText.innerText = "";
            }
        }

        function downloadPoster() {
            const btn = document.querySelector('#download_area .circle-btn');
            const originalIcon = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-rounded">sync</span>';

            // 縮小目標範圍至 .poster-wrapper
            const target = document.querySelector('.poster-wrapper');

            html2canvas(target, {
                useCORS: true,
                allowTaint: false,
                backgroundColor: "#000000",
                scale: 2,
                logging: true
            }).then(canvas => {
                try {
                    const link = document.createElement('a');
                    link.download = `DailyQuotation_${dateLabel.innerText}.png`;
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                } catch (err) {
                    console.error("下載失敗:", err);
                    alert("海報產生失敗，這通常與圖片存取限制有關。");
                }
                btn.innerHTML = originalIcon;
            }).catch(err => {
                console.error("渲染失敗:", err);
                alert("產生海報時發生錯誤。");
                btn.innerHTML = originalIcon;
            });
        }

        function updateLastMod() {
            const m = new Date(document.lastModified);
            document.getElementById('last_mod').innerText = m.toISOString().replace('T', ' ').split('.')[0];
        }

        init();
    </script>
</body>

</html>
